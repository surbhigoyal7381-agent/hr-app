version: "3.8"

# ── Kinexus HRMS – Local Development Stack ──────────────────────────────
# Multi-tenant on localhost:
#   • Port 80  via Nginx  →  *.localhost hostnames  (multi-tenant, recommended)
#   • Port 8000 direct    →  hrms.localhost          (legacy single-site)
#
# Add new local tenants:
#   docker exec docker-frappe-1 bash /workspace/provision_tenant.sh myco "My Company"
# Then open http://myco.localhost in Chrome (resolves automatically).
# Other browsers: add  127.0.0.1 myco.localhost  to your hosts file first.

services:
  mariadb:
    image: mariadb:10.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: 123
    volumes:
      - mariadb-data:/var/lib/mysql

  redis:
    image: redis:alpine

  frappe:
    image: frappe/bench:latest
    command: bash /workspace/init.sh
    environment:
      - SHELL=/bin/bash
      - BASE_DOMAIN=localhost
    working_dir: /home/frappe
    volumes:
      - .:/workspace
      - ../../grace_goals:/home/frappe/frappe-bench/apps/grace_goals
      - ../../grace_vendor_portal:/home/frappe/frappe-bench/apps/grace_vendor_portal
    expose:
      - "8000"
      - "9000"
    # Keep direct port for legacy access and bench CLI tools
    ports:
      - 8000:8000
      - 9000:9000

  # ── Local Nginx: routes *.localhost → Frappe by Host header ─────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx-local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frappe

volumes:
  mariadb-data:
