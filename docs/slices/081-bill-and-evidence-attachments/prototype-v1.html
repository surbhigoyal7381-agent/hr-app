<style>
/* Alvora design-system tokens, copied from templates/includes/design_system.html */
html[data-theme="light"]{

html[data-theme="dark"]{

  --text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;--primary:#A99AD4;--primary-h:#BBAEE0;

  --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60);

:root{

  --r:10px;--r-sm:6px;--r-full:999px;

}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs-base)}

/* review scaffolding: wraps, never sticky (ux-learnings) */
#rv{background:var(--surface);border-bottom:1px solid var(--border);padding:10px 14px;
    display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end}
#rv h1{font-size:var(--fs-md);margin:0 8px 0 0;font-weight:700;align-self:center}
#rv .g{display:flex;flex-direction:column;gap:3px}
#rv label{font-size:var(--fs-xs);color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
#rv select{font:inherit;font-size:var(--fs-sm);padding:6px 8px;border:1px solid var(--border2);
  border-radius:var(--r-sm);background:var(--surface);color:var(--text);min-height:34px}
#rv .note{font-size:var(--fs-xs);color:var(--text3);max-width:44em;line-height:1.55;flex:1 1 20em}
#rv .samp{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber);
  border-radius:var(--r-full);padding:3px 9px;font-size:var(--fs-xs);font-weight:700;align-self:center}

#stage{padding:20px 14px 70px;display:flex;justify-content:center}
.app{width:100%;max-width:960px}
.app.phone{max-width:390px;border:10px solid #121212;border-radius:30px;overflow:hidden;box-shadow:var(--sh3)}
.app.phone.narrow{max-width:360px}
.ph-bar{background:#121212;color:#fff;font-size:10px;padding:4px 14px;display:flex;justify-content:space-between}
.pane{padding:14px;background:var(--bg)}
.hdr{font-size:var(--fs-lg);font-weight:700;margin:0 0 2px}
.hdr-s{font-size:var(--fs-sm);color:var(--text3);margin:0 0 14px}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  box-shadow:var(--sh1);padding:14px;margin-bottom:12px}
.card h2{font-size:var(--fs-md);margin:0 0 4px}
.sub{font-size:var(--fs-sm);color:var(--text3)}

.btn{font:inherit;font-size:16px;min-height:44px;padding:11px 15px;border-radius:var(--r-sm);
  border:1px solid transparent;cursor:pointer;background:var(--surface2);color:var(--text);
  display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.25}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:transparent;border-color:var(--border2);color:var(--text)}
.btn[disabled]{opacity:.6;cursor:default}
.btn-sm{min-height:44px;font-size:var(--fs-base);padding:8px 12px}
.btn:focus-visible,select:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

.gp-backdrop{background:rgba(0,0,0,.45);padding:14px 8px;border-radius:var(--r)}
.gp-modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--sh3);max-width:480px;margin:0 auto;overflow:hidden}
.gp-modal-hdr{display:flex;justify-content:space-between;align-items:center;padding:10px 8px 10px 14px;border-bottom:1px solid var(--border)}
.gp-modal-title{font-weight:700;font-size:var(--fs-md)}
.gp-modal-close{background:none;border:0;font-size:22px;line-height:1;color:var(--text3);cursor:pointer;min-width:44px;min-height:44px}
.gp-modal-body{padding:14px}
.gp-modal-footer{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--border);flex-wrap:wrap}
.gp-modal-footer .btn{flex:1 1 9em}
.gp-field{margin-bottom:12px}
.gp-label{font-size:var(--fs-sm);font-weight:600;margin-bottom:5px}
.gp-input{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--border2);
  border-radius:var(--r-sm);background:var(--surface);color:var(--text);max-width:36em}
.gp-row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(13em,100%),1fr));gap:12px}
.gp-hint{font-size:var(--fs-sm);color:var(--text3);line-height:1.55;margin:7px 0 0}
.gp-error{background:var(--red-lt);color:var(--red);border-radius:var(--r-sm);padding:10px 12px;
  font-size:var(--fs-base);line-height:1.55;margin-bottom:12px}
.send-fail{background:var(--amber-lt);color:var(--amber);border-radius:var(--r-sm);padding:10px 12px;
  margin-top:10px;font-size:var(--fs-base);line-height:1.55}
.send-fail b{display:block}
.send-fail span{display:block;margin-top:2px}

/* the file control, new in 081 */
.fc{border:1px solid var(--border);border-radius:var(--r);padding:12px;background:var(--surface2);margin-bottom:14px}
.fc-lab{font-size:var(--fs-sm);font-weight:600}
.fc-lab .rq{color:var(--text2);font-weight:400}
.fc-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.fc-btns .btn{flex:1 1 9.5em}
.fc-say{font-size:var(--fs-base);line-height:1.55;margin-top:9px;display:flex;gap:8px;align-items:flex-start}
.fc-say.ok{color:var(--green)}
.fc-say.bad{color:var(--red)}
.fc-say .ic{flex:0 0 auto;font-weight:700}
.fc-shown{display:flex;gap:11px;align-items:flex-start;margin-top:10px;flex-wrap:wrap}
.fc-thumb{width:82px;height:102px;border-radius:var(--r-sm);border:1px solid var(--border2);
  background:#fff;flex:0 0 auto;overflow:hidden;position:relative}
.fc-thumb .bill{position:absolute;inset:0;padding:5px;font-size:5.5px;line-height:1.4;color:#333;font-family:ui-monospace,monospace}
.fc-thumb .bill .b{font-size:9px;font-weight:700}
.fc-thumb.pdf{display:flex;align-items:center;justify-content:center;font-size:var(--fs-sm);
  color:var(--text2);background:var(--surface);font-family:var(--font);text-align:center;padding:6px}
.fc-meta{flex:1 1 11em;min-width:0}
.fc-meta .n{font-weight:600;font-size:var(--fs-base);word-break:break-word}
.fc-meta .s{font-size:var(--fs-sm);color:var(--text3);margin-top:3px}
.fc-meta .acts{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.spin{width:15px;height:15px;border:2px solid var(--border2);border-top-color:var(--primary);
  border-radius:50%;display:inline-block;animation:sp .8s linear infinite;flex:0 0 auto;margin-top:3px}
@keyframes sp{to{transform:rotate(360deg)}}
.toast{background:var(--green-lt);color:var(--green);border:1px solid var(--green);
  border-radius:var(--r-sm);padding:11px 12px;font-weight:600;margin-bottom:12px}

.lrow{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;margin-bottom:10px}
.lrow .top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lrow .nm{font-weight:600}
.chip{display:inline-block;font-size:var(--fs-sm);padding:3px 9px;border-radius:var(--r-full);
  border:1px solid var(--border2);color:var(--text2);background:var(--surface2)}
.chip.g{background:var(--green-lt);color:var(--green);border-color:var(--green)}
.chip.a{background:var(--amber-lt);color:var(--amber);border-color:var(--amber)}
.ev{font-size:var(--fs-base);margin-top:9px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ev .w{color:var(--text2)}
.ev .w.none{color:var(--text3)}

.hm-row{display:flex;width:100%;gap:10px;align-items:center;text-align:left;background:var(--surface);
  border:1px solid var(--border);border-radius:var(--r);padding:10px;margin-bottom:8px;
  font:inherit;cursor:pointer;min-height:56px;color:var(--text)}
.hm-av{width:34px;height:34px;border-radius:var(--r-full);background:var(--primary-lt);color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs-sm);flex:0 0 auto}
.hm-rt{flex:1 1 auto;min-width:0}
.hm-l1{display:block;font-weight:600}
.hm-l2{display:block;font-size:var(--fs-sm);color:var(--text3);margin-top:1px}
.hm-l3{display:block;font-size:var(--fs-sm);color:var(--text2);margin-top:4px;font-weight:600}
.hm-l3.none{color:var(--text3);font-weight:400}
.hm-go{color:var(--primary);font-size:var(--fs-sm);flex:0 0 auto}

.sheet{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px var(--r) var(--r);
  box-shadow:var(--sh3);overflow:hidden;margin-top:12px}
.sheet .sh-h{padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;
  display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .sh-p{padding:14px}
.sheet .sh-f{padding:12px 14px;border-top:1px solid var(--border);display:flex;gap:10px;flex-wrap:wrap}
.sheet .sh-f .btn{flex:1 1 9em}
.hm-fact{background:var(--surface2);border-radius:var(--r);padding:12px;margin:10px 0}
.hm-amt{font-size:var(--fs-xl);font-weight:700}
.hm-sub{font-size:var(--fs-sm);color:var(--text3);margin-top:3px}
.hm-note{font-size:var(--fs-sm);color:var(--text2);line-height:1.55}
.viewrow{margin:12px 0 2px}
.viewrow .btn{width:100%}

.dv{background:#111;border-radius:var(--r);overflow:hidden;margin-top:12px;border:2px solid var(--primary)}
.dv-h{display:flex;justify-content:space-between;align-items:center;padding:7px 8px 7px 12px;color:#fff;
  background:rgba(0,0,0,.65);font-size:var(--fs-base);gap:10px}
.dv-h .x{background:none;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:var(--r-sm);
  min-height:44px;min-width:44px;font:inherit;font-size:16px;cursor:pointer}
.dv-b{padding:12px;display:flex;justify-content:center}
.dv-f{color:rgba(255,255,255,.7);font-size:var(--fs-sm);padding:0 12px 10px;text-align:center}
.billimg{background:#fff;color:#222;width:100%;max-width:290px;padding:13px;
  font-family:ui-monospace,monospace;font-size:10px;line-height:1.6;border-radius:3px}
.billimg .big{font-size:16px;font-weight:700}
.billimg hr{border:0;border-top:1px dashed #999;margin:7px 0}
.pdfpg{background:#fff;color:#222;width:100%;max-width:290px;padding:16px;font-size:10px;line-height:1.7;border-radius:3px}

.desk{background:var(--surface);color:var(--text);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.desk-h{padding:11px 14px;border-bottom:1px solid var(--border);font-weight:600;font-size:var(--fs-md);
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.desk-b{padding:16px}
.desk-msg{border:1px solid var(--red);background:var(--red-lt);border-radius:var(--r-sm);padding:14px;max-width:34em}
.desk-msg .t{font-weight:700;color:var(--red);margin-bottom:7px}
.desk-msg p{margin:0 0 10px;line-height:1.6;color:var(--text)}
.desk-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(16em,100%),1fr));gap:12px;margin-bottom:14px}

.note-blk{border-left:3px solid var(--primary);background:var(--primary-lt);color:var(--text);
  padding:10px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);line-height:1.6;margin-bottom:14px}
.note-blk b{display:block;margin-bottom:3px}
.bug{border-left:3px solid var(--red);background:var(--red-lt);color:var(--text);
  padding:10px 12px;border-radius:var(--r-sm);font-size:var(--fs-sm);line-height:1.6;margin-bottom:12px}
.bug b{display:block;color:var(--red)}
.ac-form{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.ac-form label.form-label{display:block;font-size:var(--fs-sm);font-weight:600;margin:0 0 5px}
.ac-form select,.ac-form textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;
  border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);
  margin-bottom:11px;max-width:36em}
.ac-help{font-size:var(--fs-sm);color:var(--text3);line-height:1.55;margin:-5px 0 11px}
.ac-acts{display:flex;gap:9px;flex-wrap:wrap}
.ac-acts .btn{flex:1 1 10em}
.daytbl{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.daytbl td{padding:10px;border-top:1px solid var(--border);font-size:var(--fs-base);vertical-align:top}
.daytbl tr:first-child td{border-top:0}

.big-text{font-size:26px}
.big-text .pane .hdr{font-size:36px}
.big-text .btn,.big-text .gp-input,.big-text .ac-form select,.big-text .ac-form textarea{font-size:32px;min-height:66px}
.big-text .gp-label,.big-text .fc-lab,.big-text .gp-hint,.big-text .fc-say,.big-text .hm-l2,
.big-text .hm-l3,.big-text .hm-note,.big-text .sub,.big-text .chip,.big-text .fc-meta .s,
.big-text .hm-sub,.big-text .ac-help,.big-text .note-blk,.big-text .hdr-s,.big-text .dv-f{font-size:24px}
.big-text .hm-amt{font-size:46px}
.big-text .gp-modal-title,.big-text .fc-meta .n,.big-text .hm-l1,.big-text .lrow .nm,
.big-text .card h2,.big-text .sheet .sh-h{font-size:28px}
</style>

  if (mode==="upload")  h += say("", "spin", t("upl")) + '<div class="fc-shown">'+thumbPhoto()

      + '<button type="button" class="btn btn-outline btn-sm">'+esc(t("replace"))+"</button></div></div></div>"
      + say("ok","✓", t("att"));
  if (mode==="pdf") h += '<div class="fc-shown">'+thumbPdf()
      + '<div class="fc-meta"><div class="n">'+esc(t("att"))+'</div>'
      + '<div class="s">1.8 MB · hotel-invoice.pdf</div>'
      + '<div class="acts"><button type="button" class="btn btn-outline btn-sm">'+esc(t("viewfull"))+"</button>"
      + '<button type="button" class="btn btn-outline btn-sm">'+esc(t("replace"))+"</button></div></div></div>"
      + say("ok","✓", t("att"));
  if (mode==="bigimg")  h += buttons + say("bad","⚠", t("bigimg"));
  if (mode==="bigpdf")  h += buttons + say("bad","⚠", t("bigpdf"));
  if (mode==="badtype") h += buttons + say("bad","⚠", t("badtype"));
  if (mode==="noread")  h += buttons + say("bad","⚠", t("noread"));
  if (mode==="uplost")  h += '<div class="fc-shown">'+thumbPhoto()
      + '<div class="fc-meta"><div class="n">bill-03-nov.jpg</div><div class="s">380 KB</div>'
      + '<div class="acts"><button type="button" class="btn btn-primary btn-sm">'+esc(t("uplostB"))+"</button>"

  if (m==="rows") {
    note = '<div class="note-blk"><b>Words in the row, the action in the sheet</b>'
      + 'The row is a single &lt;button&gt;, so a “View” link inside it would be a button inside a '
      + 'button — unreachable by keyboard. So the row only tells the truth in words, and the '
      + 'button to open the bill lives in the sheet the row opens. The 14 October claim says '
      + '“No bill attached”, because an empty View is worse than an honest absence.</div>';
    return phoneWrap(head+rows+note);
  }
  var sheet, extra = "";
  if (m==="sheet")   { sheet = expSheet("idle"); extra = '<div class="note-blk"><b>Before the irreversible act</b>'
      + '“View bill” sits in the body, above Approve and Decline, never between them. The decision '
      + 'buttons stay the only things in the footer, so the evidence is read before the act that '
      + 'cannot be taken back.</div>'; }
  if (m==="opening") { sheet = expSheet("opening"); extra = '<div class="note-blk"><b>Say the wait out loud</b>'
      + 'A 1 MB bill on 3G is seconds. Today the button is disabled and nothing on screen changes '
      + 'until it fails. The button carries its own state instead.</div>'; }
  if (m==="openfail"){ sheet = expSheet("openfail"); extra = '<div class="note-blk"><b>A failure that says what to do</b>'
      + 'Not “could not load”. The claim is still decidable and the button is still there.</div>'; }
  if (m==="nobill")  { sheet = expSheet("nobill"); extra = '<div class="note-blk"><b>An older claim</b>'
      + 'The rule fires at submit, so claims already submitted never meet it. They stay decidable, '
      + 'and the sheet says plainly that there is nothing to open.</div>'; }
  if (m==="decided") { sheet = expSheet("idle", true); extra = '<div class="note-blk"><b>The state the approver ROLE creates</b>'
      + 'With a role, several people can open the same claim. Whoever acts first is recorded as the '
      + 'approver, so everyone else needs this honest dead end — who acted, when, and that there is '
      + 'nothing left to do. <b>The mechanism behind it is NOT designed here</b> (brief §3.3): it is the '
      + 'analyst’s and the engineer’s. This screen ships wherever the role flow ships.</div>'; }
  if (m==="viewer")  { sheet = viewer("img") + expSheet("idle");
      extra = '<div class="note-blk"><b>The viewer is ABOVE the sheet</b>'
      + 'This is the one change the reuse plan needs and does not have: <code>.mpf-dv</code> is '
      + 'z-index 1250 and <code>.hm-ov</code> is 1300, both in panels.css. Raise the viewer above '
      + 'the sheet (1400 is clear of everything) — lowering the sheet is not available, because '
      + '1200 is already the employee’s own modal. Closing the viewer returns focus to the '
      + '“View bill” button and leaves the sheet exactly as it was.</div>'; }
  if (m==="bug")     { sheet = expSheet("idle");
      extra = '<div class="bug"><b>This is what ships if nobody moves the number</b>'
      + 'The approver taps “View bill”, the viewer opens at 1250 behind the sheet at 1300, and '
      + 'the screen does not change. Nothing says it failed, because nothing did. Measured in '
      + 'panels.css:712 and :3064. P1 — the slice’s whole point ships blank.</div>'; }
  return phoneWrap(head + rows + sheet + extra);
}

/* ── screen: HR's day-fix queue ────────────────────────────────────────── */
function scHr(){
  var m = S.state;
  function card(nm,reason,day,hasFile){
    return '<div class="lrow"><div class="top"><div><div class="nm">'+esc(nm)+"</div>"
      + '<div class="sub">'+esc(reason)+" · "+esc(day)+"</div></div>"
      + '<span class="chip a">Waiting</span></div>'
      + '<div class="ev">'
      + (hasFile
          ? '<span class="w">✓ '+esc(t("hrEv"))+'</span><button type="button" class="btn btn-outline btn-sm">'+esc(t("hrView"))+"</button>"
          : '<span class="w none">'+esc(t("hrNoEv"))+"</span>")
      + '</div><div class="ac-acts" style="margin-top:10px">'
      + '<button class="btn btn-primary btn-sm">Fix the day</button>'
      + '<button class="btn btn-outline btn-sm">Decline</button></div></div>';
  }
  var list = card("Pooja Kaur","Biometric did not read","2 Nov 2026",true)
    + card("Ramesh Kumar","Biometric did not read","3 Nov 2026",true)
    + card("Mohan Das","I was at another depot","1 Nov 2026",false);
  var inner = '<p class="hdr">Days to fix</p><p class="hdr-s">Kavita Rao · HR, DTC · 3 waiting of 47 · Sample</p>';
  if (m==="view") inner += viewer("img") + list
    + '<div class="note-blk"><b>One file per tap</b>No thumbnails in the list, no preloading, no '
    + '“open all”. The endpoint reads a whole file into one of eight request slots, so a 47-row '
    + 'queue that preloaded pictures would be the slowest page in the product on the surface that '
    + 'matters most.</div>';
  else inner += list
    + '<div class="note-blk"><b>One line inside the card HR already reads</b>'
    + 'These cards are not single buttons — they already carry Fix and Decline — so “View” can be '
    + 'a real button here. Same words, same viewer, same promise as every other surface.</div>';
  return phoneWrap(inner);
}

/* ── screen: Desk at submit ────────────────────────────────────────────── */
function scDesk(){
  var inner = '<div class="desk"><div class="desk-h"><span>Expense Claim · HR-EXP-2026-00318</span>'
    + '<span class="chip">Draft · saved</span></div><div class="desk-b">'
    + '<div class="desk-grid"><div><div class="gp-label">Employee</div>'
    + '<div>HR-EMP-00412 · Ramesh Kumar</div></div>'
    + '<div><div class="gp-label">Company</div><div>Delhi Transport Co · Sample</div></div>'
    + '<div><div class="gp-label">Total claimed</div><div>₹420.00</div></div>'
    + '<div><div class="gp-label">Attachments</div><div>None</div></div></div>'
    + '<div class="desk-msg" role="alert"><div class="t">'+esc(t("deskRefT"))+"</div>"
    + "<p>"+esc(t("deskRef1"))+"</p><p>"+esc(t("deskRef2"))+"</p>"
    + '<button class="btn btn-outline btn-sm">'+esc(t("close"))+"</button></div>"
    + '<p class="gp-hint" style="max-width:34em">The draft is still saved. Only Submit is blocked.</p>'
    + "</div></div>"
    + '<div class="note-blk"><b>One rule, one first sentence — plus one clause only HR can act on</b>'
    + 'The first sentence is word-for-word the one the driver sees in the portal, so the rule has a '
    + 'single voice. The second sentence exists only here, because HR is the only person who can '
    + 'attach a signed statement on somebody’s behalf. The declaration IS the file — it is not an '
    + 'exemption from the rule, and the wording must never drift into suggesting a claim can be '
    + 'filed without one.</div>'
    + '<div class="note-blk"><b>At submit, not at save</b>'
    + 'Frappe only draws the attachment sidebar on a document that already exists, so “must have a '
    + 'file” cannot be checked at save. Checking it at submit also covers the REST API and data '
    + 'import for free, and leaves a half-finished draft a legal draft.</div>';
  return '<div class="app'+(S.big==="yes"?" big-text":"")+'"><div class="pane">'
    + '<p class="hdr">Desk · Expense Claim</p><p class="hdr-s">Kavita Rao · HR Manager · Sample</p>'
    + inner+"</div></div>";
}

/* ── draw ──────────────────────────────────────────────────────────────── */
function draw(){
  document.documentElement.setAttribute("data-theme", S.theme);
  document.documentElement.setAttribute("lang", S.lang);
  drawBar();
  var f = {ec:scEc, eclist:scEclist, ar:scAr, arcard:scArcard, ap:scAp, hr:scHr, desk:scDesk}[S.screen];
  document.getElementById("stage").innerHTML = f();
}
draw();
</script>
