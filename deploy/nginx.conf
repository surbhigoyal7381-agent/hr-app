# Grace Drinks HRMS – Nginx reverse proxy
# Proxies HTTP → Frappe gunicorn (port 8000)
# Proxies WebSocket /socket.io → Socket.io server (port 9000)

upstream frappe_http {
    server frappe:8000;
}

upstream frappe_ws {
    server frappe:9000;
}

server {
    listen 80;
    server_name _;              # accept any hostname or raw IP

    client_max_body_size 50m;
    proxy_read_timeout   120s;

    # ── WebSocket (Socket.io realtime) ──────────────────────────────
    location /socket.io {
        proxy_pass         http://frappe_ws;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Static / compiled assets (long-lived cache) ─────────────────
    location ~* ^/(assets|files)/ {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host $host;
        expires             30d;
        add_header          Cache-Control "public, immutable";
    }

    # ── Everything else → Frappe application ───────────────────────
    location / {
        proxy_pass         http://frappe_http;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
