name: Deploy

# Branch-per-environment deployment.
#
#   push to dev   →  dev environment          (automatic)
#   push to test  →  test environment         (automatic)
#   push to main  →  PRODUCTION               (manual approval required)
#
# Approval is enforced by the `production` GitHub Environment protection rule,
# NOT by anything in this file. Create it before the first push to main:
#   Settings → Environments → production → Required reviewers.
#
# Runs after "Build Image" succeeds for the same commit, so the image the
# deploy pulls is guaranteed to exist.

on:
  workflow_run:
    workflows: ["Build Image"]
    types: [completed]
    branches: [dev, test, main]

  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, test, production]
      image_tag:
        description: "Image tag to deploy (e.g. prod-a1b2c3d). Use this to roll back."
        required: true
        type: string
      # Which registry package the tag lives in. Leave it on alvoraa-app.
      #
      # hr-app is the OLD, PUBLIC package. It is here for one reason: a rollback to
      # a release that was never copied into the new package, in the days before
      # the old package is deleted. Once it is deleted this option cannot work -
      # the pull fails and the deploy stops before it touches any container. See
      # docs/runbooks/2026-09-private-image-package.md.
      image_package:
        description: "Package the tag lives in. Keep alvoraa-app unless the runbook says otherwise."
        required: false
        type: choice
        options: [alvoraa-app, hr-app]
        default: alvoraa-app
      run_migrations:
        description: Run `bench --site all migrate`
        required: true
        type: boolean
        default: true

# The image lives in its OWN package name, not the repository's name.
#
# Until 2026-09 the package was ghcr.io/<owner>/hr-app, named after the repository
# (IMAGE_NAME was `github.repository`). That package was PUBLIC, so anyone could
# pull the image and read the whole application out of it - even after the
# repository itself went private on 18 Sep.
#
# GitHub will not make a public package private again. Its documentation says so
# ("Once you make a package public, you cannot make it private again"), and the
# visibility switch was tried twice on 22 Sep and stayed public. The only way out
# is a NEW package that is private from its first push - a package first pushed by
# a workflow "inherits the visibility and permissions model of the repository where
# the workflow is run", and this repository is private - and then deleting the old
# one. That new package is alvoraa-app.
#
# Do NOT set this back to `github.repository`: that is the old public package.
# The same name is written in build-image.yml and in the plan job below (a job's
# own `env:` cannot read this block). Change all three together.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: surbhigoyal7381-agent/alvoraa-app

jobs:

  # ── Map branch → environment, image tag, and whether to migrate ───────────
  plan:
    name: Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    outputs:
      environment: ${{ steps.p.outputs.environment }}
      image_tag:   ${{ steps.p.outputs.image_tag }}
      migrate:     ${{ steps.p.outputs.migrate }}
      # Each environment is a SEPARATE docker compose project on one host. Getting
      # this wrong does not fail - it silently drives the other environment.
      project:     ${{ steps.p.outputs.project }}
      overlay:     ${{ steps.p.outputs.overlay }}
      pin_file:    ${{ steps.p.outputs.pin_file }}
      # The full image reference to pull and pin. Built here, once, so the
      # rollback choice and the automatic path cannot disagree about the package.
      full_image:  ${{ steps.p.outputs.full_image }}
      # vars.SMOKE_SITE and vars.BASE_DOMAIN were never configured on this repo,
      # so the smoke test requested https:///api/method/ping and returned HTTP 000
      # thirty times. Derived here instead - one less piece of out-of-band config
      # that fails silently when absent.
      smoke_site:  ${{ steps.p.outputs.smoke_site }}
    steps:
      - id: p
        env:
          INPUT_IMAGE_TAG:     ${{ inputs.image_tag }}
          INPUT_IMAGE_PACKAGE: ${{ inputs.image_package }}
        run: |
          set -euo pipefail
          # Maps an environment to the compose project, overlay and image-pin file
          # it OWNS. Read off the running containers' own compose labels, which are
          # the only authoritative source:
          #   devstack-backend-1 -> project=devstack, app.yml + devstack.yml
          #   compose-backend-1  -> project=compose,  app.yml + nginx-multienv.yml
          emit_stack() {
            case "$1" in
              dev) echo "project=devstack"                   >> $GITHUB_OUTPUT
                   echo "overlay=docker-compose.devstack.yml" >> $GITHUB_OUTPUT
                   echo "pin_file=.image.dev.env"             >> $GITHUB_OUTPUT
                   echo "smoke_site=dev.alvoraa.co"           >> $GITHUB_OUTPUT ;;
              *)   echo "project=compose"                     >> $GITHUB_OUTPUT
                   echo "overlay=docker-compose.nginx-multienv.yml" >> $GITHUB_OUTPUT
                   echo "pin_file=.image.env"                 >> $GITHUB_OUTPUT
                   echo "smoke_site=alvoraa.co"               >> $GITHUB_OUTPUT ;;
            esac
          }

          # Same name as IMAGE_NAME at the top of this file.
          OWNER="surbhigoyal7381-agent"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Through env:, not pasted into the script - a typed input must not be
            # able to become shell code on the way in.
            TAG="$INPUT_IMAGE_TAG"
            PACKAGE="$INPUT_IMAGE_PACKAGE"
            # The UI only offers the two choices, but the API accepts any string.
            # Never pull from a package that is not named here.
            case "${PACKAGE:-alvoraa-app}" in
              alvoraa-app) PACKAGE=alvoraa-app ;;
              hr-app)      echo "::warning::Pulling from the OLD PUBLIC package hr-app - only for a release that was never copied into alvoraa-app." ;;
              *)           echo "::error::Unknown image_package '$PACKAGE'"; exit 1 ;;
            esac
            case "$TAG" in
              ''|*[!A-Za-z0-9._-]*) echo "::error::image_tag '$TAG' is not a plain tag"; exit 1 ;;
            esac
            echo "environment=${{ inputs.environment }}"    >> $GITHUB_OUTPUT
            echo "image_tag=$TAG"                           >> $GITHUB_OUTPUT
            echo "full_image=ghcr.io/$OWNER/$PACKAGE:$TAG"  >> $GITHUB_OUTPUT
            echo "migrate=${{ inputs.run_migrations }}"     >> $GITHUB_OUTPUT
            emit_stack "${{ inputs.environment }}"
            exit 0
          fi

          BRANCH="${{ github.event.workflow_run.head_branch }}"
          SHORT=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          case "$BRANCH" in
            dev)  ENVIRONMENT=dev;        TAG="dev-$SHORT"  ;;
            test) ENVIRONMENT=test;       TAG="test-$SHORT" ;;
            main) ENVIRONMENT=production; TAG="prod-$SHORT" ;;
            *) echo "::error::Unexpected branch $BRANCH"; exit 1 ;;
          esac
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "image_tag=$TAG"           >> $GITHUB_OUTPUT
          echo "full_image=ghcr.io/$OWNER/alvoraa-app:$TAG" >> $GITHUB_OUTPUT
          echo "migrate=true"             >> $GITHUB_OUTPUT
          emit_stack "$ENVIRONMENT"

  deploy:
    name: Deploy to ${{ needs.plan.outputs.environment }}
    needs: plan
    runs-on: [self-hosted, contabo]
    timeout-minutes: 90

    # `packages: read` so this job can sign in to ghcr.io and pull. Until the
    # registry sign-in step below, it pulled ANONYMOUSLY and worked only because
    # the image package was public - which also meant anyone could pull the image
    # and read the whole application out of it. See that step.
    permissions:
      contents: read
      packages: read

    # This is the approval gate for production.
    environment:
      name: ${{ needs.plan.outputs.environment }}
      url: https://${{ needs.plan.outputs.smoke_site }}

    concurrency:
      group: deploy-${{ needs.plan.outputs.environment }}
      cancel-in-progress: false        # never interrupt a running migration

    env:
      IMAGE:    ${{ needs.plan.outputs.image_tag }}
      FULL_IMAGE: ${{ needs.plan.outputs.full_image }}
      ENV_NAME: ${{ needs.plan.outputs.environment }}
      PROJECT:  ${{ needs.plan.outputs.project }}
      OVERLAY:  ${{ needs.plan.outputs.overlay }}
      PIN_FILE: ${{ needs.plan.outputs.pin_file }}
      MIGRATE:  ${{ needs.plan.outputs.migrate }}

    steps:
      - name: Parameters
        run: |
          echo "Environment : $ENV_NAME"
          echo "Image       : $FULL_IMAGE"
          echo "Migrations  : $MIGRATE"

      # ── The nginx gate: a config nginx cannot read must never reach nginx ──
      #
      # ONE nginx container serves production alvoraa.co AND dev.alvoraa.co, and its
      # config is bind-mounted from deploy/nginx.conf. This job restarts that
      # container - twice - and until slice 018 it did so without once asking nginx
      # whether the new config was readable. One missing semicolon therefore meant
      # nginx did not come back and EVERY site stayed down until a human logged in
      # and fixed it. A dev deploy could take production down that way.
      #
      # So the exact bytes about to be deployed are tested first, in a throwaway
      # container, and the deploy stops here if nginx refuses them.
      #
      # `git show` rather than the working tree, for two reasons: the tree is still
      # at the PREVIOUS release at this point, and reading from the ref touches
      # nothing. Both the config and the checker come out of the ref being deployed.
      #
      # First step in the job on purpose - it is also the cheapest. A bad config now
      # costs twenty seconds instead of a ten-minute outage after a thirty-minute run.
      # The fetch carries the job's own token in a header.
      #
      # The server's checkout has an HTTPS remote and NO stored credentials, and
      # that is deliberate: nothing long-lived sits on the box, so there is nothing
      # to leak, expire or rotate. The token here lives for the length of the job.
      # It became necessary the moment the repository went private - on 18 Sep a
      # deploy failed here with "could not read Username for https://github.com",
      # exit 128, because a public repo had never needed to authenticate. Do not
      # "fix" this by storing a credential on the server.
      #
      # `contents: read` on this job (above) is what the token needs; drop it and
      # this fails with a 403 that reads nothing like an auth problem.
      - name: nginx config must parse
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd /var/www/html/hr-app
          BRANCH="${ENV_NAME/production/main}"
          AUTH=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
              fetch --quiet origin "$BRANCH"

          # Where the real certificates live (TLS_CERT_DIR, /etc/letsencrypt). They
          # are mounted read-only, so nginx checks the certificate PATHS too: a typo
          # in one fails the test exactly like a syntax error would. That matters -
          # slice 014 changed those paths to the wildcard certificate.
          # Only this one key is read out of the env file; the rest holds secrets.
          CERT_DIR=$(grep -hE '^TLS_CERT_DIR=' "deploy/envs/${ENV_NAME}.env" 2>/dev/null \
                     | tail -1 | cut -d= -f2-) || CERT_DIR=""

          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          git show "origin/${BRANCH}:deploy/nginx.conf"             > "$TMP/nginx.conf"
          git show "origin/${BRANCH}:scripts/check_nginx_parses.sh" > "$TMP/check.sh"
          bash "$TMP/check.sh" "$TMP/nginx.conf" "${CERT_DIR:-/etc/letsencrypt}"

      # ── Disk headroom gate: the cause of the 2026-09-10 outage ────────────
      #
      # A full disk is not just "the deploy fails". On 2026-09-10 the 193 GB disk
      # hit 100%, and every one of these followed from it:
      #   • redis runs with an append-only file, so it stopped accepting WRITES
      #     and answered every command "MISCONF Errors writing to the AOF file";
      #   • rq does not retry its heartbeat, so both workers quit within three
      #     seconds of each other;
      #   • `restart: unless-stopped` fired and FAILED - docker could not mkdir a
      #     root filesystem to restart into - and the restart manager gave up;
      #   • docker could not even save the failed state, so `docker ps` reported
      #     "Up 12 days" for the next nine days while the containers were shells.
      # 700 jobs queued up behind that, unnoticed, until 2026-09-19.
      #
      # Recovery needs the disk the failure just ate. So stop BEFORE the pull,
      # while there is still room to fix it: one image is about 11 GB, and the
      # backup below writes a full copy of every site.
      #
      # This step only looks. The tagged-image cleanup at the end of Deploy is
      # what normally keeps this from ever tripping; if it trips anyway, that
      # cleanup stopped working and a human should see why.
      - name: Disk headroom
        run: |
          set -euo pipefail
          AVAIL=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "Free on / : ${AVAIL} GB"
          if [ "$AVAIL" -lt 25 ]; then
            echo "::error::Only ${AVAIL} GB free on /. A deploy needs ~25 GB (image + backup),"
            echo "::error::and below ~20 GB docker cannot restart a container at all."
            docker system df
            docker images --format '{{.Size}}	{{.Repository}}:{{.Tag}}' | sort -hr | head -15
            exit 1
          fi
          if [ "$AVAIL" -lt 45 ]; then
            echo "::warning::${AVAIL} GB free on /. Getting tight - check the image cleanup."
          fi

      # ── Pre-deploy backup: this is the rollback point ─────────────────────
      # A database dump alone is NOT restorable — site_config.json holds each
      # site's encryption_key. Both are captured here. (ARCHITECTURE.md §17)
      #
      # Dev is backed up too, since slice 018. It used to be skipped to save time,
      # which was the wrong trade: releases carry data patches that rewrite rows and
      # cannot be undone, and dev is where a patch is proven before production sees
      # it. Without a backup a patch that eats dev data leaves nothing to compare
      # against and nothing to restore. The cost is small and measured: the dev sites
      # volume is 169 MB, the server has 43 GB free, and the backup adds one to two
      # minutes to a run that takes about thirty-five.
      - name: Backup all sites
        run: |
            set -euo pipefail
            cd /var/www/html/hr-app/deploy/compose
            export COMPOSE_PROJECT_NAME="$PROJECT"
            DC="docker compose -f docker-compose.app.yml -f $OVERLAY --env-file ../envs/${ENV_NAME}.env --env-file $PIN_FILE"
            STAMP=$(date +%F-%H%M)

            $DC exec -T backend bench --site all backup --with-files
            # cd first. The container's WORKDIR is frappe-bench/SITES, not
            # frappe-bench, so a relative "sites/..." resolves to sites/sites and
            # tar exits 2 - which failed the backup and correctly skipped the whole
            # deploy. bench is unaffected because it locates the bench root itself,
            # which is why every other command in this job worked.
            $DC exec -T backend bash -c \
              "cd /home/frappe/frappe-bench && tar czf sites/site-configs-${STAMP}.tgz \
                 sites/*/site_config.json sites/common_site_config.json"

            if [ -n "${{ secrets.BACKUP_BUCKET }}" ]; then
              $DC exec -T backend bash -c \
                "cd /home/frappe/frappe-bench && aws s3 sync sites/ s3://${{ secrets.BACKUP_BUCKET }}/pre-deploy/${STAMP}/ \
                   --exclude '*' --include '*/private/backups/*' --include 'site-configs-*.tgz'" \
                || echo "::warning::Offsite backup sync failed — verify before continuing"
            else
              echo "::warning::BACKUP_BUCKET not set — backups exist only on the server"
            fi

      # ── Sign in to the image registry before pulling ──────────────────────
      #
      # The pull inside "Deploy" used to be anonymous. It worked, but only because
      # the ghcr.io package was PUBLIC - and the image contains the entire
      # application, so a public package makes the source readable to anyone who
      # runs `docker pull`, private repository or not.
      #
      # With this step the package can be private: the job's own GITHUB_TOKEN has
      # `packages: read` and is enough to pull. No long-lived token is stored on
      # the server, and nothing has to be rotated by hand. The private package is
      # alvoraa-app (IMAGE_NAME at the top). This token can read it because a
      # package first pushed by this repository's workflow is linked to it.
      #
      # No matching logout. The credential lands in the runner user's
      # ~/.docker/config.json, and the token stops working when the job ends - but
      # dev and production deploys can run at the same time on this one runner, and
      # a logout from either would pull the credential out from under the other
      # mid-pull.
      #
      # The token travels through `env:`, not inline in the command. Inline, the
      # expanded secret is written into the step script on the runner's disk and is
      # visible in `ps` while docker login runs. GitHub masks it in the LOG either
      # way, which is what makes the inline form look safe when it is not - and this
      # is our own machine, shared with production. Same reason the git fetches below
      # take their token this way.
      - name: Sign in to the image registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            set -euo pipefail
            printf '%s' "$REGISTRY_TOKEN" \
              | docker login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Deploy
        env:
          GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
            set -euo pipefail
            cd /var/www/html/hr-app
            # Same token header as the gate step above, and for the same reason:
            # the repository is private and the server holds no credentials.
            # `origin` is the only remote on this checkout, so --prune is safe here.
            AUTH=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
            git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
                fetch --prune origin
            # The objects are local now, so the checkout itself needs no credential.
            git checkout --detach "origin/${ENV_NAME/production/main}" 2>/dev/null \
              || git checkout --detach origin/main
            cd deploy/compose

            # The nginx config is now on disk. Test THAT file, not the one the gate
            # step read out of git, because the checkout above has a fallback to
            # origin/main - so the file here is not always the one already proven.
            #
            # This sits BEFORE `trap cleanup EXIT` deliberately: the trap restarts
            # nginx, and restarting nginx is the one thing that must not happen while
            # the config on disk is bad. Failing here exits with no trap installed,
            # so the running nginx keeps serving the config it read when it started.
            CERT_DIR=$(grep -hE '^TLS_CERT_DIR=' "../envs/${ENV_NAME}.env" 2>/dev/null \
                       | tail -1 | cut -d= -f2-) || CERT_DIR=""
            bash ../../scripts/check_nginx_parses.sh ../nginx.conf "${CERT_DIR:-/etc/letsencrypt}"

            # Keep the previous pin. `compose pull` reads the pin file to know what
            # to fetch, so it has to be written first - but if the pull then fails
            # (a tag that is not in the package, or the old package after it has
            # been deleted), the pin would be left naming an image this server
            # does not have. The next `up -d` - or nginx being recreated, which
            # reads production's pin - would then fail. The pull loop below puts
            # the previous pin back instead.
            cp -p "$PIN_FILE" "$PIN_FILE.before-deploy" 2>/dev/null || true
            echo "KINEXUS_IMAGE=$FULL_IMAGE" > "$PIN_FILE"
            export COMPOSE_PROJECT_NAME="$PROJECT"
            DC="docker compose -f docker-compose.app.yml -f $OVERLAY --env-file ../envs/${ENV_NAME}.env --env-file $PIN_FILE"
            # `bench --site all set-maintenance-mode` DOES NOT COVER ALL SITES.
            #
            # Unlike migrate and backup, that command takes --site as a plain
            # option and calls get_site(), which returns ONE site. It accepts
            # "all" without complaint and acts on a single site
            # (frappe/commands/scheduler.py). So every migration this pipeline has
            # run left all but one tenant serving live traffic against a database
            # mid-migration - the protection claimed below was never there.
            #
            # It breaks turning maintenance OFF too, which is how it surfaced: a
            # dev deploy reported success and left one tenant stuck at 503.
            maint() {   # maint on|off - every site, by name
              for site in $(list_sites); do
                $DC exec -T backend bench --site "$site" set-maintenance-mode "$1" || true
              done

              # A SECOND sweep on the way out, after a pause.
              #
              # Twice now a dev deploy finished with one tenant still at 503,
              # and it was the same tenant both times - the one that sorts
              # FIRST. The first bench call straight after clear-cache fails,
              # `|| true` hides it, and the rest of the loop then succeeds.
              # Running the identical loop by hand works every time, which is
              # what took so long to see.
              #
              # So: wait, then write the flag again by a different route.
              # A site left in maintenance is a site that is down, and that
              # is worth five seconds.
              if [ "$1" = "off" ]; then
                sleep 5
                for site in $(list_sites); do
                  $DC exec -T backend bench --site "$site" set-config -p maintenance_mode 0 || true
                done
              fi
            }

            list_sites() {
              $DC exec -T backend bash -c 'ls -1 /home/frappe/frappe-bench/sites' \
                | tr -d '\r' \
                | grep -vE '^(assets|apps[.]txt|apps[.]json|.*[.]json|currentsite[.]txt)$'
            }

            # Whatever happens below, the site must not be left in maintenance and
            # the proxy must not be left down. Both were true after the failed
            # deploy on 2026-09-05 and both needed a human to notice.
            cleanup() {
              rc=$?
              if [ $rc -ne 0 ]; then
                echo "::warning::deploy failed (rc=$rc) - restoring service"
                maint off
                # ONE nginx serves every environment and it belongs to the
                # `compose` project. devstack excludes it by profile, so
                # `up -d nginx` there CREATES a second one, which then fights
                # the real one for ports 80 and 443 and restarts for ever.
                # That is not hypothetical - this trap did it on 2026-09-06.
                docker restart compose-nginx-1 >/dev/null 2>&1 || true
              fi
              exit $rc
            }
            trap cleanup EXIT

            # Retried, with a growing wait. On 2026-09-06 all THREE original
            # attempts failed inside two minutes, so the deploy aborted on a
            # network problem that cleared by itself soon after. Six attempts
            # spread over five minutes rides that out.
            #
            # The failure is always the same shape:
            #   failed to copy: read tcp ...->[2606:50c0:...]:443: connection reset
            # partway through a multi-GB layer, over IPv6. Docker keeps the layers
            # it already has, so a retry resumes rather than restarts.
            pulled=0
            for attempt in 1 2 3 4 5 6; do
              if $DC pull; then pulled=1; break; fi
              echo "::warning::pull attempt $attempt failed, retrying in $((attempt * 20))s"
              sleep $((attempt * 20))
            done
            if [ "$pulled" != "1" ]; then
              echo "::error::image pull failed six times over five minutes: $FULL_IMAGE"
              if [ -f "$PIN_FILE.before-deploy" ]; then
                mv -f "$PIN_FILE.before-deploy" "$PIN_FILE"
                echo "::error::No container was changed. $PIN_FILE is back to: $(cat "$PIN_FILE")"
              fi
              exit 1
            fi
            rm -f "$PIN_FILE.before-deploy"

            # The image is on disk. Before any container swaps, give the sites
            # volume the bench-level files this image carries - apps.txt, apps.json
            # and the built assets. Nothing did this until 23 Sep 2026, so dev was
            # serving the JS/CSS built on 27 Aug and production the build of 19 Aug,
            # and a newly added app had no assets folder at all (ALV-112). The old
            # containers keep working during the copy: bundles land first, the
            # manifest last, and old bundles are not removed.
            bash ../../scripts/refresh_bench_files.sh "$FULL_IMAGE" "${PROJECT}_sites"

            # Containers first, maintenance mode second. The other order deadlocks:
            # the backend's healthcheck curls /api/method/ping on HEALTH_HOST, and
            # maintenance mode makes that return 503, so `curl -fsS` fails, so the
            # backend is never healthy, so nginx - which depends on it - never
            # starts, so `up -d` exits non-zero and the deploy aborts having already
            # swapped the containers. That is not a theory: it took production down
            # for fifteen minutes on 2026-09-05, with nginx left in Created and the
            # site stuck in maintenance.
            #
            # The cost of this order is a short window where the new image serves
            # against the old schema. Seconds, and the alternative is a deploy that
            # cannot succeed at all.
            if ! $DC up -d --remove-orphans; then
              echo "::error::up -d failed"
              # Never leave the proxy down. The shared nginx depends on backend
              # being healthy, so an unhealthy backend takes every site offline.
              # Restart it by name: it lives in the `compose` project whichever
              # environment is being deployed.
              docker restart compose-nginx-1 >/dev/null 2>&1 || true
              exit 1
            fi

            for i in $(seq 1 60); do
              $DC exec -T backend bench version >/dev/null 2>&1 && break
              sleep 5
            done

            if [ "$MIGRATE" = "true" ]; then
              # Frappe migrations are per-site and not transactional across the
              # tenant fleet — maintenance mode covers the whole window. (§14.3)
              maint on
            fi

            if [ "$MIGRATE" = "true" ]; then
              # MUST run before migrate, never after.
              #
              # The image has just been swapped. If the app was renamed in this release,
              # the site database still names the OLD app - and that package no longer
              # exists on disk. Every doctype in its module then fails get_controller()
              # with ImportError, and migrate's remove_orphan_doctypes DELETES them as
              # abandoned. Not hypothetical: it happened in testing and took four
              # doctypes with it (commit a590375).
              #
              # A patch cannot do this job - patches are discovered per installed app and
              # are invisible while the site still believes the old name. Hence a plain
              # execute, here, first.
              #
              # Idempotent: prints "nothing to do" on an already-renamed site. But
              # "--site all execute <dotted path into an app>" is not like "--site
              # all migrate" - it needs that app importable on EVERY site, and fails
              # the whole deploy the moment one site never had it (sargam.dev.alvoraa.co,
              # 2026-09-22: hard failure, safe rollback, nothing lost, but every
              # deploy would repeat it). So: run it per site, and only on a site
              # that actually has some form of the goals app installed.
              for site in $(list_sites); do
                if $DC exec -T backend bench --site "$site" list-apps 2>/dev/null \
                     | grep -qxE 'alvoraa_goals|grace_goals|alvox_goals'; then
                  $DC exec -T backend bench --site "$site" execute alvoraa_goals.deploy_utils.premigrate_rename
                else
                  echo "premigrate_rename: skipping $site (no goals app installed under any name)"
                fi
              done

              $DC exec -T backend bench --site all migrate
              $DC exec -T backend bench --site all clear-cache
              maint off
            fi

            # nginx resolves the backend ONCE, at start, and caches the address.
            # `up -d` gives the recreated containers new addresses, so every site
            # 502s until nginx is restarted - which is what just happened on the
            # first real auto-deploy: the swap and the migrations both succeeded
            # and the smoke test still failed, because nginx was talking to
            # containers that no longer existed.
            #
            # One nginx serves every environment on this host, so this is the one
            # step of a dev deploy that production notices. It is a restart of a
            # proxy holding no state - about two seconds - and the alternative is
            # leaving dev broken after every deploy.
            docker restart compose-nginx-1 >/dev/null 2>&1 || true
            sleep 5

            # ── Keep the disk from filling up with old builds ──────────────
            #
            # `docker image prune -f` removes DANGLING images only - untagged
            # leftovers. Every build here is tagged (alvoraa-app:dev-<sha>), so this
            # line never touched a single one of them, and the "until=168h" it
            # carried was beside the point.
            #
            # They piled up: 43 images at 11.2 GB each. On 2026-09-10 that took
            # the 193 GB disk to 100% full and three deploys in a row hung with
            # nowhere to write the new image - each dying silently after ~27
            # minutes, because a stalled `docker compose pull` says nothing.
            #
            # So the dangling sweep stays, and the tagged builds are handled
            # too. Anything a container is running is kept - docker refuses to
            # remove those anyway - plus the two most recent prod tags and the
            # three most recent dev tags. That is the rollback window. Older
            # ones still exist in the registry; rolling back to one costs a
            # few minutes to pull rather than being impossible.
            docker image prune -f --filter "until=48h" || true

            # BOTH package names, old and new. Matching only the new one would
            # leave the old builds on disk for ever; matching only the old one
            # (as this did before 2026-09-22) would never clean up a new build,
            # and the disk would fill exactly as it did on 2026-09-10. The old
            # name can leave this pattern once the old package is deleted and no
            # hr-app image is left on the server.
            APP_IMAGES='/(alvoraa-app|hr-app):'
            KEEP=$(
              {
                docker ps --format '{{.Image}}'
                docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' \
                  | grep -E "${APP_IMAGES}prod-" | sort -r | head -2 | cut -f2-
                docker images --format '{{.CreatedAt}}\t{{.Repository}}:{{.Tag}}' \
                  | grep -E "${APP_IMAGES}dev-"  | sort -r | head -3 | cut -f2-
              } | sort -u
            )
            # An empty KEEP would make the grep below match nothing and delete
            # everything, including what is running. Never guess here.
            if [ -n "$KEEP" ]; then
              docker images --format '{{.Repository}}:{{.Tag}}' \
                | grep -E "$APP_IMAGES" | grep -v ':<none>' \
                | grep -vxF "$KEEP" \
                | xargs -r -n1 docker rmi >/dev/null 2>&1 || true
            fi
            echo "Disk after cleanup:"
            df -h / | tail -1

      # Runs whatever happened above, including a failed deploy.
      #
      # Three dev deploys in a row finished 'success' with one tenant still
      # serving 503 and the sites 502 - always the same tenant, the one that
      # sorts first. Every attempt to reproduce it by hand succeeded: plain
      # docker exec, compose exec -T, before and after clear-cache, errors
      # unsuppressed, exit 0 every time. The cause was not found.
      #
      # So this stops depending on finding it. Clearing a flag that is already
      # clear costs nothing; leaving a tenant in maintenance takes them offline
      # until a human notices. This step is the guarantee; the loop in Deploy
      # is now only the fast path.
      - name: Restore service
        if: always()
        run: |
          set -uo pipefail
          cd /var/www/html/hr-app/deploy/compose
          export COMPOSE_PROJECT_NAME="$PROJECT"
          DC="docker compose -f docker-compose.app.yml -f $OVERLAY --env-file ../envs/${ENV_NAME}.env --env-file $PIN_FILE"
          for site in $($DC exec -T backend bash -c 'ls -1 /home/frappe/frappe-bench/sites' \
                        | tr -d '\r' \
                        | grep -vE '^(assets|apps[.]txt|apps[.]json|.*[.]json|currentsite[.]txt)$'); do
            $DC exec -T backend bench --site "$site" set-config -p maintenance_mode 0 || true
          done
          # One nginx serves every environment and caches the backend address,
          # so a container swap leaves every site 502 until it is restarted.
          #
          # But this step runs `if: always()`, including after a FAILED deploy - so
          # it is the last place a bad config could still reach nginx. Check first.
          # If the file on disk does not parse, do not restart: a running nginx is
          # still happily serving the config it read at start-up, and restarting it
          # would turn a failed deploy into an outage on every site, production
          # included. Leaving dev at 502 until a human looks is the cheaper failure.
          CERT_DIR=$(grep -hE '^TLS_CERT_DIR=' "../envs/${ENV_NAME}.env" 2>/dev/null \
                     | tail -1 | cut -d= -f2-) || CERT_DIR=""
          #
          # If the checker itself is not in the tree - the Deploy step can fail at
          # its own checkout, leaving the previous release on disk - fall back to the
          # old behaviour. That config was parsed by the running nginx already.
          if [ ! -f ../../scripts/check_nginx_parses.sh ]; then
            echo "::warning::nginx checker not in this tree - restarting unchecked"
            docker restart compose-nginx-1 >/dev/null 2>&1 || true
            sleep 6
            echo 'service restored'
          elif bash ../../scripts/check_nginx_parses.sh ../nginx.conf "${CERT_DIR:-/etc/letsencrypt}"; then
            docker restart compose-nginx-1 >/dev/null 2>&1 || true
            sleep 6
            echo 'service restored'
          else
            echo "::error::deploy/nginx.conf does not parse - nginx was NOT restarted."
            echo "::error::The running nginx still serves the config it read at start."
            echo "::error::Sites pointing at recreated containers will 502 until a"
            echo "::error::human fixes deploy/nginx.conf and restarts compose-nginx-1."
          fi

      # ALV-112, 6 Oct 2026. `bench build` links each app's public directory
      # rather than copying it, and `refresh_bench_files.sh` faithfully copies
      # those links into the sites volume. nginx mounts ONLY that volume and has
      # no /apps, so every link that points outside it is a 404.
      #
      # Nothing ran the fix. `scripts/materialise_assets.sh` existed from the
      # start but only as a hand step in DEPLOYMENT_RUNBOOK.md, so it happened
      # when somebody remembered. It also only walked the top level, which left
      # the one that bites:
      #
      #     frappe/public/node_modules -> apps/frappe/node_modules   (~324 MB)
      #
      # Most of the desk survives that, because its CSS and JS are real files.
      # What dies is anything served straight from node_modules - and the one
      # people meet is the code editor, so every Code field renders as a label
      # with no editable box and the console says "Cannot read properties of
      # undefined (reading 'config')". Found on dtc.alvoraa.co, where it made
      # the Server Script form unusable.
      #
      # Runs in the backend container because only it has BOTH the sites volume
      # and /apps - the link targets live under /apps. After the containers are
      # up, before the asset check below, so that check sees the finished state.
      - name: Assets must be real files, not links out of the volume
        run: |
          set -uo pipefail
          cd /var/www/html/hr-app/deploy/compose
          export COMPOSE_PROJECT_NAME="$PROJECT"
          DC="docker compose -f docker-compose.app.yml -f $OVERLAY --env-file ../envs/${ENV_NAME}.env --env-file $PIN_FILE"
          # Fed on stdin so nothing has to be copied into the container.
          if ! $DC exec -T backend bash -s \
               < /var/www/html/hr-app/scripts/materialise_assets.sh; then
            echo "::error::materialise_assets.sh failed - assets may 404"
            exit 1
          fi

      - name: Smoke test
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' \
                   -H "Host: ${{ needs.plan.outputs.smoke_site }}" \
                   "https://${{ needs.plan.outputs.smoke_site }}/api/method/ping" || true)
            if [ "$code" = "200" ]; then echo "ping OK"; exit 0; fi
            echo "attempt $i: HTTP $code"; sleep 10
          done
          echo "::error::Smoke test failed — /api/method/ping never returned 200"
          exit 1

      # ── The portal's three static files must actually be served ───────────
      #
      # Slice 034, OPS-35 and OPS-36, review finding F1. The employee portal's
      # styles and script are no longer inside the page; they are three files
      # under /assets/, served by nginx with `try_files $uri =404` and told to
      # cache for 30 days.
      #
      # So a 404 on portal.js is the WHOLE PORTAL GONE, silently. The page still
      # renders its shell, nothing runs, nothing reaches the backend, and so
      # nothing appears in any log. The smoke test above would not catch it - it
      # asks the API, not the assets. Until now the only thing between that and
      # a client's employees was a person remembering to check afterwards.
      #
      # It runs here on purpose: after Restore service, so nginx has been
      # restarted and is serving the new containers, and after the smoke test,
      # so the site is known to be up and a 404 means the assets rather than the
      # server.
      - name: Portal assets must be served
        run: |
          set -uo pipefail
          SITE="${{ needs.plan.outputs.smoke_site }}"
          FAILED=0
          for path in \
            /assets/alvoraa_portal/css/ess/frame.css \
            /assets/alvoraa_portal/css/ess/panels.css \
            /assets/alvoraa_portal/js/ess/portal.js \
            /assets/frappe/node_modules/ace-builds/src-min-noconflict/ace.js
          do
            # `|| echo "000 0"` is not swallowing anything: a curl that cannot
            # connect becomes a status of 000, which fails the check below. The
            # length is checked too, because a zero-length portal.js answers 200
            # and is just as dead as a 404.
            out=$(curl -sk -o /dev/null -w '%{http_code} %{size_download}' \
                  -H "Host: $SITE" "https://$SITE$path" || echo "000 0")
            code=${out%% *}
            len=${out##* }
            case "$len" in ''|*[!0-9]*) len=0 ;; esac
            if [ "$code" = "200" ] && [ "$len" -gt 0 ]; then
              echo "OK   $path  (HTTP $code, $len bytes)"
            else
              echo "::error::$path is not served: HTTP $code, $len bytes"
              FAILED=1
            fi
          done
          if [ "$FAILED" != "0" ]; then
            echo "::error::The employee portal's static files are missing or empty."
            echo "::error::The portal page will render and then do NOTHING, and no"
            echo "::error::error will appear in the backend logs, because nothing"
            echo "::error::reaches the backend. Check that refresh_bench_files.sh ran"
            echo "::error::against the right sites volume, then deploy again. Do not"
            echo "::error::announce this release."
            exit 1
          fi
          echo "all three portal asset files are served"

      # ── Are the background workers actually working? ──────────────────────
      #
      # This step used to be `continue-on-error: true` with `|| true` on the only
      # command that checked anything, so it could not fail and nobody read it.
      # Meanwhile, between 2026-09-10 and 2026-09-19, both production workers were
      # dead and 700 jobs sat on the `default` queue with nothing to run them.
      # `docker ps` said "Up 12 days" the whole time - see scripts/check_workers.sh.
      #
      # So it is a gate now. A deploy that leaves a queue with no live worker is a
      # failed deploy, and it says so here rather than in nine days' time.
      #
      # It runs AFTER the smoke test on purpose: the site being up is the more
      # urgent fact, and a worker that is still registering after a container swap
      # gets those extra seconds to appear.
      - name: Background workers must be working
        run: |
            set -uo pipefail
            cd /var/www/html/hr-app/deploy/compose
            export COMPOSE_PROJECT_NAME="$PROJECT"
            DC="docker compose -f docker-compose.app.yml -f $OVERLAY --env-file ../envs/${ENV_NAME}.env --env-file $PIN_FILE"
            $DC ps
            # Context, not a gate: `doctor` counts workers but cannot say which
            # queues they cover, and it needs a site to talk to.
            $DC exec -T backend bench --site ${{ needs.plan.outputs.smoke_site }} doctor || true

            # The Deploy step can fail at its own checkout and leave the previous
            # release on disk, so the checker is not always here. Say so rather
            # than failing a deploy over a missing file.
            if [ ! -f ../../scripts/check_workers.sh ]; then
              echo "::warning::scripts/check_workers.sh is not in this tree - workers NOT verified"
              exit 0
            fi

            # Workers register with redis a few seconds after the container starts.
            # Give them a minute before calling it a failure.
            for attempt in 1 2 3 4 5 6; do
              if bash ../../scripts/check_workers.sh "$PROJECT"; then exit 0; fi
              echo "attempt $attempt: workers not all healthy yet, waiting 10s"
              sleep 10
            done
            echo "::error::A queue has no live worker after this deploy. Background jobs"
            echo "::error::- scheduled jobs, emails, tenant provisioning - are NOT running."
            echo "::error::See the FAIL lines above. Nothing has been changed automatically."
            exit 1

      - name: Rollback instructions
        if: failure()
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<'EOF'
          ## Deploy failed — how to roll back

          **Code-only release (no migration ran):** re-run this workflow with the
          previous image tag and migrations off. Takes ~2 minutes.

          Actions → Deploy → Run workflow →
          `environment: ${{ needs.plan.outputs.environment }}`,
          `image_tag: <previous tag>`, `run_migrations: false`,
          `image_package: alvoraa-app`

          Releases from before the move to the private package were copied into
          alvoraa-app, so their tags work there too. Only if a tag is missing
          from alvoraa-app, and the old public package still exists, use
          `image_package: hr-app`. See docs/runbooks/2026-09-private-image-package.md.

          **A migration ran:** redeploy the previous tag **and** restore the
          pre-deploy backup for each affected site. Frappe patches are not
          reversible. See ARCHITECTURE.md §14.4 and §17.
          EOF
          exit 1
