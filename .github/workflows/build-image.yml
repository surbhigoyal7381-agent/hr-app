name: Build Image

# Builds ONE image containing the full Frappe bench: frappe + erpnext +
# india_compliance + Frappe CRM (pinned tag, slice 040) + the hrms fork from this
# repo + alvoraa_goals + alvoraa_portal, with assets pre-built. The same image runs every process role (web, socketio, scheduler,
# worker) — see ARCHITECTURE.md §5.
#
# Fires on a push to any of the three environment branches. The resulting tag
# is what the deploy workflow picks up:
#
#   dev   →  dev-<sha>
#   test  →  test-<sha>
#   main  →  prod-<sha>  (+ the release tag, if the push was a v* tag)

on:
  push:
    branches: [dev, test, main]
    tags: ["v*"]
    # App-only pushes are not in the image (deploy/Dockerfile copies only hrms,
    # alvoraa_goals and alvoraa_portal). Building and deploying for them would
    # restart the nginx that also serves production for nothing (slice 013,
    # OPS-72). A push that mixes app and server files still builds. ci.yml has
    # NO such filter on purpose: its key guard must run on app pushes.
    paths-ignore:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

# ── Why the image is called alvoraa-app and not hr-app ────────────────────────
#
# Until 2026-09 the image went to ghcr.io/<owner>/hr-app, named after the
# repository (IMAGE_NAME was `github.repository`). That package was PUBLIC: anyone
# could pull the image and read the whole application out of it, even after the
# repository went private on 18 Sep.
#
# GitHub will not make a public package private again. The documentation says
# "Once you make a package public, you cannot make it private again", and the
# visibility switch was tried twice on 22 Sep and stayed public. So the image
# moves to a NEW package. A package first pushed by a workflow "inherits the
# visibility and permissions model of the repository where the workflow is run"
# (GitHub docs, checked 2026-09-22), and this repository is private - so
# alvoraa-app is private from its first push, and linked to this repository.
# The old public package is deleted by hand once production runs from the new one
# (docs/runbooks/2026-09-private-image-package.md).
#
# Do NOT set IMAGE_NAME back to `github.repository`: that is the old public package.
# The same name is written in deploy.yml. Change both together.
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: surbhigoyal7381-agent/alvoraa-app
  # The old public package. Only the changeover step below uses it.
  OLD_IMAGE_NAME: surbhigoyal7381-agent/hr-app
  # Production releases built before the move, copied into the new package so a
  # rollback to them works from alvoraa-app like any other tag. prod-65878e8 is
  # what production ran on 22 Sep; prod-d99ba99 is the rollback tag kept on the
  # server. The release main points at is added to this list automatically.
  CARRY_TAGS: prod-65878e8 prod-d99ba99

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag:    ${{ steps.name.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # hrms/frappe-ui

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tag from branch
        id: name
        run: |
          SHORT=$(echo "${GITHUB_SHA}" | cut -c1-7)
          case "${GITHUB_REF_NAME}" in
            dev)  PREFIX=dev  ;;
            test) PREFIX=test ;;
            main) PREFIX=prod ;;
            v*)   PREFIX=prod ;;      # release tag on main
            *)    PREFIX=wip  ;;
          esac
          echo "tag=${PREFIX}-${SHORT}" >> $GITHUB_OUTPUT
          echo "prefix=${PREFIX}"       >> $GITHUB_OUTPUT

      # ── The changeover: which package does the DEPLOY read today? ─────────
      #
      # The automatic deploy runs `main`'s copy of deploy.yml, whatever branch is
      # being deployed - GitHub always runs a workflow_run trigger from the
      # default branch (docs/runbooks/making-the-repo-private.md, "The trap").
      # So after this change reaches dev, and until it reaches main, every
      # automatic DEV deploy still pulls from the old hr-app package. If this
      # build pushed only to alvoraa-app, those deploys would fail at the pull.
      #
      # So, while main's deploy.yml still reads the old name, this build ALSO
      # pushes to hr-app, and copies main's release images into alvoraa-app for
      # rollback. The moment main's deploy.yml names alvoraa-app, both stop by
      # themselves and nothing new ever reaches the public package again. No
      # flag to remember to switch off.
      #
      # A failed fetch fails the build on purpose. Guessing "old" would keep
      # publishing to the public package; guessing "new" would break dev deploys.
      - name: Which package does main's deploy read?
        id: changeover
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          NEW="${REGISTRY}/${IMAGE_NAME}"
          if git show FETCH_HEAD:.github/workflows/deploy.yml \
               | grep -qE "^[[:space:]]*IMAGE_NAME:[[:space:]]*${IMAGE_NAME}[[:space:]]*$"; then
            echo "main's deploy reads ${IMAGE_NAME} - pushing there only."
            echo "also_old=false" >> "$GITHUB_OUTPUT"
            echo "images=${NEW}"  >> "$GITHUB_OUTPUT"
          else
            echo "::warning::main's deploy still reads ${OLD_IMAGE_NAME} - pushing to BOTH packages until the release that carries this change reaches main."
            echo "also_old=true"                                 >> "$GITHUB_OUTPUT"
            echo "images=${NEW},${REGISTRY}/${OLD_IMAGE_NAME}"   >> "$GITHUB_OUTPUT"
            echo "main_tag=prod-$(git rev-parse FETCH_HEAD | cut -c1-7)" >> "$GITHUB_OUTPUT"
          fi

      # ── Room to build ─────────────────────────────────────────────────────
      # The pre-CRM image fitted the runner's disk; the CRM build (23 Sep 2026)
      # died with "ResourceExhausted ... failed to write compressed diff" before
      # the yarn-cache-mount fix landed. This comment used to say "about 14 GB
      # free" - stale. Measured on a normal run (36323595557, 27 Sep 2026, after
      # the fix): 86 GB free before this step, 109 GB after. Re-measure at the
      # time you rely on this number; don't carry it forward blind either. The
      # runner also ships toolchains this build never touches - .NET, Android,
      # Haskell, CodeQL - which is the space we take back. Runner-only: nothing
      # here changes what goes into the image.
      - name: Free disk on the runner
        run: |
          df -h / | tail -1 | awk '{print "free before: " $4}'
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc                       /usr/local/share/boost /opt/hostedtoolcache/CodeQL                       /usr/local/.ghcup 2>/dev/null || true
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1 | awk '{print "free after:  " $4}'

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.changeover.outputs.images }}
          tags: |
            type=raw,value=${{ steps.name.outputs.tag }}
            type=raw,value=${{ steps.name.outputs.prefix }}-latest
            type=ref,event=tag

      # amd64 + arm64 so the target cloud can be chosen later without a
      # pipeline change. Drop one platform to roughly halve build time.
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          # amd64 only. The production server is x86_64 (verified), so arm64 was
          # speculative - and it is built under QEMU emulation, which is slow and
          # memory-hungry. `bench build --production` was being killed with SIGTERM
          # (exit 143) rather than failing on a real error. Re-add arm64 when a target
          # actually needs it, ideally on a native arm runner rather than emulation.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # ── No build-args on purpose (ALV-156, slice 055) ──────────────────
          #
          # These four used to be repeated here: FRAPPE_BRANCH, ERPNEXT_BRANCH,
          # CRM_TAG and WHATSAPP_COMMIT. A build-arg WINS over the Dockerfile's
          # ARG default, so a pin written in deploy/Dockerfile and not repeated
          # here would have been ignored by every CI build - a change that looks
          # applied and is not. INDIA_COMPLIANCE_BRANCH was never listed here,
          # which is how two files came to disagree without anyone noticing.
          #
          # deploy/Dockerfile is now the ONE place the versions live. Pass a
          # build-arg here only to try a version bump, and never leave it in.

      # ── Copy the old releases into the new package, for rollback ─────────
      #
      # Without this, a rollback to prod-65878e8 after the change would look for
      # that tag in alvoraa-app, where it was never built, and fail at the pull.
      # Copied here, a rollback to an old release is the same one-line dispatch
      # as any other rollback, before AND after the old package is deleted.
      #
      # `imagetools create` copies inside the registry: same manifest, same
      # digest, no rebuild, nothing downloaded to this runner. It runs only
      # during the changeover (see the step above), skips a tag that is already
      # there, and only warns about one it cannot find - a missing rollback copy
      # must not block a dev build. The runbook checks the copies by hand
      # before the old package is deleted.
      - name: Copy old releases into the new package
        if: steps.changeover.outputs.also_old == 'true'
        env:
          MAIN_TAG: ${{ steps.changeover.outputs.main_tag }}
        run: |
          set -uo pipefail
          NEW="${REGISTRY}/${IMAGE_NAME}"
          OLD="${REGISTRY}/${OLD_IMAGE_NAME}"
          for tag in $(printf '%s\n' $CARRY_TAGS "$MAIN_TAG" | sort -u); do
            if docker buildx imagetools inspect "${NEW}:${tag}" >/dev/null 2>&1; then
              echo "${tag}: already in ${IMAGE_NAME}"
            elif ! docker buildx imagetools inspect "${OLD}:${tag}" >/dev/null 2>&1; then
              echo "::warning::${tag}: not found in ${OLD_IMAGE_NAME} either - NOT copied. A rollback to it will not work from ${IMAGE_NAME}."
            elif docker buildx imagetools create --tag "${NEW}:${tag}" "${OLD}:${tag}"; then
              echo "${tag}: copied from ${OLD_IMAGE_NAME}"
            else
              echo "::warning::${tag}: copy FAILED - a rollback to it will not work from ${IMAGE_NAME}."
            fi
          done

      # ── Copy the old releases into the new package, for rollback ─────────
      #
      # Without this, a rollback to prod-65878e8 after the change would look for
      # that tag in alvoraa-app, where it was never built, and fail at the pull.
      # Copied here, a rollback to an old release is the same one-line dispatch
      # as any other rollback, before AND after the old package is deleted.
      #
      # `imagetools create` copies inside the registry: same manifest, same
      # digest, no rebuild, nothing downloaded to this runner. It runs only
      # during the changeover (see the step above), skips a tag that is already
      # there, and only warns about one it cannot find - a missing rollback copy
      # must not block a dev build. The runbook checks the copies by hand
      # before the old package is deleted.
      - name: Copy old releases into the new package
        if: steps.changeover.outputs.also_old == 'true'
        env:
          MAIN_TAG: ${{ steps.changeover.outputs.main_tag }}
        run: |
          set -uo pipefail
          NEW="${REGISTRY}/${IMAGE_NAME}"
          OLD="${REGISTRY}/${OLD_IMAGE_NAME}"
          for tag in $(printf '%s\n' $CARRY_TAGS "$MAIN_TAG" | sort -u); do
            if docker buildx imagetools inspect "${NEW}:${tag}" >/dev/null 2>&1; then
              echo "${tag}: already in ${IMAGE_NAME}"
            elif ! docker buildx imagetools inspect "${OLD}:${tag}" >/dev/null 2>&1; then
              echo "::warning::${tag}: not found in ${OLD_IMAGE_NAME} either - NOT copied. A rollback to it will not work from ${IMAGE_NAME}."
            elif docker buildx imagetools create --tag "${NEW}:${tag}" "${OLD}:${tag}"; then
              echo "${tag}: copied from ${OLD_IMAGE_NAME}"
            else
              echo "::warning::${tag}: copy FAILED - a rollback to it will not work from ${IMAGE_NAME}."
            fi
          done

      - name: Summary
        run: |
          {
            echo "### Image built"
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Tag:    \`${{ steps.name.outputs.tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pushed to: \`${{ steps.changeover.outputs.images }}\`"
          } >> $GITHUB_STEP_SUMMARY

  scan:
    name: Vulnerability scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      # The package is private now, so the scanner has to sign in to read it.
      # While it was public this worked anonymously, which is why there was no
      # sign-in here. Trivy reads these two variables for registry access; the
      # job's own token with `packages: read` is enough.
      - name: Trivy scan
        # v0.36.0, not 0.24.0. The action moved to v-prefixed tags, so the old
        # unprefixed tag no longer resolves at all - the job fails before it runs.
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # Print the findings into the job log as well. Uploading SARIF is the nicer
      # presentation, but it needs a feature this repository does not have (see below)
      # - and a vulnerability report nobody can read is not a report.
      - name: Show findings in the log
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Report only. Flip to 1 to make HIGH/CRITICAL findings block a release once
          # someone owns triaging them; today it would just wedge the pipeline on
          # upstream CVEs in the Frappe base image.
          exit-code: "0"

      # Publishing to the Security tab needs GitHub Advanced Security, which on a
      # PRIVATE repository requires Enterprise. Without it this step fails with
      #   Resource not accessible by integration
      # even though the scan itself succeeded. That is NOT a reason to make the
      # repository public: this is proprietary HR software with customer data in its
      # history, and trading that for a dashboard would be a bad bargain. So the upload
      # is best-effort and never fails the build - the findings are in the log above
      # either way.
      - name: Upload results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy.sarif
