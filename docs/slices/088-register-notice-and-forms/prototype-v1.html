input[type=file]{font:inherit;font-size:16px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}

button{font:inherit;color:inherit;cursor:pointer}

#demo .sample{border:1px solid var(--amber);color:var(--amber);border-radius:var(--r-sm);padding:2px 8px;font-weight:700;font-size:12px}

#stage.desktop{max-width:1040px;padding:0 16px;overflow:visible}
#stage.desktop.emp{max-width:560px;height:min(800px,calc(100vh - 150px));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;padding:0}
@media(max-width:460px){#stage.phone{border:0;border-radius:0;width:100%;margin:0}}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.app-h{background:var(--surface);border-bottom:1px solid var(--border);padding:16px}
.app-h b{font-size:18px;line-height:24px;display:block}.app-h small{font-size:13px;color:var(--text3)}
.pad{padding:16px 16px 24px}
.desktop:not(.emp) .app-h{background:none;border:0;padding:16px 0 8px}
.desktop:not(.emp) .pad{padding:8px 0 24px}
.sub{font-size:14px;color:var(--text2);margin:4px 0 0}
.muted{color:var(--text3);font-size:13px}
.hint{font-size:13px;color:var(--text3);margin:8px 0 0}
.sl{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:20px;font-weight:600}

.sl small{display:block;font-weight:400;color:var(--text2);font-size:13px}
.btn{min-height:48px;padding:8px 20px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);font-weight:600;font-size:15px}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h)}

.btn-sm{min-height:44px;padding:6px 14px;font-size:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh1);margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px}
.stub{font-size:14px;display:flex;gap:8px;align-items:center;color:var(--text2)}

.mbar{display:flex;align-items:center;gap:8px;margin:12px 0}
.mbar b{min-width:150px;text-align:center;font-size:16px}
.mbar button{width:44px;height:44px;border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-sm);font-size:18px}
.mbar button[disabled]{opacity:.4;cursor:not-allowed}
.tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:8px 0}
.selall{display:flex;align-items:center;min-height:44px;gap:4px;font-weight:600;font-size:14px}
.cb{width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.cb input{width:22px;height:22px;accent-color:var(--primary)}
.list{container-type:inline-size}
.row{display:grid;grid-template-columns:44px 1fr auto;gap:4px 8px;align-items:center;padding:8px 16px 8px 4px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);margin-top:8px}

.row .meta{font-size:13px;color:var(--text2)}
.row .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.row .note{grid-column:2/4;font-size:13px;color:var(--text2)}
@container (max-width:600px){.row{grid-template-columns:44px 1fr}.row .acts{grid-column:2;justify-content:flex-start}.row .note{grid-column:2}}
.sk{height:72px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--surface),var(--surface2));margin-top:8px;border:1px solid var(--border)}

.logline{font-size:13px;color:var(--text3);margin:16px 0 0;display:flex;gap:8px}

.pvwrap{background:var(--surface2);padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:16px}
/* ---- the A4 sheet. Paper: always black on white, no colour needed, so a black-and-white printer is fine ---- */
.a4{width:210mm;height:297mm;background:#fff;color:#000;padding:11mm 14mm 9mm;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--sh3);font-family:"Noto Sans Devanagari","Nirmala UI",var(--font);font-size:11pt;line-height:1.3;flex:none}

.a4 h2{font-size:19pt;margin:4mm 0 1mm;line-height:1.2}
.a4 h2 .hi{font-size:14pt;font-weight:700}
.a4 .who{border:1.5pt solid #000;padding:2mm 3mm;margin:3mm 0}
.a4 .who .nm{font-size:16pt;font-weight:700}
.a4 .intro{margin:0 0 3mm}
.a4 table{width:100%;border-collapse:collapse;table-layout:fixed}
.a4 th{font-size:9.5pt;text-align:left;border-bottom:1.5pt solid #000;padding:1mm 2mm 1mm 0;vertical-align:bottom}
.a4 th .hi{font-weight:400}
.a4 td{vertical-align:top;border-bottom:.75pt solid #777;padding:2mm 2mm 2mm 0;font-size:10.5pt}
.a4 td.d{font-weight:700;font-size:12pt}
.a4 td .hi{font-size:9.5pt}
.a4 td .cnt{margin-top:1mm;font-weight:700}
.a4 .signblk{margin-top:auto}
.a4 .read{font-weight:700;font-size:12pt;margin:0 0 2mm}
.a4 .boxes{display:flex;gap:4mm;margin-top:2mm}
.a4 .box{border:1.5pt solid #000;height:26mm;padding:1mm 2mm;font-size:9.5pt}
.a4 .box.s{flex:1}.a4 .box.dt{width:44mm}
.a4 .rule{border:1pt solid #000;padding:1.5mm 3mm;margin:2mm 0;font-weight:700}
.a4 .rule.l{font-weight:400;border-style:dashed}
.a4 .foot{font-size:8.5pt;margin-top:3mm;border-top:.75pt solid #000;padding-top:1.5mm;color:#222}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff}
 #demo,.noprint,#toast,#scrim{display:none!important}

 .scroll{overflow:visible}.pvwrap{background:none;padding:0;display:block}
 .a4{zoom:1!important;box-shadow:none;margin:0;break-after:page;page-break-after:always}
}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:var(--r);box-shadow:var(--sh3);z-index:90;max-width:92vw;display:none;font-size:14px}

function doReg(){
 const p=P.find(x=>x.id===REG.id),pages=p.printed.pages||1;
 if(!REG.files.length){REG.err=t("rg_err");render();return}
 if(REG.files.length!==pages){REG.err=t("rg_err2",pages,REG.files.length);render();return}
 const cov=open(p).filter(x=>p.printed.ids.includes(x.i));
 cov.forEach(x=>{x.c.st="signed";x.c.sig={by:meName(),on:"21 Nov"}});
 if(open(p).length)p.printed=null;
 toast(te("toast_reg",p.name,cov.length));REG=null;render();
}
/* ---------- employee with the app ---------- */
function empView(){
 const p=P[0],n=p.ch.length,s=p.ch.slice().sort((a,b)=>a.d-b.d);
 const stt=c=>c.st==="signed"?"ea_s":c.st==="app"?"ea_a":"ea_n";
 const rows=EAOPEN?`<div style="margin-top:12px">`+s.map(c=>`<button class="row" style="display:block;width:100%;text-align:left;padding:12px 16px;min-height:56px" onclick="toast(te('ea_open'))"><div class="nm">${dayTxt(c,LANG)}: ${kindTxt(c,LANG)}</div><div class="meta">${t("ea_by",esc(c.by),roleTxt(c,LANG))}, ${c.on}</div><div class="meta" style="font-weight:600;color:var(--text)">${t(stt(c))}</div></button>`).join("")+`<p class="hint">${t("ea_tip")}</p></div>`:"";
 return`<div class="scroll"><div class="app-h"><b>${t("ea_h")} · ${LANG==="hi"?MHI[1]:MFULL[1]}</b><small>Ravi Sample (Sample), signed in with the app</small></div><div class="pad">
 <div class="card"><div class="sl sl-wait">${ic("info")}<span>${t("ea_l",n)}</span></div><button class="btn btn-sm" style="margin-top:8px" aria-expanded="${EAOPEN}" onclick="EAOPEN=!EAOPEN;render()">${EAOPEN?t("ea_x"):t("ea_b")}</button>${rows}</div>
 <p class="muted">Prototype note: ${te("ea_rest")}</p></div></div>`}
/* ---------- shell ---------- */
function render(){
 const st=$("stage");st.className=(DEV==="phone"||VIEW==="emp"&&false?"phone":"desktop")+(VIEW==="emp"?" emp":"");
 if(VIEW==="emp"&&DEV==="phone")st.className="phone emp";
 document.documentElement.setAttribute("data-theme",THEME);document.documentElement.lang=LANG==="hi"?"hi":"en";
 st.innerHTML=(VIEW==="list"?hrView():VIEW==="preview"?pvView():empView())+(REG&&VIEW==="list"?regHtml():"");
 buildDemo();
 const d=document.documentElement.dataset;d.overflow=[...document.querySelectorAll(".a4")].map(a=>a.scrollHeight>a.clientHeight+1?"OVER":"ok").join(",");
 d.wide=document.documentElement.scrollWidth>document.documentElement.clientWidth?"WIDE":"ok";
 fit();
 d.small=[...document.querySelectorAll("#stage button,#stage .cb")].filter(e=>e.offsetHeight<44&&e.offsetHeight>0).length;
}
function show(v){VIEW=v;REG=null;if(v==="emp"&&DEV==="desktop"){}render()}
function jump(k){
 if(k==="list"){VIEW="list";LST="ok";MI=1}
 else if(k==="pv1"){PV=["e1"];VIEW="preview"}
 else if(k==="pv2"){PV=["e2"];VIEW="preview"}
 else if(k==="reg"){VIEW="list";LST="ok";MI=1;WHO="kav";REG={id:"e3",files:[],err:""}}
 else if(k==="emp"){VIEW="emp"}
 render();
}
function buildDemo(){
 const g=(id,items)=>{const e=$(id),lab=e.firstElementChild.outerHTML;e.innerHTML=lab+items.map(([l,on,fn])=>`<button aria-pressed="${on}" onclick="${fn}">${l}</button>`).join("")};
 g("g-show",[["1 HR list",VIEW==="list"&&!REG,"jump('list')"],["2 A4 notice, 3 changes",VIEW==="preview"&&PV[0]==="e1","jump('pv1')"],["3 A4 notice, 14 changes (3 pages)",VIEW==="preview"&&PV[0]==="e2","jump('pv2')"],["4 Record signature",!!REG,"jump('reg')"],["5 Employee with the app",VIEW==="emp","jump('emp')"]]);
 g("g-who",[["Kavita (HR)",WHO==="kav","WHO='kav';render()"],["Anil (HR, filed Ravi's changes)",WHO==="anil","WHO='anil';render()"]]);
 g("g-st",[["Normal",LST==="ok","setLst('ok')"],["Loading",LST==="load","setLst('load')"],["Error",LST==="err","setLst('err')"]]);
 g("g-dev",[["Laptop",DEV==="desktop","DEV='desktop';render()"],["Phone 390",DEV==="phone","DEV='phone';render()"]]);
 g("g-lang",[["English",LANG==="en","LANG='en';render()"],["हिंदी (machine draft)",LANG==="hi","LANG='hi';render()"]]);
 g("g-th",[["Light",THEME==="light","THEME='light';render()"],["Dark",THEME==="dark","THEME='dark';render()"]]);
}
addEventListener("resize",fit);
location.hash.slice(1).split(",").forEach(h=>{if(h==="hi")LANG="hi";if(h==="phone")DEV="phone";if(h==="dark")THEME="dark";if(["list","pv1","pv2","reg","emp"].includes(h))jump(h)});
render();
</script></body></html>
