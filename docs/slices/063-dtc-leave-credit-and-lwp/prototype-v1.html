<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leave Credit Prototype</title>
<!--
  Slice 063 prototype v1, 21 Oct 2026. hrms-ux-designer.
  ALL names and numbers here are invented (Sample). No tenant data.
  Tokens copied from alvoraa_portal/templates/includes/design_system.html (light + dark).
  Phone rules live under the .phone wrapper here; in the product they are the
  portal's existing @media rules. This file is not product code.
-->
<style>
:root,[data-theme="light"]{--bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;--primary:#5B4B8A;--primary-h:#4A3D73;--primary-d:#3D3461;--primary-lt:#EDEAF4;--green:#1B7F5A;--green-lt:#E8F4EF;--red:#B3261E;--red-lt:#FBEAE8;--amber:#9A6510;--amber-lt:#FBF1E0;--sh1:0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.10);--sh3:0 12px 32px rgba(0,0,0,.16)}
[data-theme="dark"]{--bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;--primary:#A99AD4;--primary-h:#BBAEE0;--primary-d:#7A6BA8;--primary-lt:#2A2438;--green:#5DBF97;--green-lt:#12332A;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;--sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60)}
:root{--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:10px;--r-sm:6px;--r-full:999px;--fs-sm:12px;--fs-base:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:32px}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:var(--fs-base);line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ── review scaffolding (wraps, never sticky) ── */
.review{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.review label{display:flex;gap:6px;align-items:center;font-weight:600;color:var(--text2)}
.review select,.review button{min-height:32px;padding:4px 8px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-sm)}
.review .hint{flex-basis:100%;color:var(--text3)}
.sample{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;padding:1px 6px;border-radius:var(--r-full);background:var(--amber-lt);color:var(--amber);border:1px solid currentColor;vertical-align:middle}

/* ── stage ── */
.stage{margin:16px auto;background:var(--bg);border:1px solid var(--border);box-shadow:var(--sh2);position:relative;overflow:hidden}
.stage.desk{width:1440px;max-width:calc(100vw - 24px);min-height:900px}
.stage.phone{width:390px;min-height:844px;border-radius:18px}
.app{display:flex;min-height:inherit}
.side{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px}
.side .brand{font-weight:800;color:var(--primary);font-size:var(--fs-md);padding:6px 10px 14px}
.side a{display:flex;align-items:center;gap:10px;min-height:36px;padding:6px 10px;border-radius:var(--r-sm);color:var(--text2);text-decoration:none;font-size:var(--fs-base)}
.side a.on{background:var(--primary-lt);color:var(--primary);font-weight:700}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;height:56px;padding:0 20px;background:var(--surface);border-bottom:1px solid var(--border)}
.top .ttl{font-weight:700;font-size:var(--fs-md)}
.top .who{margin-left:auto;color:var(--text3);font-size:var(--fs-sm)}
.content{padding:20px 24px 90px;max-width:1080px}
.page-header{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:var(--fs-xl);font-weight:800}
.page-sub{color:var(--text3);font-size:var(--fs-base)}
.btn{min-height:36px;padding:8px 14px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-weight:600}
.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme="dark"] .btn-primary{color:#1A1815}
.btn-green{background:var(--green);border-color:var(--green);color:#fff}
[data-theme="dark"] .btn-green{color:#1A1815}
.btn-link{border:0;background:none;color:var(--primary);text-decoration:underline;padding:0;min-height:24px;cursor:pointer;font-weight:600}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh1);margin-bottom:20px}
.card-header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--border)}
.card-title{font-weight:700;font-size:var(--fs-md)}
.card-body{padding:14px 16px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:600;background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip.proj{margin-left:auto}
.cls{color:var(--text2);margin:0 0 12px}
.figs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.fig{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;background:var(--surface)}
.fig .l{font-size:var(--fs-sm);color:var(--text2);font-weight:600}
.fig .v{font-size:var(--fs-2xl);font-weight:800;line-height:1.1;margin:4px 0 2px}
.fig .v small{font-size:var(--fs-base);font-weight:600;color:var(--text2)}
.fig .n{font-size:var(--fs-sm);color:var(--text3)}
.fig.wait{border-style:dashed}
.fig.out{background:var(--green-lt);border-color:var(--green)}
.fig.out .v{color:var(--green)}
.line{display:flex;gap:8px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-sm);margin:8px 0;font-size:var(--fs-base)}
.line .ic{flex-shrink:0;font-weight:800;width:18px;text-align:center}
.line.info{background:var(--primary-lt);color:var(--text)}
.line.warn{background:var(--amber-lt);color:var(--text)}
.line.warn .ic{color:var(--amber)}
.line.bad{background:var(--red-lt);color:var(--text)}
.line.bad .ic{color:var(--red)}
.line.ok{background:var(--green-lt);color:var(--text)}
.line.ok .ic{color:var(--green)}
.rule{border-top:1px solid var(--border);margin-top:12px;padding-top:12px;color:var(--text2)}
.rule b{color:var(--text)}
.muted{color:var(--text3)}
.skel{background:linear-gradient(90deg,var(--surface2),var(--border),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r-sm);height:16px;margin:8px 0}
@keyframes sk{to{background-position:-200% 0}}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--border);font-size:var(--fs-base)}
th{font-size:var(--fs-sm);color:var(--text2);font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:700;border:1px solid currentColor}
.b-green{color:var(--green);background:var(--green-lt)}
.b-amber{color:var(--amber);background:var(--amber-lt)}
.b-gray{color:var(--text2);background:var(--surface2)}
.b-red{color:var(--red);background:var(--red-lt)}
.bottom{display:none}

/* ── modal ── */
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:20}
.modal{background:var(--surface);border-radius:var(--r);width:500px;max-width:calc(100% - 24px);max-height:calc(100% - 40px);display:flex;flex-direction:column;box-shadow:var(--sh3)}
.m-hdr{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
.m-title{font-weight:800;font-size:var(--fs-lg)}
.m-close{margin-left:auto;min-width:40px;min-height:40px;border:0;background:none;font-size:22px;cursor:pointer;color:var(--text2)}
.m-body{padding:14px 16px;overflow:auto}
.m-foot{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)}
.field{margin-bottom:12px}
.field>label,.lbl{display:block;font-weight:700;font-size:var(--fs-base);margin-bottom:4px}
.input{width:100%;min-height:38px;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);font-size:var(--fs-base)}
.help{font-size:var(--fs-sm);color:var(--text3);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;gap:10px;align-items:center;min-height:36px;cursor:pointer;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--primary)}
.result h3{margin:4px 0 8px;font-size:var(--fs-lg)}
.result p{margin:6px 0}

/* ── manager pieces ── */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px}
.stat .v{font-size:var(--fs-xl);font-weight:800}
.stat .l{font-size:var(--fs-sm);color:var(--text2)}
.appr{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;padding:12px 16px}
.appr .who{font-weight:700}
.appr .acts{margin-left:auto;display:flex;gap:8px}
.mail{border:1px dashed var(--border2);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.mail .meta{font-size:var(--fs-sm);color:var(--text3);margin-bottom:6px}
.sec{font-weight:800;font-size:var(--fs-sm);letter-spacing:.04em;text-transform:uppercase;color:var(--text2);margin:20px 0 8px}

/* ── phone: the portal's own @media rules, copied under .phone ── */
.phone .side{display:none}
.phone .top{padding:0 14px}
.phone .content{padding:14px 14px 96px}
.phone .page-title{font-size:22px}
.phone .figs{grid-template-columns:1fr 1fr}
.phone .stats{grid-template-columns:1fr 1fr}
.phone .btn,.phone .input,.phone select.input{min-height:44px;font-size:16px}
.phone .btn-link{min-height:44px;display:inline-flex;align-items:center}
.phone .line,.phone .fig .n,.phone .help,.phone .rule{font-size:14px}
.phone .fig .l{font-size:13px}
.phone .card-title{font-size:16px}
.phone .backdrop{align-items:flex-end}
.phone .modal{width:100%;max-width:100%;border-radius:16px 16px 0 0;max-height:92%}
.phone .m-foot .btn{flex:1}
.phone .m-close{min-width:44px;min-height:44px}
.phone .row2{grid-template-columns:1fr 1fr}
.phone .check{min-height:44px;font-size:16px}
.phone .apps-table{display:none}
.phone .apps-list{display:block}
.apps-list{display:none}
.apps-list .it{padding:12px 16px;border-bottom:1px solid var(--border)}
.apps-list .it .t{font-weight:700}
.phone .appr .acts{margin-left:0;width:100%}
.phone .appr .acts .btn{flex:1}
.phone .bottom{display:flex;position:absolute;left:0;right:0;bottom:0;height:68px;background:var(--surface);border-top:1px solid var(--border)}
.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--text2);text-decoration:none;min-height:44px}
.bottom a.on{color:var(--primary);font-weight:800}
.bottom .dot{width:22px;height:4px;border-radius:2px;background:currentColor;opacity:.25}
.bottom a.on .dot{opacity:1}
.phone .mgr-table{display:none}
</style>
</head>
<body>

<div class="review" role="region" aria-label="Review controls (not part of the product)">
  <label>Person
    <select id="rv-person">
      <option value="priya">Priya - class A, 20 days attended, 1 request waiting</option>
      <option value="rohit">Rohit - class A, 10 days attended (under 15)</option>
      <option value="manoj">Manoj - Contract, earns no Paid Leaves</option>
      <option value="ritika">Ritika - HR Manager, applies for others</option>
      <option value="sunil">Sunil - store manager, is told about leave</option>
    </select></label>
  <label>Device
    <select id="rv-device"><option value="phone">Phone 390</option><option value="desk">Desktop 1440</option></select></label>
  <label>Language
    <select id="rv-lang"><option value="en">English</option><option value="hi">हिन्दी (machine draft)</option></select></label>
  <label>Theme
    <select id="rv-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Card state
    <select id="rv-state"><option value="ok">Loaded</option><option value="loading">Loading</option><option value="error">Could not load</option></select></label>
  <label><input type="checkbox" id="rv-fail"> Next send fails (no signal)</label>
  <span>Try in Apply Leave:
    <button type="button" data-try="half">Half day, Mon 26 Oct</button>
    <button type="button" data-try="special">Sun 25 Oct (special day)</button>
    <button type="button" data-try="past">Past day, Mon 12 Oct</button>
    <button type="button" data-try="sept">A September day</button>
  </span>
  <span class="hint">Prototype for review. Today is shown as Fri 23 Oct 2026; attendance is in up to Thu 22 Oct. <span class="sample">Sample</span> Every name and number is invented. Hindi is a machine draft for native review.</span>
</div>

<div id="stage" class="stage phone"><div class="app" id="app"></div></div>

<script>
"use strict";
/* ───────────── sample data (all invented) ───────────── */
var TODAY = "2026-10-23", DATA_UPTO = "22 Oct", MONTH = "October", MONTH_END = "31 Oct";
var SPECIAL = {"2026-10-25": {en: "Festive sale", hi: "त्योहार सेल"}};
var CLASSES = {
  A: {cap: 4, per: "7.5", gain: 1},
  B: {cap: 3, per: "10", gain: 1},
  C: {cap: 2, per: "7.5", gain: 0.5}
};
var PEOPLE = {
  priya: {name: "Priya Sharma", first: "Priya", role: "Sales Associate", cls: "A", attended: 20, earned: 2, used: 1, usedOn: "6 Oct",
          notCounted: "14 Oct", approver: "Sunil Mehra", approverFirst: "Sunil",
          apps: [{t: "Paid Leaves", f: "2026-10-27", to: "2026-10-27", d: 1, s: "open"},
                 {t: "Paid Leaves", f: "2026-10-06", to: "2026-10-06", d: 1, s: "approved"}]},
  rohit: {name: "Rohit Verma", first: "Rohit", role: "Stock Assistant", cls: "A", attended: 10, earned: 0, used: 0,
          approver: "Sunil Mehra", approverFirst: "Sunil",
          apps: [{t: "Leave Without Pay", f: "2026-10-12", to: "2026-10-16", d: 5, s: "recorded"}]},
  manoj: {name: "Manoj Singh", first: "Manoj", role: "Security Guard", cls: null, zeroWhy: "contract", attended: 19,
          approver: "Sunil Mehra", approverFirst: "Sunil", apps: []},
  ritika: {name: "Ritika", first: "Ritika", role: "HR Manager", cls: "B", attended: 20, earned: 2, used: 0, hr: true,
           approver: "Kavita Arora", approverFirst: "Kavita", apps: []}
};
/* A half day uses no Paid Leaves (the engine measures it by punches), so it never sets a day aside. */
function waiting(p) { return p.apps.filter(function (a) { return a.t === "Paid Leaves" && a.s === "open" && !a.h; })
                        .reduce(function (s, a) { return s + a.d; }, 0); }
function avail(p) { return Math.max(0, (p.earned || 0) - (p.used || 0) - waiting(p)); }

/* ───────────── review state ───────────── */
var R = {person: "priya", device: "phone", lang: "en", theme: "light", state: "ok", fail: false};
function T(en, hi) { return R.lang === "hi" && hi ? hi : en; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]; }); }
function plural(n, en1, enN, hi) { return R.lang === "hi" ? n + " " + hi : n + " " + (n === 1 ? en1 : enN); }
function dayWord(n) { return plural(n, "day", "days", "दिन"); }
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function d(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function fmt(s) { var x = d(s); return DOW[x.getDay()] + " " + x.getDate() + " " + MON[x.getMonth()]; }
function fmtRange(a, b) { return a === b ? fmt(a) : fmt(a) + " to " + fmt(b); }
function between(a, b) { var out = [], x = d(a), e = d(b); while (x <= e) { out.push(x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0")); x.setDate(x.getDate() + 1); } return out; }

/* ───────────── chrome ───────────── */
function chrome(title, body, active) {
  var me = R.person === "sunil" ? "Sunil Mehra" : PEOPLE[R.person].name;
  var navs = R.person === "sunil" || R.person === "ritika"
    ? [["Home", "Home"], ["Leave", "Leave"], ["Attendance", "Time"], ["Team View", "Team"], ["Pay", "Pay"]]
    : [["Home", "Home"], ["Leave", "Leave"], ["Attendance", "Time"], ["Pay", "Pay"], ["More", "More"]];
  return '<nav class="side" aria-label="Main"><div class="brand">Alvoraa</div>' +
    navs.map(function (n) { return '<a href="#" class="' + (n[0] === active ? "on" : "") + '"' + (n[0] === active ? ' aria-current="page"' : "") + '>' + n[0] + '</a>'; }).join("") +
    '</nav><div class="main"><header class="top"><span class="ttl">' + esc(title) + '</span><span class="who">' + esc(me) + ' <span class="sample">Sample</span></span></header>' +
    '<main class="content" id="content">' + body + '</main>' +
    '<nav class="bottom" aria-label="Main">' + navs.map(function (n) { return '<a href="#" class="' + (n[0] === active ? "on" : "") + '"><span class="dot"></span>' + n[1] + '</a>'; }).join("") + '</nav></div>';
}

/* ───────────── the Paid Leaves card ───────────── */
function ruleText(p) {
  var c = CLASSES[p.cls];
  return '<div class="rule"><b>' + T("How you earn Paid Leaves - class ", "Paid Leaves कैसे मिलती हैं - क्लास ") + p.cls + '</b><br>' +
    T("Once you have attended 15 days in a month, you earn " + (c.gain === 1 ? "1 day" : "half a day") + " of Paid Leaves for every " + c.per + " days you attend, up to " + c.cap + " days a month. Leave days do not count as attended. Nothing carries over: days you do not use are paid out with that month's salary.",
      "महीने में 15 दिन हाज़िरी पूरी होने के बाद, हर " + c.per + " दिन की हाज़िरी पर " + (c.gain === 1 ? "1 दिन" : "आधा दिन") + " की Paid Leaves मिलती है, महीने में ज़्यादा से ज़्यादा " + c.cap + " दिन। छुट्टी के दिन हाज़िरी में नहीं गिने जाते। कुछ भी अगले महीने नहीं जाता: जो दिन इस्तेमाल नहीं हुए, उनका पैसा उसी महीने की सैलरी में मिलता है।") +
    '</div>';
}
function card(p) {
  var head = '<div class="card-header"><span class="card-title" id="pl-title">' + T("Paid Leaves - " + MONTH, "Paid Leaves - अक्टूबर") + '</span>';
  if (R.state === "loading") {
    return '<section class="card" aria-labelledby="pl-title" aria-busy="true">' + head + '</div><div class="card-body"><div class="skel" style="width:40%"></div><div class="skel" style="height:64px"></div><div class="skel" style="width:80%"></div><span class="muted">' + T("Working out your days so far...", "आपके अब तक के दिन गिने जा रहे हैं...") + '</span></div></section>';
  }
  if (R.state === "error") {
    return '<section class="card" aria-labelledby="pl-title">' + head + '</div><div class="card-body"><div class="line warn" role="alert"><span class="ic" aria-hidden="true">!</span><span>' +
      T("Your Paid Leaves figures could not be worked out just now. Your leave requests below are not affected, and you can still apply.", "आपकी Paid Leaves की गिनती अभी नहीं हो सकी। नीचे आपकी छुट्टी की अर्ज़ियों पर कोई असर नहीं है, और आप अब भी अर्ज़ी दे सकते हैं।") +
      '</span></div><button class="btn" type="button" onclick="R.state=\'ok\';render()">' + T("Try again", "फिर से कोशिश करें") + '</button></div></section>';
  }
  if (!p.cls) {
    return '<section class="card" aria-labelledby="pl-title">' + head + '</div><div class="card-body"><p style="margin:0 0 8px;font-size:15px">' +
      T("Contract staff do not earn monthly Paid Leaves.", "कॉन्ट्रैक्ट स्टाफ़ को हर महीने Paid Leaves नहीं मिलती।") + '</p><p class="muted" style="margin:0">' +

function typesFor(s) { return s.cls ? ["Paid Leaves", "Leave Without Pay"] : ["Leave Without Pay"]; }
function verdict() {

  if (F.from < "2026-10-01") return {k: "bad", block: true, html: T("September's salary has already been worked out, so leave for a September day cannot be added here. Choose a day from 1 October. If September needs changing, ask HR.",
                                                                   "सितंबर की सैलरी बन चुकी है, इसलिए सितंबर के किसी दिन की छुट्टी यहाँ नहीं जोड़ी जा सकती। 1 अक्टूबर या उसके बाद का दिन चुनें। सितंबर में बदलाव के लिए HR से बात करें।")};

      T("No leave can be taken on special days at DTC, including leave without pay. ", "DTC में ख़ास दिनों पर कोई छुट्टी नहीं ली जा सकती, Leave Without Pay भी नहीं। ") +
      (many ? T("Change your dates to leave it out, or apply for the days before and after it separately. ", "तारीखें बदलकर इस दिन को हटा दें, या इसके पहले और बाद के दिनों के लिए अलग-अलग अर्ज़ी दें। ") : "") +

  }

      "<br>" + (F.type === "Paid Leaves" ? T(s.approver + " needs to approve it.", s.approver + " की मंज़ूरी चाहिए।") : T("No approval is needed. " + s.approver + " will be told.", "मंज़ूरी नहीं चाहिए। " + s.approver + " को बता दिया जाएगा।")) +

    return {k: "ok", block: false, html: lines.join("<br>")};
  }
  lines.unshift('<b>' + T("Recording " + dayWord(n) + " of Leave Without Pay.", dayWord(n) + " की Leave Without Pay दर्ज होगी।") + '</b> ' +

      body += '<div class="line ' + v.k + '" role="status" aria-live="polite"><span class="ic" aria-hidden="true">' + (v.k === "ok" ? "✓" : v.k === "info" ? "i" : "!") + '</span><span>' + v.html +
        (v.switchable ? '<br><button type="button" class="btn-link" id="f-switch">' + T("Use Leave Without Pay instead", "इसकी जगह Leave Without Pay लें") + '</button>' : "") +
        (v.special ? '<br><button type="button" class="btn-link" id="f-redate">' + T("Change the dates", "तारीखें बदलें") + '</button>' : "") + '</span></div>';
    }
    body += '<div class="field"><label for="f-reason">' + T("Reason (optional)", "कारण (ज़रूरी नहीं)") + '</label><textarea class="input" id="f-reason" rows="2">' + esc(F.reason) + '</textarea><div class="help">' +
      T("Only " + s.approver + " and HR can read this.", "इसे सिर्फ़ " + s.approver + " और HR पढ़ सकते हैं।") + '</div></div>';
    var label = !F.type ? T("Choose a leave type", "छुट्टी का प्रकार चुनें")
      : F.type === "Paid Leaves" ? T("Send to " + s.approver, s.approver + " को भेजें")
      : F.behalf ? T("Record for " + s.name, s.name + " के लिए दर्ज करें") : T("Record leave without pay", "Leave Without Pay दर्ज करें");
    foot = '<button class="btn" type="button" id="m-cancel">' + T("Cancel", "रद्द करें") + '</button>' +
      ((v && v.block) ? "" : '<button class="btn btn-primary" type="button" id="m-send">' + label + '</button>');
  }
  var bd = document.createElement("div");
  bd.className = "backdrop"; bd.id = "bd";
  bd.innerHTML = '<div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title"><div class="m-hdr"><span class="m-title" id="m-title" tabindex="-1">' +
    (F.done ? T("Done", "हो गया") : T("Apply for leave", "छुट्टी की अर्ज़ी")) + '</span><button class="m-close" type="button" id="m-x" aria-label="' + T("Close", "बंद करें") + '">&times;</button></div>' +
    '<div class="m-body">' + body + '</div><div class="m-foot">' + foot + '</div></div>';
  host.appendChild(bd);
  wireModal();
}
function wireModal() {
  function on(id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); }
  function close() { F = null; drawModal(); render(); }
  on("m-x", "click", close); on("m-cancel", "click", close); on("m-done", "click", close);
  on("f-behalf", "change", function (e) { F.behalf = e.target.value; F.type = ""; drawModal(); });
  on("f-type", "change", function (e) { F.type = e.target.value; drawModal(); focus("f-type"); });
  on("f-from", "change", function (e) { F.from = e.target.value; if (!F.to || F.to < F.from) F.to = F.from; drawModal(); focus("f-from"); });
  on("f-to", "change", function (e) { F.to = e.target.value; drawModal(); focus("f-to"); });
  on("f-half", "change", function (e) { F.half = e.target.checked; if (F.half) F.to = F.from; drawModal(); focus("f-half"); });
  on("f-reason", "input", function (e) { F.reason = e.target.value; });
  on("f-switch", "click", function () { F.type = "Leave Without Pay"; drawModal(); focus("f-type"); });
  on("f-redate", "click", function () { focus("f-from"); });
  on("m-send", "click", send);
  document.getElementById("bd").addEventListener("keydown", function (e) { if (e.key === "Escape") close(); });
  var t = document.getElementById("m-title"); if (t && !document.activeElement.closest(".modal")) t.focus();
}
function focus(id) { var el = document.getElementById(id); if (el) el.focus(); }
function send() {
  var s = subjectOf();
  if (!F.type) { F.err = T("Choose a leave type first.", "पहले छुट्टी का प्रकार चुनें।"); drawModal(); focus("f-type"); return; }
  if (!F.from) { F.err = T("Choose the date the leave starts.", "छुट्टी शुरू होने की तारीख चुनें।"); drawModal(); focus("f-from"); return; }
  var btn = document.getElementById("m-send"); btn.disabled = true; btn.textContent = T("Sending...", "भेजा जा रहा है...");
  setTimeout(function () {
    if (R.fail) {
      R.fail = false; document.getElementById("rv-fail").checked = false;
      F.err = T("Not sent: the connection dropped. Nothing was recorded. Your choices are still here - try again.", "नहीं भेजा गया: कनेक्शन टूट गया। कुछ दर्ज नहीं हुआ। आपकी भरी जानकारी यहीं है - फिर से कोशिश करें।");
      drawModal(); return;
    }
    var to = F.half ? F.from : F.to, n = F.half ? 0.5 : between(F.from, to).length, you = !F.behalf;
    var lwp = F.type === "Leave Without Pay";
    s.apps.unshift({t: F.type, f: F.from, to: to, d: n, h: F.half, s: lwp ? "recorded" : "open"});
    if (lwp) {
      F.done = '<h3>' + T("Leave without pay recorded" + (you ? "" : " for " + s.name), "Leave Without Pay दर्ज हो गई") + '</h3>' +
        '<p><b>' + fmtRange(F.from, to) + ' · ' + dayWord(n) + (F.half ? T(" (half day)", " (आधा दिन)") : "") + '</b></p>' +
        '<p>' + T(s.approver + " has been told. No approval is needed.", s.approver + " को बता दिया गया है। मंज़ूरी की ज़रूरत नहीं है।") + '</p>' +
        '<p>' + (F.half ? T("It counts as a short working day: check in and out as usual. The hours missed are cut from pay.", "यह कम घंटों वाला काम का दिन गिना जाएगा: हमेशा की तरह चेक-इन और चेक-आउट करें। छूटे घंटों का पैसा कटेगा।")
                        : T((you ? "You are" : s.first + " is") + " not paid for " + (n === 1 ? "this day" : "these days") + ". " + MONTH + "'s salary is reduced for " + (n === 1 ? "it" : "them") + ".", "इन दिनों का पैसा नहीं मिलेगा। अक्टूबर की सैलरी में इतने दिन का पैसा कम होगा।")) + '</p>';
    } else {
      F.done = '<h3>' + T("Sent to " + s.approver, s.approver + " को भेजा गया") + '</h3>' +
        '<p><b>Paid Leaves · ' + fmtRange(F.from, to) + ' · ' + dayWord(n) + '</b></p>' +
        '<p>' + T(F.half ? "A half day uses no Paid Leaves; it counts as a short working day." : dayWord(n) + " is set aside from what " + (you ? "you have" : s.first + " has") + " earned until " + s.approverFirst + " decides. If it is declined, the day comes back.",
                  F.half ? "आधे दिन में कोई Paid Leaves नहीं लगती।" : s.approverFirst + " के फ़ैसले तक " + dayWord(n) + " अलग रखा गया है। नामंज़ूर होने पर वह दिन वापस मिल जाएगा।") + '</p>';
    }
    F.err = ""; drawModal();
  }, 700);
}

/* ───────────── render ───────────── */
function render() {
  document.documentElement.setAttribute("data-theme", R.theme);
  document.documentElement.setAttribute("lang", R.lang);
  var st = document.getElementById("stage");
  st.className = "stage " + R.device;
  document.getElementById("app").innerHTML = R.person === "sunil" ? managerPage() : leavePage(PEOPLE[R.person]);
  var b = document.getElementById("open-apply");
  if (b) b.addEventListener("click", function () { openApply(); });
  if (F) drawModal();
}
["person", "device", "lang", "theme", "state"].forEach(function (k) {
  document.getElementById("rv-" + k).addEventListener("change", function (e) { R[k] = e.target.value; if (k === "person") F = null; render(); });
});
document.getElementById("rv-fail").addEventListener("change", function (e) { R.fail = e.target.checked; });
document.querySelectorAll("[data-try]").forEach(function (b) {
  b.addEventListener("click", function () {
    if (R.person === "sunil") { R.person = "rohit"; document.getElementById("rv-person").value = "rohit"; render(); }
    var k = b.getAttribute("data-try"), lwp = "Leave Without Pay";
    var pre = k === "half" ? {type: lwp, from: "2026-10-26", to: "2026-10-26", half: true}
      : k === "special" ? {type: lwp, from: "2026-10-24", to: "2026-10-26"}
      : k === "past" ? {type: lwp, from: "2026-10-12", to: "2026-10-12"}
      : {type: lwp, from: "2026-09-28", to: "2026-09-28"};
    openApply(pre);
  });
});
render();
</script>
</body>
</html>
