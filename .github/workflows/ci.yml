name: CI

# Quality gate. Runs on every PR into dev / test / main, and on every push to
# those branches. Never deploys.
#
# Branch model (ARCHITECTURE.md §13):
#   feature/*  --PR-->  dev  --PR-->  test  --PR-->  main (production)

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 3.14 matches frappe/bench:latest, the base image production is built from
      # (verified: the running container reports Python 3.14.2). Frappe declares
      # requires-python ">=3.10,<3.15", but its source uses PEP 695 `type X = ...`,
      # which needs 3.12 - so the declaration is optimistic and 3.11 fails at build.
      # Matching production also means CI finally tests the interpreter the servers use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install ruff==0.6.9

      # hrms/pyproject.toml carries the ruff config this codebase is formatted against.
      #
      # NON-BLOCKING, deliberately. The hrms fork carries 66 pre-existing violations that
      # predate any current work - `hrms/` is byte-identical to before the Alvoraa rename
      # series began, so nothing here was introduced by it. Blocking every deploy on
      # import ordering and en-dashes in comments is the wrong trade.
      #
      # Breakdown: 31 I001 (import order), 20 RUF002/RUF003 (ambiguous dash characters in
      # comments), the rest UP031 / E701 / F841 / RUF005 / F541. 39 are auto-fixable.
      #
      # To clear it, fix with the PINNED version - ruff 0.6.9, as installed above. A newer
      # ruff reports a different set (0.15.4 finds 83), so fixing with whatever is on a
      # laptop can leave CI still red.
      #
      # Flip both steps back to blocking once the backlog is cleared.
      - name: ruff check (hrms)
        continue-on-error: true
        run: ruff check hrms/hrms --config hrms/pyproject.toml

      - name: ruff format --check (hrms)
        continue-on-error: true
        run: ruff format --check hrms/hrms --config hrms/pyproject.toml

      # The alvoraa apps predate this config. Non-blocking until the backlog of
      # existing violations is cleared, then flip to blocking.
      - name: ruff check (alvoraa apps)
        continue-on-error: true
        run: ruff check alvoraa_goals alvoraa_portal --config hrms/pyproject.toml

      # Frappe resolves front-end `frappe.call({method: "app.module.func"})` paths at
      # runtime. Nothing else in the build catches a path pointing at a function that
      # does not exist - it fails when a user clicks a button. This makes that a
      # build-time check.
      #
      # Frappe resolves front-end `frappe.call({method: "app.module.func"})` paths at
      # runtime, so a path pointing at a function that does not exist fails only when a
      # user clicks. This makes it a build-time check.
      #
      # Since the Phase 4 rename the repo directories and the installed app names finally
      # agree (alvoraa_goals / alvoraa_portal), so no --alias is needed. --max 2 is the
      # known debt: two pre-existing upstream hrms paths. Never raise it.
      - name: Front-end API paths resolve
        run: python scripts/check_api_paths.py --max 2

      # Structural checks that need no bench or database: doctype name/folder/file agree,
      # controller class matches the doctype name (a mismatch makes bench migrate DELETE
      # the doctype), hooks.py handlers resolve, patches.txt entries expose execute().
      - name: App integrity
        run: python scripts/check_app_integrity.py

      - name: Semgrep (Frappe security rules)
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config hrms/semgrep --error --skip-unknown-extensions \
            alvoraa_goals alvoraa_portal hrms/hrms

  # ── Python / Frappe tests ─────────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    # 90, not 60: a COLD build clones frappe and erpnext and runs yarn install for both,
    # which alone reaches 30-50 minutes on a standard runner. The cache key includes
    # FRAPPE_BRANCH, so any version bump forces exactly that cold path. Warm runs are
    # minutes. The per-step timeout bounds the slow part on its own.
    timeout-minutes: 90

    services:
      mariadb:
        image: mariadb:10.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]

    env:
      FRAPPE_BRANCH: version-16
      ERPNEXT_BRANCH: version-16

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # hrms/frappe-ui

      # 3.14 matches frappe/bench:latest, the base image production is built from
      # (verified: the running container reports Python 3.14.2). Frappe declares
      # requires-python ">=3.10,<3.15", but its source uses PEP 695 `type X = ...`,
      # which needs 3.12 - so the declaration is optimistic and 3.11 fails at build.
      # Matching production also means CI finally tests the interpreter the servers use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 24 matches frappe/bench:latest, which ships Node v24.13.0. Frappe version-16
      # declares engines.node ">=24", so 20 aborts `yarn install` during bench init.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # A cold `bench init` is 15-25 min. Cache it, keyed on what can change it.
      - name: Cache bench
        id: bench-cache
        uses: actions/cache@v4
        with:
          path: ~/frappe-bench
          key: bench-${{ runner.os }}-${{ env.FRAPPE_BRANCH }}-${{ hashFiles('hrms/pyproject.toml', 'alvoraa_goals/requirements.txt', 'alvoraa_portal/requirements.txt') }}

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcups2-dev redis-tools mariadb-client libmariadb-dev
          pip install frappe-bench

      - name: MariaDB settings required by Frappe
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server='utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server='utf8mb4_unicode_ci'"

      # stdin from /dev/null: on failure `bench init` asks
      #   "Do you want to rollback these changes? [y/N]:"
      # With a live stdin that waits forever and burns the whole job timeout for no
      # information. With /dev/null it hits EOF and fails immediately, showing the real
      # error. No CI step should be able to sit on a prompt.
      - name: Init bench
        if: steps.bench-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          cd ~
          bench init --skip-redis-config-generation --skip-assets \n                     --frappe-branch "$FRAPPE_BRANCH" --python "$(which python)" frappe-bench < /dev/null
          cd frappe-bench
          bench get-app --branch "$ERPNEXT_BRANCH" erpnext < /dev/null

      # All three first-party apps come from THIS repo — including the hrms fork,
      # so the PMS module is exercised in CI exactly as it ships to production.
      - name: Install this repo's apps
        run: |
          cd ~/frappe-bench
          rm -rf apps/hrms apps/alvoraa_goals apps/alvoraa_portal
          cp -r "$GITHUB_WORKSPACE/hrms"                apps/hrms
          cp -r "$GITHUB_WORKSPACE/alvoraa_goals"         apps/alvoraa_goals
          cp -r "$GITHUB_WORKSPACE/alvoraa_portal" apps/alvoraa_portal
          ./env/bin/pip install -q -e apps/hrms -e apps/alvoraa_goals -e apps/alvoraa_portal
          printf 'frappe\nerpnext\nhrms\nalvoraa_goals\nalvoraa_portal\n' > sites/apps.txt

      - name: Create test site
        run: |
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache    redis://127.0.0.1:13000
          bench set-config -g redis_queue    redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench set-config -g mute_emails 1        # never let CI reach a mail server
          sed -i '/redis/d;/watch/d;/schedule/d;/socketio/d' Procfile
          bench new-site test_site --force --db-root-password root \
                --admin-password admin --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app alvoraa_portal
          bench --site test_site install-app alvoraa_goals
          bench --site test_site set-config allow_tests true

      # This step is also the smoke test for the PMS module: `install-app hrms`
      # creates its 37 doctypes. If they are malformed, this fails here rather
      # than during a production deploy.
      - name: Verify all modules installed
        run: |
          cd ~/frappe-bench
          bench --site test_site execute frappe.client.get_count \
                --kwargs '{"doctype":"DocType","filters":{"module":"Performance Management"}}'

      # Tenant isolation is enforced entirely by these tests. Blocking.
      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app alvoraa_goals
          bench --site test_site run-tests --app alvoraa_portal

      - name: Bench logs on failure
        if: failure()
        run: tail -n 200 ~/frappe-bench/logs/*.log || true

  # ── Frontend build ────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # build fails without frappe-ui

      # 24 matches frappe/bench:latest, which ships Node v24.13.0. Frappe version-16
      # declares engines.node ">=24", so 20 aborts `yarn install` during bench init.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build employee PWA
        working-directory: hrms/frontend
        run: |
          yarn install --frozen-lockfile --check-files
          yarn build

      - name: Build roster SPA
        working-directory: hrms/roster
        run: |
          yarn install --frozen-lockfile --check-files
          yarn build
