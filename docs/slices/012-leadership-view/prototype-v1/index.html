<title>Alvoraa · Leadership view · prototype v1 (slice 012)</title>
<style>
/* Tokens copied from alvoraa_portal/templates/includes/design_system.html (light and dark).
   Extra names proposed in slice 009 appendix A: --sunk, --border-strong, --on-primary, --scrim. */
:root{
  --bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;
  --primary:#5B4B8A;--primary-h:#4A3D73;--primary-d:#3D3461;--primary-lt:#EDEAF4;--on-primary:#FFFFFF;
  --green:#1B7F5A;--green-lt:#E8F4EF;--red:#B3261E;--red-lt:#FBEAE8;--amber:#9A6510;--amber-lt:#FBF1E0;
  --hero-bg:#3D3461;--hero-fg:#FFFFFF;--hero-accent:#BBAEE0;
  --sunk:var(--surface2);--border-strong:var(--border2);--scrim:rgba(29,24,21,.42);
  --sh1:0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.10);--sh3:0 12px 32px rgba(0,0,0,.16);
  --font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,"Noto Sans Devanagari","Nirmala UI",sans-serif;
  --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px;--r-sm:6px;--r-full:999px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:24px;--fs-2xl:32px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;
    --primary:#A99AD4;--primary-h:#BBAEE0;--primary-d:#7A6BA8;--primary-lt:#2A2438;--on-primary:#1A1815;
    --green:#5DBF97;--green-lt:#12332A;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;
    --hero-bg:#2A2438;--hero-fg:#F0EDE8;--hero-accent:#BBAEE0;--scrim:rgba(0,0,0,.55);
    --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;
  --primary:#A99AD4;--primary-h:#BBAEE0;--primary-d:#7A6BA8;--primary-lt:#2A2438;--on-primary:#1A1815;
  --green:#5DBF97;--green-lt:#12332A;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;
  --hero-bg:#2A2438;--hero-fg:#F0EDE8;--hero-accent:#BBAEE0;--scrim:rgba(0,0,0,.55);
  --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-base);line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:var(--r-sm)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
svg.i.sm{width:15px;height:15px}
svg.i.lg{width:28px;height:28px}
p{margin:0}
ul{margin:0;padding-left:20px}
li+li{margin-top:6px}

/* ── Prototype controls (not part of the product) ─────────── */
.pbar{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--text);color:var(--bg);font-size:var(--fs-sm)}
.pbar .tag{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;opacity:.8}
.pbar label{display:flex;align-items:center;gap:6px;min-width:0}
.pbar select{min-height:36px;max-width:100%;padding:4px 8px;border-radius:var(--r-sm);border:0;background:var(--bg);color:var(--text);font-size:14px}
.pbar .pgrow{flex:1 1 260px;min-width:0}
.pbar .pgrow select{flex:1;min-width:0}
.pbar .note{flex-basis:100%;opacity:.85}

/* ── Stage ─────────────────────────────────────────────────── */
.stage{padding:0}
.stage.phone{display:flex;justify-content:center;padding:24px 16px 40px}
.stage.phone .app{width:390px;max-width:100%;height:820px;border:8px solid var(--text);border-radius:36px;overflow:hidden;box-shadow:var(--sh3)}
.stage.phone .shell{height:100%}
.stage.phone .main{height:100%;overflow-y:auto}
.stage.phone .scrim,.stage.phone .sheet,.stage.phone .toast,.stage.phone .rail{position:absolute}

/* ── App frame (slice 009) ─────────────────────────────────── */
.app{background:var(--bg);position:relative}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;align-self:start;height:100vh;display:flex;flex-direction:column;gap:14px;padding:16px 12px;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;z-index:85}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px}
.brand .mark{width:32px;height:32px;border-radius:8px;background:var(--hero-bg);color:var(--hero-fg);display:grid;place-items:center;font-weight:700;font-size:var(--fs-sm)}
.brand .nm{font-weight:600;font-size:var(--fs-md);line-height:1.2}
.brand .sub{font-size:var(--fs-sm);color:var(--text3)}
.nav{display:grid;gap:12px}
.nav h6{margin:0 0 2px;padding:0 10px;font-size:var(--fs-sm);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.nav button{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:7px 10px;border:0;border-radius:var(--r-sm);background:none;color:var(--text2);text-align:left;font-size:var(--fs-md)}
.nav button:hover{background:var(--sunk);color:var(--text)}
.nav button[aria-current="page"]{background:var(--primary-lt);color:var(--primary);font-weight:600}
.nav .count{margin-left:auto;min-width:22px;padding:0 6px;border-radius:var(--r-full);background:var(--primary-lt);color:var(--primary);font-size:var(--fs-sm);font-weight:700;text-align:center}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px 8px 2px;border-top:1px solid var(--border)}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:var(--fs-sm);font-weight:700;flex:none;background:var(--primary-lt);color:var(--primary)}
.me .nm{font-weight:600;line-height:1.2}
.me .sub{font-size:var(--fs-sm);color:var(--text3);line-height:1.3}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:var(--bg);border-bottom:1px solid var(--border)}
.top .tt{min-width:0}
.crumb{font-size:var(--fs-sm);color:var(--text3);display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--primary);font-size:var(--fs-sm)}
.top h1{margin:0;font-size:var(--fs-xl);line-height:1.2;font-weight:650;overflow-wrap:anywhere}
.top .acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.iconbtn{position:relative;width:44px;height:44px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text2)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:var(--r-full);background:var(--primary);color:var(--on-primary);font-size:var(--fs-xs);font-weight:700;line-height:18px;text-align:center}
.menubtn{display:none}
.content{padding:22px 28px 56px;max-width:1180px;width:100%;display:grid;gap:18px;flex:1;align-content:start}

/* ── Building blocks ───────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh1);min-width:0}
.card>.hd{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.card>.hd h2{margin:0;font-size:var(--fs-md);font-weight:650;display:flex;align-items:center;gap:8px}
.card>.hd h2 svg{color:var(--primary)}
.card>.bd{padding:16px 18px;display:grid;gap:12px}
.card>.ft{padding:10px 18px;border-top:1px solid var(--border);font-size:var(--fs-sm);color:var(--text3);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.linkbtn{border:0;background:none;padding:0;color:var(--primary);font-size:var(--fs-sm);font-weight:600;display:inline-flex;align-items:center;gap:4px;text-align:left;min-height:32px}
.hd .linkbtn{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-weight:600;font-size:var(--fs-md)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary)}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:600;line-height:1.5}
.c-warn{background:var(--amber-lt);color:var(--amber)}
.c-info{background:var(--primary-lt);color:var(--primary)}
.c-neutral{background:var(--sunk);color:var(--text2)}
.c-good{background:var(--green-lt);color:var(--green)}
.sample{font-family:var(--mono);font-size:var(--fs-xs);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid var(--border-strong);color:var(--text2);white-space:nowrap}
.muted{color:var(--text2)}
.faint{color:var(--text3)}
.small{font-size:var(--fs-sm)}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.pagehead{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--text2)}
.pagehead .fresh{display:inline-flex;align-items:center;gap:6px}
.proto-note{font-size:var(--fs-sm);color:var(--text3);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}

/* Hero (WOW card) */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:var(--r);padding:20px 22px;display:grid;gap:8px;box-shadow:var(--sh2)}
.hero .eyebrow{font-size:var(--fs-sm);opacity:.85;font-weight:600}
.hero .big{font-size:36px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.hero .line{font-size:var(--fs-md);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.hero .line .cmp{color:var(--hero-accent);font-weight:600}
.hero .foot{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;margin-top:6px}
.hero .foot .fresh{font-size:var(--fs-sm);opacity:.85}
.hero .go{min-height:44px;padding:0 18px;border-radius:var(--r-full);border:0;background:var(--hero-fg);color:var(--hero-bg);font-weight:700;font-size:var(--fs-md)}
.hero .hwarn{display:flex;gap:8px;padding:10px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.12);font-size:var(--fs-md)}

/* Metric cards */
.metric .big{font-size:var(--fs-2xl);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.metric .bigl{color:var(--text2);font-size:var(--fs-md)}
.metric .chg{display:flex;align-items:center;gap:6px;color:var(--text2);font-size:var(--fs-md)}
.metric .cmp{font-size:var(--fs-md);color:var(--text)}
.metric .cmp b{font-weight:650}
.kv{display:grid;border-top:1px solid var(--border)}
.kv>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--border)}
.kv>div:last-child{border-bottom:0}
.kv .k{color:var(--text2);font-size:var(--fs-md)}
.kv .v{font-weight:650;font-size:var(--fs-md);text-align:right}
.kv .s{grid-column:1/-1;font-size:var(--fs-sm);color:var(--text3)}
.bar{height:8px;border-radius:var(--r-full);background:var(--sunk);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--primary);border-radius:inherit}
.hid{display:inline-flex;align-items:center;gap:5px;color:var(--text2);font-weight:600}
.hidblock{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;padding:12px 14px;border:1px dashed var(--border-strong);border-radius:var(--r);background:var(--sunk)}
.hidblock svg{color:var(--text2)}
.hidblock b{font-size:var(--fs-md)}
.hidblock .linkbtn{grid-column:2;justify-self:start}
.notrec{font-size:var(--fs-xl);font-weight:650;color:var(--text2)}
.warn-banner{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:14px 16px;border-radius:var(--r);background:var(--amber-lt);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-left:4px solid var(--amber)}
.warn-banner>svg{color:var(--amber);margin-top:2px}
.warn-banner h2{margin:0;font-size:var(--fs-md)}
.warn-banner p{font-size:var(--fs-md)}
.warn-banner .acts{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 16px}
.errblock{display:grid;gap:10px;padding:6px 0}
.errblock b{font-size:var(--fs-md)}

/* Today strip */
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--border);border-radius:var(--r);overflow:hidden;border:1px solid var(--border)}
.today>div{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.today .v{font-size:var(--fs-xl);font-weight:700;line-height:1.1}
.today .k{font-size:var(--fs-sm);color:var(--text2)}

/* Trend */
.trend{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:8px}
.trend .col{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:4px}
.trend .val{font-size:var(--fs-sm);font-weight:650}
.trend .slot{display:flex;align-items:flex-end;justify-content:center}
.trend .b{width:70%;max-width:44px;border-radius:4px 4px 0 0;background:var(--primary)}
.trend .b.doubt{background:repeating-linear-gradient(45deg,var(--amber),var(--amber) 4px,var(--amber-lt) 4px,var(--amber-lt) 8px);border:1px solid var(--amber)}
.trend .m{font-size:var(--fs-sm);color:var(--text2)}
.days7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:90px}
.days7 .col{display:grid;grid-template-rows:auto 1fr auto;height:100%;text-align:center;gap:2px}
.days7 .b{width:70%;margin:0 auto;border-radius:3px 3px 0 0;background:var(--border-strong)}
.days7 .b.peak{background:var(--primary)}
.days7 .slot{display:flex;align-items:flex-end}
.days7 .slot .b{align-self:flex-end}

/* Tables and group lists */
.tblwrap{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse}
.tbl th,.tbl td{text-align:left;padding:10px 14px;border-top:1px solid var(--border);font-size:var(--fs-base);vertical-align:middle}
.tbl th{font-size:var(--fs-sm);font-weight:600;color:var(--text2);border-top:0;background:var(--sunk);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.total td{font-weight:700;background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.tbl .rowbtn{border:0;background:none;padding:0;color:var(--primary);font-weight:600;text-align:left;display:inline-flex;align-items:center;gap:4px;min-height:32px}
.glist{display:grid}
.grow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:center;width:100%;padding:12px 16px;border:0;border-top:1px solid var(--border);background:none;text-align:left;min-height:64px}
.grow:first-child{border-top:0}
button.grow:hover{background:var(--sunk)}
.grow .t{font-weight:650;font-size:var(--fs-md);line-height:1.3;display:flex;align-items:center;gap:4px}
.grow .s{font-size:var(--fs-sm);color:var(--text2)}
.grow .r{text-align:right}
.grow .r .v{font-weight:700;font-size:var(--fs-lg);line-height:1.1}
.grow .r .l{font-size:var(--fs-sm);color:var(--text2)}
.grow.total{background:color-mix(in srgb,var(--sunk) 55%,transparent)}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rules>div{border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px;align-content:start}
.rules h3{margin:0;font-size:var(--fs-md)}

/* Empty / explanatory state */
.explainer{display:grid;justify-items:start;gap:14px;padding:28px;max-width:640px}
.explainer .ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--primary-lt);color:var(--primary)}
.explainer h2{margin:0;font-size:var(--fs-xl);line-height:1.25}
.explainer p{font-size:var(--fs-md);color:var(--text2)}
.quote{border-left:3px solid var(--primary);padding:10px 14px;background:var(--sunk);border-radius:0 var(--r-sm) var(--r-sm) 0;font-size:var(--fs-md);width:100%}

/* Settings */
.stepper{display:flex;align-items:center;gap:0;border:1px solid var(--border-strong);border-radius:var(--r);overflow:hidden;width:max-content;background:var(--surface)}
.stepper button{width:48px;height:48px;border:0;background:var(--sunk);display:grid;place-items:center;color:var(--text)}
.stepper output{min-width:120px;text-align:center;font-size:var(--fs-lg);font-weight:700}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:var(--fs-md)}
.field .hint{font-size:var(--fs-sm);color:var(--text2)}
.field .err{font-size:var(--fs-sm);color:var(--red);font-weight:600}
textarea.inp{width:100%;min-height:84px;padding:10px 12px;border:1px solid var(--border-strong);border-radius:var(--r-sm);background:var(--surface);font-size:16px;resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.lockline{display:flex;gap:8px;align-items:center;color:var(--text2);font-size:var(--fs-md)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tabs button{flex:none;border:0;background:none;padding:10px 12px;min-height:44px;color:var(--text2);font-weight:600;font-size:var(--fs-md);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}

/* Employee line */
.whosees{display:grid;gap:10px}
.whosees summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:var(--fs-md);min-height:44px;color:var(--primary);list-style:none}
.whosees summary::-webkit-details-marker{display:none}
.whosees ul{font-size:var(--fs-md);color:var(--text)}

/* Skeleton */
.sk{background:linear-gradient(90deg,var(--sunk),color-mix(in srgb,var(--sunk) 40%,var(--surface)),var(--sunk));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:6px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

/* Sheet, dialog, toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:90;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:var(--sh3);display:flex;flex-direction:column;transform:translateX(102%);transition:transform .22s ease;visibility:hidden}
.sheet.on{transform:none;visibility:visible}
.sheet .hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.sheet .hd h2{margin:0;font-size:var(--fs-lg);flex:1}
.sheet .bd{padding:18px;overflow-y:auto;display:grid;gap:14px;align-content:start;flex:1;font-size:var(--fs-md)}
.sheet .ft{padding:12px 18px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

/* The small-group rule, as the server would apply it before sending anything.
   1. Hide every group smaller than the minimum.
   2. If any group is hidden, keep hiding the next-smallest group until at least two are hidden
      and the hidden groups together reach the minimum. Headcount and joiners are never hidden. */
function suppress(groups, min){
  var list = groups.slice().sort(function(a,b){ return a.hc-b.hc; });
  var hid = list.filter(function(g){ return g.hc < min; });
  var rest = list.filter(function(g){ return g.hc >= min; });
  var out = {};
  if (!hid.length) return out;
  function total(){ return hid.reduce(function(s,g){ return s+g.hc; },0); }
  while ((hid.length < 2 || total() < min) && rest.length){ hid.push(rest.shift()); }
  hid.forEach(function(g){ out[g.id] = true; });
  return out;
}

/* Work out hiding for a scope, given the current minimum */
function resolve(sc){
  var r = {selfHidden:false, compareHidden:false, groupHidden:{}};
  if (sc.kind==="branch"){
    var parentHidden = suppress(sc.siblings, S.min)[sc.d.id];
    if (sc.viewer==="company") r.selfHidden = !!parentHidden;       /* hidden in the company table stays hidden when opened */
    else r.selfHidden = sc.d.hc < S.min;                          /* a branch head sees their own branch unless it is itself small */
    if (sc.viewer==="branch") r.compareHidden = (sc.co.hc - sc.d.hc) < S.min && sc.co.hc !== sc.d.hc;
    if (sc.d.depts) r.groupHidden = r.selfHidden ? all(sc.d.depts) : suppress(sc.d.depts, S.min);
  } else {

/* ═══════════ Frame ═══════════ */
function scopeLabel(p){
  var lead = PEOPLE[p].lead;
  if (lead==="company") return "Company overview";
  if (lead==="branch"||lead==="multi") return "Branch overview";
  if (lead==="none") return "Leader overview";
  return null;
}
function overviewKey(p){
  return {bh:"bh-overview", ch:"ch-overview", tiny:"tiny", two:"two", noperm:"noperm", multi:"multi"}[p];
}
function homeKey(p){ return {bh:"bh-home", ch:"ch-home"}[p]; }

function renderRail(st){
  var p = st.person, who = PEOPLE[p], lead = scopeLabel(p);
  var cur = st.page;
  function item(icon, label, go, current, count){
    return '<button '+(go?'data-go="'+go+'"':'data-toast="Not part of this prototype"')+(current?' aria-current="page"':'')+'>'+ic(icon)+'<span>'+esc(T(label))+'</span>'+(count?'<span class="count">'+count+'</span>':'')+'</button>';
  }
  var h = '<div class="brand"><div class="mark">'+(p==="two"?"MF":"KR")+'</div><div><div class="nm">'+(p==="two"?"Meadow Foods":"Kavya Retail")+'</div><div class="sub">Sample tenant</div></div></div><nav class="nav">';
  h += '<div><h6>'+T("Me")+'</h6>'+item("home","Home",homeKey(p),cur==="home")+item("inbox","Inbox",null,false,p==="sm"?0:2)+'</div>';
  h += '<div><h6>'+T("Time")+'</h6>'+item("clock","Attendance & leave",p==="emp"?"emp":null,cur==="emp")+'</div>';
  h += '<div><h6>'+T("Pay")+'</h6>'+item("wallet","My pay")+'</div>';
  if (p!=="sm") h += '<div><h6>'+T("Growth")+'</h6>'+item("target","Goals & reviews")+'</div>';
  if (p==="bh"||p==="ch"||p==="tiny"||p==="two") h += '<div><h6>'+T("Team")+'</h6>'+item("users","My team")+'</div>';
  h += '<div><h6>'+T("Company")+'</h6>';
  if (lead) h += item("chart", lead, overviewKey(p), cur==="overview"||cur==="noperm"||cur==="multi"||cur==="loading");
  if (p==="hr") h += item("chart","HR analytics");
  h += item("building","Policies");
  if (p==="sm"||p==="hr") h += item("shield","Org settings",p,cur==="settings");
  h += '</div></nav>';
  h += '<div class="me"><div class="av">'+who.ini+'</div><div><div class="nm">'+esc(who.name)+'</div><div class="sub">'+esc(who.role)+'</div></div></div>';
  $("#rail").innerHTML = h;
  $("#rail").classList.toggle("open", S.railOpen);
}

function renderTop(st, title, crumbs, withScope){
  var h = '<button class="iconbtn menubtn" data-act="menu" aria-label="Open menu">'+ic("menu")+'</button><div class="tt">';
  if (crumbs && crumbs.length){
    h += '<div class="crumb">'+crumbs.map(function(c){ return c.go ? '<button data-go="'+c.go+'">'+esc(T(c.label))+'</button> ›' : esc(T(c.label))+' ›'; }).join(" ")+'</div>';
  }
  h += '<h1 id="pageTitle">'+esc(title)+'</h1></div><div class="acts">';
  if (withScope) h += '<button class="btn scopebtn" data-explain="scope">'+ic("eye")+'<span>'+esc(T("What you can see"))+'</span></button>';
  h += '<button class="iconbtn bell" aria-label="Inbox, 2 new" data-toast="Not part of this prototype">'+ic("bell")+'<span class="dot">2</span></button></div>';
  $("#top").innerHTML = h;
}

function renderBnav(st){
  var p = st.person, lead = scopeLabel(p);
  var third = lead ? {icon:"chart", label: PEOPLE[p].lead==="company" ? "Company" : "Branch", go: overviewKey(p), on: ["overview","noperm","multi","loading"].indexOf(st.page)>-1}
                   : (p==="sm"||p==="hr") ? {icon:"shield", label:"Company", go:p, on:st.page==="settings"}
                   : {icon:"wallet", label:"Pay", go:null, on:false};
  var items = [
    {icon:"home", label:"Home", go:homeKey(p), on:st.page==="home"},
    {icon:"clock", label:"Time", go:p==="emp"?"emp":null, on:st.page==="emp"},
    third,
    {icon:"inbox", label:"Inbox", go:null, on:false},
    {icon:"more", label:"More", go:null, on:false, act:"menu"}
  ];
  $("#bnav").innerHTML = items.map(function(i){
    var attr = i.act ? 'data-act="menu"' : (i.go ? 'data-go="'+i.go+'"' : 'data-toast="Not part of this prototype"');
    return '<button '+attr+(i.on?' aria-current="page"':'')+'>'+ic(i.icon)+'<span>'+esc(T(i.label))+'</span></button>';
  }).join("");
}

/* ═══════════ Pieces ═══════════ */
function freshLine(extra){
  return '<div class="pagehead small"><span class="fresh">'+ic("cal","sm")+esc(T("Data up to"))+' '+UPTO+'</span><span>Figures as of '+ASOF+'</span><button class="linkbtn" data-explain="fresh">'+T("Why?")+'</button><button class="linkbtn scopelink" data-explain="scope">'+ic("eye","sm")+T("What you can see")+'</button><span class="sample">Sample data</span>'+(extra||"")+'</div>';
}
function hiddenBlock(what){
  return '<div class="hidblock">'+ic("lock")+'<b>'+esc(T("Hidden to protect a small group"))+'</b><span class="small muted" style="grid-column:2">'+esc(what)+'</span><button class="linkbtn" data-explain="hidden">Why is this hidden?</button></div>';
}
function hidInline(){ return '<span class="hid">'+ic("lock","sm")+T("Hidden")+'</span>'; }
function change(diff, unit, span){
  var d = Math.round(diff*10)/10;
  if (unit==="points"){
    if (d>0) return ic("up","sm")+'Up '+Math.abs(d).toFixed(1)+' points on '+span;
    if (d<0) return ic("down","sm")+'Down '+Math.abs(d).toFixed(1)+' points on '+span;
    return ic("same","sm")+'Same as '+span;
  }
  if (d<0) return Math.abs(d)+' fewer than '+span;
  if (d>0) return Math.abs(d)+' more than '+span;
  return 'Same as '+span;
}

function cardAttendance(sc, r){
  var d = sc.d, body;
  if (sc.error && !S.retried){
    body = '<div class="errblock" role="alert"><b>'+ic("alert")+' Attendance figures did not load</b><p class="muted">Your people and leave figures are up to date. This is usually a short network problem.</p><div><button class="btn" data-act="retry">'+ic("refresh")+T("Try again")+'</button></div></div>';
  } else if (r.selfHidden){
    body = hiddenBlock("Attendance, late arrivals and short days");
  } else {
    var v = (sc.broken && S.showRaw) ? d.attRaw : d.att;
    body = '<div><div class="big num">'+pct(v)+'</div><div class="bigl">'+T("present, September so far")+'</div></div>';
    if (sc.broken){
      body += S.showRaw
        ? '<div><span class="chip c-warn">'+ic("alert","sm")+'Includes 3 doubtful days, likely wrong</span></div><div><button class="linkbtn" data-act="raw">Leave the 3 doubtful days out again</button></div>'
        : '<div><span class="chip c-warn">'+ic("alert","sm")+'3 doubtful days left out</span></div><div><button class="linkbtn" data-act="raw">Show the figure with those days ('+pct(d.attRaw)+')</button></div>';
    }
    if (!(sc.broken && S.showRaw)) body += '<div class="chg">'+change(d.att-d.attPrev,"points",PREV)+'</div>';
    if (sc.kind==="branch"){
      body += r.compareHidden
        ? '<div class="cmp small muted">'+ic("lock","sm")+' Company comparison hidden: it would reveal a small group. <button class="linkbtn" data-explain="hidden">Why?</button></div>'
        : '<div class="cmp">Company <b>'+pct(sc.co.att)+'</b></div>';
    }
    body += '<div class="kv">'+
      '<div><span class="k">'+T("Late arrivals")+'</span><span class="v num">'+num(d.late)+'</span><span class="s">'+change(d.late-d.lateP,"count",PREV)+'</span></div>'+
      '<div><span class="k">'+T("Short days")+'</span><span class="v num">'+num(d.short)+'</span><span class="s">'+change(d.short-d.shortP,"count",PREV)+'</span></div></div>';
  }
  return '<section class="card metric" aria-labelledby="h-att"><div class="hd"><h2 id="h-att">'+ic("clock")+T("Attendance")+'</h2><button class="linkbtn" data-explain="att">'+T("How is this worked out?")+'</button></div><div class="bd">'+body+'</div><div class="ft">'+T("Data up to")+' '+UPTO_S+'</div></section>';
}

function cardLeave(sc, r){
  var d = sc.d, body;
  if (r.selfHidden){
    body = hiddenBlock("On leave today, leave used and requests waiting");
  } else if (sc.broken){
    body = '<div><div class="notrec">'+T("Not recorded")+'</div><div class="bigl muted">Leave used this leave year</div></div>'+
      '<p class="muted">Only 3 leave requests have been entered this leave year, for '+num(d.hc)+' people with '+num(d.alloc)+' days of leave between them. Leave is probably kept outside Alvoraa, so a percentage would mislead.</p>'+
      '<div class="kv"><div><span class="k">'+T("On leave today")+'</span><span class="v">None recorded</span></div>'+
      '<div><span class="k">'+T("Requests waiting more than 3 days")+'</span><span class="v">None</span></div></div>'+
      '<button class="linkbtn" data-explain="notrec">What "not recorded" means</button>';
  } else {
    var u = share(d.used, d.alloc);
    body = '<div><div class="big num">'+num(d.onLeave)+'</div><div class="bigl">'+T("on leave today")+'</div></div>'+
      '<div class="kv">'+
      '<div><span class="k">'+T("Leave used this leave year")+'</span><span class="v num">'+u+'%</span><span class="s">'+num(d.used)+' of '+num(d.alloc)+' days · 1 Apr 2026 to 31 Mar 2027</span><span class="s" style="grid-column:1/-1"><span class="bar" aria-hidden="true"><i style="width:'+u+'%"></i></span></span>'+
        (sc.kind==="branch" && !r.compareHidden ? '<span class="s">Company '+share(sc.co.used, sc.co.alloc)+'%</span>' : '')+'</div>'+
      '<div><span class="k">'+T("Requests waiting more than 3 days")+'</span><span class="v num">'+num(d.wait)+'</span><span class="s">Managers and HR see who. You see the count only.</span></div></div>';
  }
  return '<section class="card metric" aria-labelledby="h-leave"><div class="hd"><h2 id="h-leave">'+ic("leaf")+T("Leave")+'</h2><button class="linkbtn" data-explain="leave">'+T("How is this worked out?")+'</button></div><div class="bd">'+body+'</div><div class="ft">Leave reasons and types are never shown</div></section>';
}

function cardPeople(sc, r){
  var d = sc.d;
  var body = '<div><div class="big num">'+num(d.hc)+'</div><div class="bigl">'+T("people today")+'</div></div>'+
    '<div class="chg">'+(d.hc-d.hcPrev>=0?ic("up","sm")+'Up '+(d.hc-d.hcPrev):ic("down","sm")+'Down '+Math.abs(d.hc-d.hcPrev))+' from '+num(d.hcPrev)+' a year ago</div>'+
    '<div class="kv"><div><span class="k">'+T("Joined, last 12 months")+'</span><span class="v num">'+num(d.join)+'</span></div>';
  if (r.selfHidden){
    body += '<div><span class="k">'+T("Left, last 12 months")+'</span><span class="v">'+hidInline()+'</span><span class="s"><button class="linkbtn" data-explain="hidden">Why is this hidden?</button></span></div>';
  } else if (sc.broken){
    body += '<div><span class="k">'+T("Left, last 12 months")+'</span><span class="v">None recorded</span><span class="s">Attrition appears once leavers are marked as left in Alvoraa.</span></div>';
  } else if (d.leavers===0){
    body += '<div><span class="k">'+T("Left, last 12 months")+'</span><span class="v num">0</span><span class="s">Nobody left this branch in the last 12 months.</span></div>';
  } else {
    var at = d.leavers / ((d.hc+d.hcPrev)/2) * 100;
    body += '<div><span class="k">'+T("Left, last 12 months")+'</span><span class="v num">'+num(d.leavers)+'</span></div>'+
      '<div><span class="k">Attrition, last 12 months</span><span class="v num">'+pct(at)+'</span>'+
      (sc.kind==="branch" ? '<span class="s">Approximate for a branch. '+(r.compareHidden?'':'Company '+pct(sc.co.leavers/((sc.co.hc+sc.co.hcPrev)/2)*100)+'.')+'</span>' : '')+'</div>';
  }
  body += '</div>';
  return '<section class="card metric" aria-labelledby="h-ppl"><div class="hd"><h2 id="h-ppl">'+ic("users")+T("People")+'</h2><button class="linkbtn" data-explain="people">'+T("How is this worked out?")+'</button></div><div class="bd">'+body+'</div><div class="ft">Headcount and joiners are always shown</div></section>';
}

function todayStrip(d, name, broken){
  return '<section class="card" aria-labelledby="h-today"><div class="hd"><h2 id="h-today">'+ic("cal")+T("Today")+', Monday 15 Sep · '+esc(name)+'</h2><button class="linkbtn" data-explain="today">'+T("Why?")+'</button></div>'+
    '<div class="bd"><div class="today">'+
    '<div><span class="v num">'+num(d.inNow)+'</span><span class="k">'+T("in so far")+', of '+num(d.expected)+' expected</span></div>'+
    (broken ? '<div><span class="v" style="font-size:var(--fs-md)">'+T("Not recorded")+'</span><span class="k">'+T("on leave")+'</span></div>'
            : '<div><span class="v num">'+num(d.onLeave)+'</span><span class="k">'+T("on leave")+'</span></div>')+
    '<div><span class="v num">'+num(d.expected-d.inNow)+'</span><span class="k">'+T("not checked in yet")+'</span></div>'+
    '</div><p class="small faint">Counts as of '+ASOF+'. No names.</p></div></section>';
}

function trendCard(list, broken){
  var cols = list.map(function(m, i){
    var last = i===list.length-1;
    var h = Math.max(6, (m[1]-90)/10*100);
    var doubt = broken && last;
    return '<div class="col"><span class="val num">'+pct(m[1])+'</span><div class="slot"><div class="b'+(doubt?' doubt':'')+'" style="height:'+h+'%"></div></div><span class="m">'+m[0]+(last?' (so far)':'')+'</span></div>';
  }).join("");
  return '<section class="card" aria-labelledby="h-trend"><div class="hd"><h2 id="h-trend">'+ic("chart")+T("Attendance, last 6 months")+'</h2></div><div class="bd"><div class="trend" role="img" aria-label="Attendance by month: '+list.map(function(m){return m[0]+" "+pct(m[1]);}).join(", ")+'">'+cols+'</div>'+
    '<p class="small faint">Bars start at 90% so small changes are visible. '+(broken?'September is striped: 3 doubtful days are left out.':'')+'</p></div></section>';
}

function weekCard(d){
  var mx = Math.max.apply(null, d.days), names = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var cols = d.days.map(function(v,i){ return '<div class="col"><span class="small num">'+v+'</span><div class="slot"><div class="b'+(v===mx?' peak':'')+'" style="height:'+Math.max(6,v/mx*100)+'%"></div></div><span class="small muted">'+names[i]+'</span></div>'; }).join("");
  return '<section class="card" aria-labelledby="h-week"><div class="hd"><h2 id="h-week">'+ic("clock")+'Last 7 days, and the pattern</h2></div><div class="bd">'+
    '<div class="kv">'+
    '<div><span class="k">'+T("Late arrivals")+'</span><span class="v num">'+d.week.late[0]+'</span><span class="s">'+d.week.late[1]+' in the 7 days before</span></div>'+
    '<div><span class="k">'+T("Short days")+'</span><span class="v num">'+d.week.short[0]+'</span><span class="s">'+d.week.short[1]+' in the 7 days before</span></div>'+
    '<div><span class="k">Days absent</span><span class="v num">'+d.week.absent[0]+'</span><span class="s">'+d.week.absent[1]+' in the 7 days before</span></div></div>'+
    '<p><b>Late arrivals fall on Saturday far more than on other days.</b> <span class="muted">That usually points at the rota, not the people.</span></p>'+
    '<div class="days7" role="img" aria-label="Late arrivals in September by weekday: '+d.days.map(function(v,i){return names[i]+" "+v;}).join(", ")+'">'+cols+'</div></div></section>';
}

function groupSection(sc, r, phone){
  var company = sc.kind==="company";
  var groups = (company ? sc.groups : sc.d.depts).slice().sort(byName);
  var parent = sc.d;
  var nh = countHidden(r.groupHidden);
  var title = company ? T("By branch") : T("By department");
  var word = company ? "branches" : "departments";
  var body;
  function val(g, key){
    if (r.groupHidden[g.id]) return hidInline();
    if (sc.broken && (key==="used"||key==="onLeave")) return '<span class="faint">'+T("Not recorded")+'</span>';
    if (sc.broken && key==="leavers") return '<span class="faint">None recorded</span>';
    if (key==="att") return pct(g.att);
    if (key==="used") return share(g.used,g.alloc)+"%";
    return num(g[key]);
  }
  if (phone){
    body = '<div class="glist">'+groups.map(function(g){
      var hid = r.groupHidden[g.id];
      var inner = '<div><div class="t">'+esc(g.name)+(company?ic("right","sm"):'')+'</div><div class="s">'+num(g.hc)+' people · '+num(g.join)+' joined in 12 months</div>'+
        (hid ? '' : '<div class="s">Late '+val(g,"late")+' · On leave today '+val(g,"onLeave")+' · Leave used '+val(g,"used")+'</div>')+'</div>'+
        '<div class="r">'+(hid ? hidInline() : '<div class="v num">'+val(g,"att")+'</div><div class="l">attendance</div>')+'</div>';
      return company ? '<button class="grow" data-go="drill:'+g.id+'" aria-label="Open '+esc(g.name)+'">'+inner+'</button>' : '<div class="grow">'+inner+'</div>';
    }).join("")+
    '<div class="grow total"><div><div class="t">'+esc(company ? parent.name+", all branches" : parent.name+", whole branch")+'</div><div class="s">'+num(parent.hc)+' people</div></div><div class="r">'+(r.selfHidden?hidInline():'<div class="v num">'+pct(parent.att)+'</div><div class="l">attendance</div>')+'</div></div></div>';
  } else {
    body = '<div class="tblwrap"><table class="tbl"><caption class="sr">'+title+'</caption><thead><tr><th scope="col">'+(company?"Branch":"Department")+'</th><th class="n" scope="col">People</th><th class="n" scope="col">Joined (12 mo)</th><th class="n" scope="col">Attendance</th><th class="n" scope="col">Late arrivals</th><th class="n" scope="col">On leave today</th><th class="n" scope="col">Leave used</th><th class="n" scope="col">Left (12 mo)</th></tr></thead><tbody>'+
      groups.map(function(g){
        return '<tr><th scope="row" style="font-weight:600;background:none;border-top:1px solid var(--border);font-size:var(--fs-base)">'+(company?'<button class="rowbtn" data-go="drill:'+g.id+'">'+esc(g.name)+ic("right","sm")+'</button>':esc(g.name))+'</th>'+
          '<td class="n">'+num(g.hc)+'</td><td class="n">'+num(g.join)+'</td><td class="n">'+val(g,"att")+'</td><td class="n">'+val(g,"late")+'</td><td class="n">'+val(g,"onLeave")+'</td><td class="n">'+val(g,"used")+'</td><td class="n">'+val(g,"leavers")+'</td></tr>';
      }).join("")+
      '<tr class="total"><td>'+esc(company ? parent.name+", all branches" : parent.name+", whole branch")+'</td><td class="n">'+num(parent.hc)+'</td><td class="n">'+num(parent.join)+'</td>'+
      (r.selfHidden ? '<td class="n" colspan="5">'+hidInline()+'</td>' :
        '<td class="n">'+pct(parent.att)+'</td><td class="n">'+num(parent.late)+'</td><td class="n">'+(sc.broken?'<span class="faint">'+T("Not recorded")+'</span>':num(parent.onLeave))+'</td><td class="n">'+(sc.broken?'<span class="faint">'+T("Not recorded")+'</span>':share(parent.used,parent.alloc)+"%")+'</td><td class="n">'+(sc.broken?'<span class="faint">None recorded</span>':num(parent.leavers))+'</td>')+'</tr>'+
      '</tbody></table></div>';
  }
  var foot = 'Sorted by name. Totals only, no names.'+(nh ? ' <b>'+nh+' of '+groups.length+' '+word+' have hidden figures.</b> <button class="linkbtn" data-explain="hidden">Why?</button>' : '');
  if (company && groups.length===2 && nh===2) foot += ' <span>With two branches, showing one would reveal the other.</span>';
  return '<section class="card" aria-labelledby="h-groups"><div class="hd"><h2 id="h-groups">'+ic(company?"building":"users")+title+'</h2>'+(company?'<span class="small faint" style="margin-left:auto">Tap a branch to open it</span>':'')+'</div>'+body+'<div class="ft">'+foot+'</div></section>';
}

function brokenBanner(){
  return '<section class="warn-banner" role="note" aria-labelledby="h-warn">'+ic("alert")+'<div style="display:grid;gap:6px"><h2 id="h-warn">'+T("Some attendance days look wrong")+'</h2>'+
    '<p>On 8, 9 and 10 Sep almost everyone is marked absent. This is usually missing check-in data, not real absence. These 3 days are left out of the attendance figures below until HR fixes or confirms them. HR sees the same warning.</p></div>'+
    '<div class="acts"><button class="linkbtn" data-explain="broken">How doubtful days are found</button><button class="linkbtn" data-act="raw">'+(S.showRaw?'Leave the 3 days out again':'Show attendance with those days')+'</button></div></section>';
}

/* ═══════════ Pages ═══════════ */
function pageHome(st){
  var sc = st.scope, d = sc.d, r = resolve(sc), phone = isPhone();
  var branch = sc.kind==="branch";
  renderTop(st, T("Home"), null, false);
  var h = '<div class="pagehead"><span style="font-size:var(--fs-lg);font-weight:650;color:var(--text)">Good morning, '+esc(PEOPLE[st.person].name.split(" ")[0])+'</span><span class="sample">Sample data</span></div>';
  h += '<section class="hero" aria-labelledby="h-hero"><div class="eyebrow">'+esc(branch ? d.name : d.name+", all branches")+' · September so far</div>';
  h += '<div class="big num" id="h-hero">'+T("Attendance")+' '+pct(d.att)+'</div>';
  h += '<div class="line">'+change(d.att-d.attPrev,"points",PREV)+(branch && !r.compareHidden ? ' · <span class="cmp">Company '+pct(sc.co.att)+'</span>' : '')+'</div>';
  h += '<div class="line">'+T("Late arrivals")+' '+num(d.late)+', '+change(d.late-d.lateP,"count",PREV)+'</div>';
  if (!branch) h += '<div class="line">'+num(d.hc)+' people · '+num(d.join)+' joined and '+num(d.leavers)+' left in 12 months</div>';
  h += '<div class="foot"><span class="fresh">'+T("Data up to")+' '+UPTO_S+' · as of '+ASOF+'</span><button class="go" data-go="'+overviewKey(st.person)+'">'+T(branch?"Open branch overview":"Open company overview")+'</button></div></section>';
  h += todayStrip(d, branch ? d.name : "all branches");
  h += '<section class="card"><div class="hd"><h2>'+ic("home")+'Your own day</h2></div><div class="bd"><p class="muted">Check in, your leave, your requests and anything waiting on you stay here, as in the new Home from slice 009. The leader card above sits on top of them and does not replace them.</p><p class="proto-note">Placeholder, not designed in this slice</p></div></section>';
  $("#content").innerHTML = h;
}

function pageOverview(st){
  var sc = st.scope, d = sc.d, r = resolve(sc), phone = isPhone();
  var title, crumbs = [{label:"Company"}], sub;

/* ═══════════ Explanations (sheets) ═══════════ */
function explain(key){
  var st = info(S.state), sc = st.scope;
  var t = "", b = "";
  switch(key){
    case "att": t="How attendance is worked out";
      b='<p><b>Present %</b> = days people were present, divided by days they were expected to work, for September so far.</p><ul><li>A half day counts as half a day present.</li><li>Work from home counts as present.</li><li>Weekly offs, holidays and approved leave are not expected days, so they do not lower the figure.</li><li>Days after '+UPTO_S+' are not counted yet.</li></ul>'+
        '<p><b>Late arrivals</b>: days someone checked in after their shift start plus the grace time HR has set. One person late on 3 days counts as 3.</p><p><b>Short days</b>: days someone worked fewer hours than their shift asks for.</p>'+
        '<p>Comparisons use the same days last month ('+PREV+'), so part of a month is never compared with a whole month.</p><p class="muted">HR Analytics uses exactly this calculation, so HR and leaders always see the same number.</p><p class="proto-note">Wording must match the Step 0 calculation once it is agreed</p>'; break;
    case "leave": t="How leave is worked out";
      b='<p><b>On leave today</b>: people on approved leave today. A count only. You never see who, or why.</p><p><b>Leave used</b> = leave days taken, divided by leave days given, for this leave year only (1 Apr 2026 to 31 Mar 2027). Leave from earlier years is not counted.</p><p><b>Requests waiting more than 3 days</b>: leave requests with no decision after 3 days. Managers and HR see the names and act on them. You see the count, so you can ask about delays.</p><p class="muted">Leave types and reasons are never shown to leaders, at any group size.</p>'; break;
    case "people": t="How people figures are worked out";
      b='<p><b>Headcount</b>: active people today. <b>Joined</b>: people whose joining date is in the last 12 months. Both are always shown, even for small groups, because they say nothing private about anyone.</p><p><b>Left</b>: people marked as left, with a leaving date in the last 12 months.</p><p><b>Attrition</b> = people who left in the last 12 months, divided by the average of headcount a year ago and today.</p><p class="muted">For a branch this is approximate. When someone moves branch, their history moves with them.</p>'; break;
    case "today": t="Today's counts";
      b='<p><b>In so far</b>: people with a check-in today.</p><p><b>Expected</b>: people on today\'s rota who are not on leave or a weekly off.</p><p><b>Not checked in yet</b>: expected minus in so far. It may still be early in their shift.</p><p class="muted">Counts only, as of '+ASOF+'. No names. Today\'s counts are not shown for groups smaller than '+S.min+' people.</p>'; break;
    case "fresh": t="Why the data runs to "+UPTO_S;
      b='<p><b>Data up to '+UPTO+'</b> is the last day with complete attendance. Attendance for a day is usually complete by the next morning.</p><p><b>Figures as of '+ASOF+'</b> is when these totals were last worked out. They refresh about every 15 minutes.</p>'; break;
    case "hidden": t="Why is this hidden?";
      b='<p>Leaders see totals, never individuals. When a group has <b>fewer than '+S.min+' people</b>, a total can point at one person. So it is hidden.</p><p>To stop anyone working a hidden figure out by subtraction, the <b>next-smallest group is hidden too</b>. That is why a larger group can also show as hidden.</p><p>Headcount and joiners are always shown. Company totals still include every group.</p><p class="muted">Hidden figures are never sent to your phone or computer, so they cannot be found in the page. The minimum is set by your organisation\'s System Manager.</p>'; break;
    case "broken": t="How doubtful days are found";
      b='<p>A working day is marked <b>doubtful</b> when 95% or more of the people expected at work are marked absent, and almost nobody checked in.</p><p>That nearly always means check-in data did not arrive, not that everyone stayed home.</p><p>Doubtful days are left out of attendance, late arrivals and short days until HR fixes the data or confirms the absence was real. If HR confirms it, the day is counted again.</p><p class="muted">HR sees the same warning in HR Analytics, with a link to fix it.</p><p class="proto-note">⚠ DECISION D5: the 95% threshold</p>'; break;
    case "notrec": t='What "not recorded" means';
      b='<p>"Not recorded" means Alvoraa does not have enough data to give a fair number. It is never shown as 0%.</p><p>Here, leave is given to people but almost no leave has been entered. Showing "leave used 0%" would suggest nobody took leave, which is very unlikely.</p><p class="muted">HR sees the same note and can start recording leave in Alvoraa.</p><p class="proto-note">⚠ DECISION D6: when leave counts as "not recorded"</p>'; break;
    case "scope":
      t = T("What you can see");
      var who = PEOPLE[st.person];
      var where = sc ? (sc.kind==="company" ? sc.d.name+", all branches, "+num(sc.d.hc)+" people" : (sc.viewer==="company" ? (sc.co.name+", all branches") : sc.d.name+", "+num(sc.d.hc)+" people")) : "Lakeside Mall, 64 people";
      b='<ul><li><b>Where:</b> '+esc(where)+'.</li><li><b>What:</b> totals for people, attendance and leave.</li><li><b>Never:</b> anyone\'s name, their days, why they were away, or pay.</li><li><b>Small groups:</b> figures are hidden below '+S.min+' people.</li><li><b>You are counted too:</b> your own attendance and leave are inside these totals.</li></ul>'+
        '<p class="muted">Your access comes from the Leadership role and a link to '+(who.lead==="company"?"your company":"your branch")+', set by your System Manager. Your employees see a line on their own attendance page that tells them this.</p>'; break;
  }
  openSheet(t, b, '<button class="btn primary" data-act="close">OK</button>', false);
}

/* ═══════════ Sheet, dialog, toast ═══════════ */
var lastFocus = null;
function openSheet(title, body, foot, dialog){
  lastFocus = document.activeElement;
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = body;
  $("#sheetFoot").innerHTML = foot || "";
  var sh = $("#sheet");
  sh.querySelector(".hd .iconbtn").innerHTML = ic("x");
  sh.classList.toggle("dialog", !!dialog);
  sh.setAttribute("role", dialog ? "alertdialog" : "dialog");
  sh.classList.add("on"); $("#scrim").classList.add("on");
  setTimeout(function(){ var f = sh.querySelector("#sheetFoot button") || sh.querySelector(".hd button"); if (f) f.focus(); }, 30);
}
function closeSheet(){
  $("#sheet").classList.remove("on"); $("#scrim").classList.remove("on");
  if (S.railOpen){ S.railOpen=false; $("#rail").classList.remove("open"); }
  if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus();
}
var toastTimer;
function toast(msg){
  var t = $("#toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ t.classList.remove("on"); }, 2600);
}

/* ═══════════ Render ═══════════ */
function $(s){ return document.querySelector(s); }
function isPhone(){ return $("#app").classList.contains("is-phone"); }

function render(){
  var st = info(S.state);
  if (!st.person){ S.state = "bh-home"; st = info(S.state); }
  $("#app").setAttribute("lang", S.lang);
  renderRail(st); renderBnav(st);
  switch(st.page){
    case "home": pageHome(st); break;
    case "overview": pageOverview(st); break;
    case "noperm": pageNoPerm(st); break;
    case "multi": pageMulti(st); break;
    case "loading": pageLoading(st); break;
    case "settings": pageSettings(st); break;
    case "emp": pageEmp(st); break;
  }
  var sel = $("#pState");
  sel.value = STATES.some(function(x){ return x[0]===S.state; }) ? S.state : sel.value;
}

function go(key){
  S.state = key; S.railOpen = false; S.errs = {};
  if (key!=="ch-broken") S.showRaw = false;
  if (key==="error") S.retried = false;
  if (key==="sm"||key==="hr"){ S.draft = S.min; S.reason = ""; }
  render();
  var m = $("#main"); if (m.scrollTop) m.scrollTop = 0;
  if (!$("#stage").classList.contains("phone")) window.scrollTo(0, 0);
  var t = $("#pageTitle"); if (t){ t.setAttribute("tabindex","-1"); t.focus({preventScroll:true}); }
}

/* ═══════════ Events ═══════════ */
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-go],[data-explain],[data-toast],[data-act]");
  if (!el) { return; }
  if (el.hasAttribute("data-go")) { closeSheet(); go(el.getAttribute("data-go")); return; }
  if (el.hasAttribute("data-explain")) { explain(el.getAttribute("data-explain")); return; }
  if (el.hasAttribute("data-toast")) { toast(el.getAttribute("data-toast")); return; }
  var a = el.getAttribute("data-act");
  if (a==="close") closeSheet();
  else if (a==="menu"){ S.railOpen = true; $("#rail").classList.add("open"); $("#scrim").classList.add("on"); var b=$("#rail button"); if(b) b.focus(); }
  else if (a==="raw"){ S.showRaw = !S.showRaw; render(); }
  else if (a==="retry"){ S.retried = true; render(); toast("Attendance figures loaded"); }
  else if (a==="copy"||a==="copy2"){ toast("Message copied"); }
  else if (a==="dec"){ if (S.draft>3){ S.draft--; S.errs={}; keepReason(); render(); focusSel('[data-act="dec"]'); } else toast("3 is the lowest allowed"); }
  else if (a==="inc"){ if (S.draft<10){ S.draft++; S.errs={}; keepReason(); render(); focusSel('[data-act="inc"]'); } else toast("10 is the highest allowed"); }
  else if (a==="undo"){ S.draft = S.min; S.errs={}; keepReason(); render(); }
  else if (a==="save"){
    keepReason(); S.errs = {};
    if (S.draft===S.min) S.errs.min = "Choose a different number first. The saved value is already "+S.min+".";
    if (!S.reason.trim()) S.errs.reason = "Add a short reason. It is kept with the change.";
    if (S.errs.min || S.errs.reason){ render(); var f = S.errs.min ? $('[data-act="dec"]') : $("#reason"); if (f) f.focus(); return; }
    var lower = S.draft < S.min;
    function span(a,b){ return a===b ? String(a) : (b-a===1 ? a+' or '+b : a+' to '+b); }
    openSheet("Change the smallest group from "+S.min+" to "+S.draft+"?",
      lower ? '<p>Leaders will start to see figures for groups of '+span(S.draft, S.min-1)+' people. In small groups, people can often guess who a figure is about.</p><p>This change is recorded with your name and reason.</p>'
            : '<p>Leaders will stop seeing figures for groups of '+span(S.min, S.draft-1)+' people.</p><p>This change is recorded with your name and reason.</p>',
      '<button class="btn" data-act="close">Keep '+S.min+'</button><button class="btn primary" data-act="confirm">Change to '+S.draft+'</button>', true);
  }
  else if (a==="confirm"){
    S.history.unshift({when:"15 Sep 2026, 10:52", who:"Vikram Shah", from:S.min, to:S.draft, why:S.reason.trim()});
    S.min = S.draft; S.reason = ""; closeSheet(); render(); toast("Saved. Leaders see the new rule the next time they open their overview.");
  }
});
function keepReason(){ var r = $("#reason"); if (r) S.reason = r.value; }
function focusSel(s){ var f = $(s); if (f) f.focus(); }
$("#scrim").addEventListener("click", closeSheet);
document.addEventListener("keydown", function(e){
  var open = $("#sheet").classList.contains("on");
  if (e.key==="Escape" && (open || S.railOpen)) { closeSheet(); return; }
  if (e.key==="Tab" && open){
    var f = Array.prototype.slice.call($("#sheet").querySelectorAll("button,[href],textarea,input,select,[tabindex]:not([tabindex='-1'])"));
    if (!f.length) return;
    if (e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if (!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

/* Controls */
var sel = $("#pState");
sel.innerHTML = STATES.map(function(x){ return '<option value="'+x[0]+'">'+x[1]+'</option>'; }).join("");
sel.addEventListener("change", function(){ go(sel.value); });
$("#pDevice").addEventListener("change", function(e){ S.device = e.target.value; layout(); });
$("#pTheme").addEventListener("change", function(e){
  S.theme = e.target.value;
  if (S.theme==="auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.theme);
  applyBrand();
});
$("#pLang").addEventListener("change", function(e){ S.lang = e.target.value; render(); });
$("#pBrand").addEventListener("change", function(e){ S.brand = e.target.value; applyBrand(); });
if (window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyBrand);

/* Tenant brand colour: same clamp as templates/includes/brand_color.html */
function applyBrand(){
  var root = document.documentElement;
  ["--primary","--primary-h","--primary-d","--primary-lt","--hero-bg"].forEach(function(k){ root.style.removeProperty(k); });
  var h = (S.brand||"").replace("#","");
  if (!/^[0-9a-fA-F]{6}$/.test(h)) return;
  var r = parseInt(h.slice(0,2),16)/255, g = parseInt(h.slice(2,4),16)/255, b = parseInt(h.slice(4,6),16)/255;
  var mx = Math.max(r,g,b), mn = Math.min(r,g,b), hh = 0, ss = 0, ll = (mx+mn)/2;
  if (mx !== mn){ var d = mx-mn; ss = ll>.5 ? d/(2-mx-mn) : d/(mx+mn);
    if (mx===r) hh = (g-b)/d + (g<b?6:0); else if (mx===g) hh = (b-r)/d + 2; else hh = (r-g)/d + 4; hh = Math.round(hh/6*360); }
  ss = Math.round(ss*100); ll = Math.round(ll*100);
  var dark = root.getAttribute("data-theme")==="dark" || (!root.getAttribute("data-theme") && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  var L = dark ? Math.max(ll,62) : Math.min(ll,44), SS = ss+"%";
  root.style.setProperty("--primary","hsl("+hh+","+SS+","+L+"%)");
  root.style.setProperty("--primary-h","hsl("+hh+","+SS+","+(dark?Math.min(L+8,88):Math.max(L-8,12))+"%)");
  root.style.setProperty("--primary-d","hsl("+hh+","+SS+","+(dark?Math.min(L+16,92):Math.max(L-14,10))+"%)");
  root.style.setProperty("--primary-lt","hsl("+hh+","+Math.round(ss*.35)+"%,"+(dark?16:95)+"%)");
  root.style.setProperty("--hero-bg","hsl("+hh+","+Math.max(ss*0.5,18)+"%,"+(dark?16:24)+"%)");
}

/* Device and phone layout */
function layout(){
  var stage = $("#stage"), app = $("#app");
  var wantPhone = S.device==="phone" && window.innerWidth >= 480;
  stage.classList.toggle("phone", wantPhone);
  var w = app.clientWidth;
  var phone = S.device==="phone" ? true : S.device==="desktop" ? (window.innerWidth < 760) : (w < 760);
  var was = app.classList.contains("is-phone");
  app.classList.toggle("is-phone", phone);
  if (was !== phone) render();
}
if (window.ResizeObserver) new ResizeObserver(function(){ layout(); }).observe(document.body);
window.addEventListener("resize", layout);

layout();
render();
})();
</script>
