# Kinexus HRMS – Local development Nginx
# Routes every *.localhost hostname to Frappe.
# Frappe automatically selects the correct tenant site from the Host header.

upstream frappe_http { server frappe:8000; }
upstream frappe_ws   { server frappe:9000; }

server {
    listen 80;
    server_name *.localhost localhost;

    client_max_body_size 50m;
    proxy_read_timeout   120s;

    location /socket.io {
        proxy_pass          http://frappe_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_set_header    Host       $host;
    }

    location ~* ^/(assets|files)/ {
        proxy_pass        http://frappe_http;
        proxy_set_header  Host $host;
        expires           1h;
    }

    location / {
        proxy_pass         http://frappe_http;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
