<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>087 Attendance follows the punches - prototype v5, Confirm redesigned (all names and times are Sample)</title>
<style>
/* Tokens copied from templates/includes/design_system.html (light and dark). --on-primary is added here: white text on the dark theme's light purple fails contrast (ux-learnings, 6 Nov). */
:root,:root[data-theme="light"]{--bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;--primary:#5B4B8A;--primary-h:#4A3D73;--primary-lt:#EDEAF4;--on-primary:#FFFFFF;--green:#1B7F5A;--red:#B3261E;--amber:#94600F;--sh1:0 1px 2px rgba(0,0,0,.06);--sh3:0 12px 32px rgba(0,0,0,.16);--r:10px;--r-sm:6px;--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
:root[data-theme="dark"]{--bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;--primary:#A99AD4;--primary-h:#BBAEE0;--primary-lt:#2A2438;--on-primary:#1A1815;--green:#5DBF97;--red:#F08A82;--amber:#E0A94A;--sh1:0 1px 2px rgba(0,0,0,.4);--sh3:0 12px 32px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.ic{flex:none;vertical-align:-3px}
/* ---- review scaffolding, not product ---- */
#demo{position:sticky;top:0;z-index:80;background:var(--surface2);border-bottom:1px solid var(--border);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
#demo .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
#demo .g>span{color:var(--text3);font-weight:700;font-size:12px;margin-right:2px}
#demo button{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-sm);padding:4px 8px;min-height:32px}
#demo button[aria-pressed=true]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
#demo .sample{border:1px solid var(--amber);color:var(--amber);border-radius:var(--r-sm);padding:2px 8px;font-weight:700;font-size:12px}
/* ---- stage: a phone frame with its own scroll, so the bar and the sheet sit where they do on a phone ---- */
#stage{margin:16px auto;position:relative;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#stage.phone{width:390px;max-width:100%;height:min(800px,calc(100vh - 150px));min-height:560px;border:10px solid #2a2a2e;border-radius:30px;box-shadow:var(--sh3)}
#stage.phone.p360{width:360px}
#stage.desktop{max-width:1040px;padding:0 16px;overflow:visible}
#stage.desktop.emp{max-width:560px;height:min(800px,calc(100vh - 150px));border:1px solid var(--border);border-radius:var(--r);overflow:hidden;padding:0}
@media(max-width:460px){#stage.phone{border:0;border-radius:0;width:100%;margin:0}}
.scroll{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.app-h{background:var(--surface);border-bottom:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:0}
.app-h b{font-size:18px;line-height:24px}.app-h small{font-size:13px;color:var(--text3)}
.pad{padding:16px 16px 24px}
.desktop:not(.emp) .app-h{background:none;border:0;padding:16px 0 8px}
.desktop:not(.emp) .pad{padding:8px 0 24px}
.has-bar .pad{padding-bottom:112px}
/* ---- one status line with an icon, instead of coloured panels ---- */
.sl{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:15px;line-height:24px}
.sl .ic{margin-top:3px}
.sl-ok .ic{color:var(--green)}.sl-held .ic{color:var(--amber)}.sl-wait .ic{color:var(--primary)}.sl-lock .ic,.sl-info .ic{color:var(--text3)}
.sl span{min-width:0}
.sub{font-size:13px;color:var(--text2);line-height:20px;margin:4px 0 0}
.muted{color:var(--text3);font-size:13px}
/* ---- day list ---- */
.dayrow{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border:1px solid var(--border);background:var(--surface);border-radius:var(--r);margin-top:8px}
.dayrow:first-child{margin-top:0}
.dayrow[aria-expanded=true]{border-color:var(--primary)}
.dayrow .d{font-weight:700}.dayrow .s{font-size:13px;color:var(--text2);display:flex;gap:6px;align-items:center;text-align:right}
.dayrow .s .ic{width:16px;height:16px}
.s-ok .ic{color:var(--green)}.s-held .ic{color:var(--amber)}.s-wait .ic{color:var(--primary)}.s-lock .ic{color:var(--text3)}
.day{border:1px solid var(--primary);border-top:0;background:var(--surface);border-radius:0 0 var(--r) var(--r);padding:16px;margin-bottom:8px;margin-top:-6px;padding-top:22px}
/* ---- the day as a timeline ---- */
.strip{position:relative;height:28px;margin:16px 0 4px}
.strip .band{position:absolute;top:0;bottom:0;background:var(--primary-lt);border-radius:6px}
.strip .bar{position:absolute;top:11px;height:6px;background:var(--primary);border-radius:3px}
.strip .pt{position:absolute;top:7px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--surface);border:3px solid var(--text2)}
.strip .pt.add{background:var(--green);border-color:var(--green)}
.strip .pt.aside{background:var(--surface2);border-color:var(--border2)}
.strip-cap{font-size:12px;color:var(--text3);display:flex;justify-content:space-between}
.tl{list-style:none;margin:12px -4px 0;padding:0}
.tl li{margin:0}
.tl-b,.tl-s{display:grid;grid-template-columns:56px 24px 1fr auto;align-items:center;column-gap:8px;width:100%;text-align:left;background:none;border:0;padding:0 4px;border-radius:8px}
.tl-b:hover{background:var(--surface2)}
.tl-p{min-height:56px}.tl-g{min-height:44px}
.tm{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.tl-g .tm{font-weight:400;color:var(--text3);font-size:13px}
.tl-g .gl{font-size:14px;color:var(--primary);font-weight:600;padding:8px 0}
.tl-p .lb{font-size:15px;font-weight:600;line-height:22px}
.tl-p .sb{font-size:13px;color:var(--text2);line-height:20px}
.rail{position:relative;align-self:stretch}
.rl{position:absolute;left:11px;width:2px}
.rl.up{top:0;bottom:50%}.rl.dn{top:50%;bottom:0}
.s-work{left:10px;width:4px;background:var(--primary)}
.s-brk{background:repeating-linear-gradient(to bottom,var(--border2) 0 4px,transparent 4px 8px)}
.s-unk{background:var(--border2)}.s-none{display:none}
.dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--surface);border:3px solid var(--text2)}
.dot.io{border-color:var(--primary)}
.dot.add{background:var(--green);border-color:var(--green)}
.dot.pend{border-style:dashed}
.dot.aside{background:var(--surface2);border-color:var(--border2)}
.gdot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px dashed var(--primary);color:var(--primary);display:grid;place-items:center}
.gdot .ic{width:14px;height:14px;margin:0}
.tl-p.aside .tm{text-decoration:line-through;text-decoration-thickness:2px;color:var(--text3)}
.tl-p.aside .lb{color:var(--text3)}
.tl-p.add .tm{color:var(--green)}
.lnk{background:none;border:0;color:var(--primary);font-weight:600;font-size:14px;min-height:44px;padding:0 4px;text-decoration:underline;text-underline-offset:3px}
.hint{font-size:13px;color:var(--text3);margin:8px 0 0}
.one{font-size:13px;color:var(--text2);margin:8px 0 0}
.facts{font-size:13px;color:var(--text3);margin:2px 0 0}
/* ---- sticky send bar and bottom sheet (inside the phone frame) ---- */
#bar{position:absolute;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--border);box-shadow:0 -4px 16px rgba(0,0,0,.08);padding:12px 16px;display:flex;gap:16px;align-items:center}
#bar .sum{flex:1;min-width:0;font-size:14px;font-weight:600;line-height:20px}
#bar .sum small{display:block;font-weight:400;color:var(--text3);font-size:12px}
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end}
#sheet{width:100%;background:var(--surface);border-radius:16px 16px 0 0;padding:8px 16px 24px;box-shadow:var(--sh3);max-height:90%;overflow:auto}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--border2);margin:0 auto 16px}
#sheet h2{margin:0;font-size:18px;line-height:24px}
#sheet .ctx{font-size:14px;color:var(--text2);margin:4px 0 16px}
.fl{display:block;font-weight:600;font-size:14px;margin:0 0 4px}
input[type=time],textarea{font:inherit;font-size:16px;padding:8px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);width:100%;min-height:48px}
input[type=time]{max-width:200px;font-variant-numeric:tabular-nums}
textarea{min-height:48px;height:48px;resize:vertical}
.field{margin-bottom:16px}
.infer{font-size:14px;color:var(--text2);margin:8px 0 0;min-height:20px}
.infer b{color:var(--text)}
.err{display:flex;gap:8px;color:var(--red);font-weight:600;font-size:14px;margin:8px 0}
input.bad{border-color:var(--red);border-width:2px}
.acts{display:flex;gap:8px;margin-top:8px}
.btn{min-height:48px;padding:8px 20px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);font-weight:600;font-size:15px}
.btn-primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h)}
#sheet .acts .btn{flex:1}
.other{display:block;margin-top:16px}
/* ---- HR card ---- */
.hrcard{container-type:inline-size;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 24px 8px;margin-bottom:16px;box-shadow:var(--sh1)}
@container (max-width:560px){.hrcard{padding:16px}}
.hrh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hrh b{font-size:16px}.hrh span{font-size:13px;color:var(--text3)}
.says{font-size:14px;color:var(--text2);margin:4px 0 0}
.says q{display:block;margin-top:4px;padding-left:12px;border-left:2px solid var(--border2);quotes:none;font-size:14px}
.ba{display:grid;grid-template-columns:1fr 24px 1fr;gap:0 16px;align-items:start;margin-top:16px}
.ba .arr{color:var(--text3);padding-top:30px}
.ba h4{margin:0;font-size:12px;font-weight:700;color:var(--text3);letter-spacing:.04em;text-transform:uppercase}
.ba .strip{margin-top:8px}
.tms{font-size:14px;font-variant-numeric:tabular-nums;margin:4px 0 8px;color:var(--text2)}
.tms .a{color:var(--green);font-weight:700}.tms .x{text-decoration:line-through;color:var(--text3)}
@container (max-width:560px){.ba{grid-template-columns:1fr;gap:8px}.ba .arr{display:none}}
.hrfoot{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:8px 0 0;padding-top:8px;border-top:1px solid var(--border)}
.hrfoot .grow{flex:1}
.hrcard .btn{min-height:44px}
.noteBox{margin:8px 0 0}
.legend{font-size:12px;color:var(--text3);margin:8px 0 0}
.sec{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin:24px 0 8px}
.done{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border);font-size:14px}
.empty{color:var(--text2);padding:16px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:12px 16px;border-radius:var(--r);box-shadow:var(--sh3);z-index:90;max-width:92vw;display:none;font-size:14px}

/* ---- v3: counsel's two conditions (ALV-418 reason on every request, ALV-419 employee Confirm). Same tokens as v2. ---- */
#bar{flex-direction:column;align-items:stretch;gap:8px;padding:12px 16px}
.has-bar .pad{padding-bottom:240px}
#bar .sum{flex:none}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.req{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap}
.fl .why{display:block;font-weight:400;font-size:12px;color:var(--text3);line-height:16px}
#bar .rsn{margin:0}
#bar textarea,.cf-nr textarea{resize:none;overflow:hidden;max-height:120px}
textarea.bad{border-color:var(--red);border-width:2px}
#bar .err,.cf-nr .err{margin:8px 0 0}
#bar .go{display:flex;align-items:center;gap:12px}
#bar .go small{flex:1;min-width:0;font-size:12px;color:var(--text3);line-height:16px}
#bar .go .btn{flex:none}
::placeholder{color:var(--text3);opacity:1}
.sl-ask .ic{color:var(--primary)}
.fact{margin:12px 0 0;font-weight:700;font-size:15px;line-height:22px;display:flex;gap:8px;align-items:flex-start}
.fact .ic{color:var(--green);margin-top:2px}
.q{margin:8px 0 0;padding-left:12px;border-left:2px solid var(--border2);font-size:14px;line-height:20px}
.q small{display:block;color:var(--text3);font-size:12px;line-height:16px}
.cf-acts{display:flex;gap:8px;margin-top:16px}.cf-acts .btn{flex:1}
.cf-nr{margin-top:16px}
.cf-acts+.facts,.cf-nr+.facts{margin-top:16px}
.hcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--sh1)}
.hcard h2{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.need{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border);font-size:15px}
.need>span{flex:1;min-width:0}
.need .btn{min-height:44px;padding:8px 16px}
.revnote{font-size:12px;color:var(--text3);margin:16px 0 0}

/* ---- v5: Confirm redesigned (Surbhi, 21 Nov): approval never waits; confirmation gates pay ---- */
#stage.desktop:not(.emp) #scrim{position:fixed;z-index:70;align-items:center;justify-content:center}
#stage.desktop:not(.emp) #sheet{border-radius:16px;max-width:520px}
.cfq{font-size:13px;color:var(--text2);display:flex;gap:8px;align-items:flex-start;margin:8px 0 0;line-height:20px}
.cfq .ic{margin-top:1px;color:var(--text3)}
.cfq b{color:var(--text)}
.regrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:8px 0 0}
.regrow .sub{margin:0;flex:1;min-width:200px}
.ppc .says{margin-bottom:8px}
.pp{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px 0;border-top:1px solid var(--border);align-items:center}
.pp .w{font-size:14px;line-height:20px}.pp .w b{font-size:15px}.pp .st{font-size:13px;color:var(--text2)}
.pp .a{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pp .a .btn{min-height:44px;padding:8px 14px}
@media(max-width:700px){.pp{grid-template-columns:1fr}.pp .a{justify-content:flex-start}}
.refuse{display:flex;gap:8px;color:var(--red);font-size:14px;line-height:20px;margin-top:12px}
.refuse ul{margin:4px 0 0;padding-left:18px;color:var(--text)}
.okline{display:flex;gap:8px;color:var(--green);font-weight:600;font-size:14px;margin-top:12px}
.swt{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.swt th,.swt td{text-align:left;padding:8px 12px 8px 0;border-top:1px solid var(--border);vertical-align:top}
.swt th{font-size:12px;color:var(--text3);text-transform:uppercase;letter-spacing:.04em}
.flagc{color:var(--amber);font-weight:700}
input[type=file]{font:inherit;font-size:16px;min-height:44px;padding:8px 0}
.tagn{display:inline-block;font-size:12px;font-weight:700;color:var(--amber);border:1px solid var(--amber);border-radius:6px;padding:0 6px;margin-left:8px}
</style></head><body>
<div id="demo" role="toolbar" aria-label="Review controls (not part of the product)">
  <span class="sample">Review controls. Every name, time and rule figure is Sample.</span>
  <div class="g"><span>Person</span>
    <button data-p="emp" aria-pressed="true">Employee: Ravi Sample</button>
    <button data-p="hr1" aria-pressed="false">HR: Anil Sample</button>
    <button data-p="hr2" aria-pressed="false">HR: Kavita Sample</button></div>
  <div class="g"><span>Device</span>
    <button data-d="phone" aria-pressed="true">Phone 390</button>
    <button data-d="p360" aria-pressed="false">Phone 360</button>
    <button data-d="desktop" aria-pressed="false">Desktop</button></div>
  <div class="g"><span>Language</span>
    <button data-l="en" aria-pressed="true">English</button>

    <button data-t="light" aria-pressed="true">Light</button>

</div>

<script>
/* words: [English, Hindi (machine draft, needs native review)] */
const T={
 tag_you_hr:["Added by HR · sent for you","HR ने जोड़ा · आपके लिए भेजा"],
 cf_h_appr_hr:["HR added this for you and has approved it. Is it right?","HR ने यह आपके लिए जोड़ा और मंज़ूर कर दिया है। क्या यह सही है?"],
 cf_h_appr_m:["HR approved this change that {0} sent for you. Is it right?","{0} ने आपके लिए जो बदलाव भेजा था, HR ने उसे मंज़ूर कर दिया है। क्या यह सही है?"],
 cf_truth_p:["Press Confirm only if this is what happened. HR can decide it now. Your salary slip for this month waits until you confirm it, or sign for it on the register.","यही हुआ था तभी पुष्टि करें दबाएं। HR अभी फ़ैसला कर सकता है। जब तक आप पुष्टि नहीं करते या रजिस्टर पर दस्तख़त नहीं करते, इस महीने की आपकी वेतन पर्ची रुकी रहेगी।"],
 cf_truth_a:["Press Confirm only if this is what happened. Your salary slip for this month waits until you confirm it, or sign for it on the register. If it is not right, say so and HR will look again.","यही हुआ था तभी पुष्टि करें दबाएं। जब तक आप पुष्टि नहीं करते या रजिस्टर पर दस्तख़त नहीं करते, इस महीने की वेतन पर्ची रुकी रहेगी। सही नहीं है तो बताएं, HR फिर देखेगा।"],
 cf_truth_m:["HR decides this. Nothing on your day changes until then. If it is not right, say so and give your own time.","HR इस पर फ़ैसला करेगा। तब तक आपके दिन में कुछ नहीं बदलता। सही नहीं है तो बताएं और अपना समय दें।"],
 cf_truth_ma:["HR approved this on 21 Nov. If it is not right, say so and give your own time.","HR ने इसे 21 नव को मंज़ूर किया। सही नहीं है तो बताएं और अपना समय दें।"],
 cf_done_app:["You confirmed this at {0}","आपने {0} बजे इसकी पुष्टि की"],cf_done_reg:["You signed for this on the register on {0}","आपने {0} को रजिस्टर पर इसके लिए दस्तख़त किए"],

  h+=`<div class="pp"><div class="w"><b>Ravi Sample · ${dn(k)}</b><br>${chgTxt(d)} · ${t("pp_by",esc(by_full(d)))}<div class="st">${st} · ${cfState(d)}</div></div><div class="a">`
   +(d.conf==="no"&&!mine?`<button class="btn" onclick="openReg('${k}')">${t("reg_btn")}</button>`:"")
   +(d.stage==="confirm"?`<button class="btn" onclick="withdrawCh('${k}')">${t("pp_wd")}</button>`:"")+`</div></div>`});
 h+=`<div class="hrfoot"><button class="btn" onclick="trySlip()">${t("sl_btn")}</button></div>`;
 if(SLIP&&SLIP.no)h+=`<div class="refuse" role="alert">${ic("warn")}<div>${t("sl_no",SLIP.no.length===1?"1 change is":SLIP.no.length+" changes are")}<ul>${SLIP.no.map(k=>`<li>${dn(k)}: ${chgTxt(S[k]).toLowerCase()}, ${t("pp_by",esc(by_full(S[k])))}</li>`).join("")}</ul>${t("sl_how")}</div></div>`;
 if(SLIP&&SLIP.ok)h+=`<div class="okline" role="status">${ic("check")}<span>${t("sl_ok")}</span></div>`;
 return h+"</section>"}
function swHtml(){const l=unconf();return`<div class="sec">${t("sw_h")}<span class="tagn">Note only</span></div><p class="legend" style="margin-top:0">${t("sw_note")}</p><table class="swt"><thead><tr><th>Employee</th><th>Pay days</th><th>Unconfirmed</th></tr></thead><tbody><tr><td>Ravi Sample</td><td class="num">20</td><td>${l.length?`<span class="flagc">${ic("alert")} ${t("sw_flag",l.map(k=>dn(k)+" "+chgTxt(S[k]).toLowerCase()).join("; "))}</span>`:t("sw_clear")}</td></tr></tbody></table>`}
function actions(c,u,canApprove,addTxt){
 let h=`<div class="hrfoot">`;
 if(canApprove)h+=`<button class="btn btn-primary" aria-describedby="res-${c.id}" onclick="doApprove('${c.id}')">${t("approve")}</button>`;
 h+=`<button class="btn" onclick="doDecline('${c.id}')">${t("decline")}</button>`;
 if(!u.open)h+=`<button class="lnk" onclick="HRUI['${c.id}'].open=true;render();document.getElementById('hn-${c.id}')&&document.getElementById('hn-${c.id}').focus()">${t("add_note",c.first)}</button>`;
 h+=`<span class="grow"></span><button class="lnk" onclick="toast('Sample: opens ${c.first}’s month')">${t("month")}</button></div>`;
 if(u.open)h+=`<div class="noteBox"><label class="fl" for="hn-${c.id}">${u.dec?t("dec_lbl",c.first):t("note_lbl",c.first)}</label><textarea id="hn-${c.id}" ${u.err?'class="bad" aria-invalid="true"':""} oninput="HRUI['${c.id}'].note=this.value">${esc(u.note)}</textarea>${u.err?`<div class="err" role="alert">${ic("warn")}<span>${t("need_reason",c.first)}</span></div>`:""}</div>`;
 if(canApprove&&addTxt)h+=`<p class="legend" style="margin-bottom:8px">${t("marks",addTxt)}</p>`;
 return h}
function doApprove(id){const c=hrList().find(x=>x.id===id),d=S[id];
 if(d){const j=judge(compose(d.p,{add:c.add,set:c.set}));
  if(c.add)d.p.push({t:c.add,src:"HR"});d.p.forEach(x=>{if(c.set.includes(x.t))x.aside=true});d.stage="approved";d.on=ON();
  toast(j.held?t("toast_ap3"):c.add?t("toast_ap",c.add):t("toast_ap2",c.set.join(", ")))}
 else{S.hr[id]=true;toast(t("toast_ap",c.add))}render()}
function doDecline(id){const u=HRUI[id]||(HRUI[id]={open:false,note:"",err:false});
 if(!u.note.trim()){u.open=true;u.dec=true;u.err=true;render();const e=document.getElementById("hn-"+id);if(e)e.focus();return}
 if(S[id]){S[id].stage="declined";S[id].dnote=u.note.trim();S[id].req=null}else S.hr[id]=true;toast(t("toast_dec"));render()}
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display="none",3500)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&SHEET)closeSheet()});
document.getElementById("demo").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id==="reset"){fresh();render();return}
 if(b.dataset.sc){scen(b.dataset.sc);return}
 if(b.dataset.p){WHO=b.dataset.p;if(WHO!=="emp")DEV="desktop";if(WHO==="emp"&&DEV==="desktop")DEV="phone"}
 if(b.dataset.d)DEV=b.dataset.d;if(b.dataset.l)LANG=b.dataset.l;if(b.dataset.t)THEME=b.dataset.t;render()});
render();
