{% extends "templates/web.html" %}
{% block title %}HR Home — Grace Group{% endblock %}

{% block head_include %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
/* ── Design tokens ───────────────────────────────────────────── */
:root {
  --bg:          #f1f5f9;
  --surface:     #ffffff;
  --surface2:    #f8fafc;
  --border:      #e2e8f0;
  --border2:     #cbd5e1;
  --text:        #0f172a;
  --text2:       #475569;
  --text3:       #94a3b8;
  --primary:     #16A373;
  --primary-lt:  #EAFAF4;
  --accent:      #d97706;
  --accent-lt:   #fef3c7;
  --ok:          #059669;
  --ok-lt:       #d1fae5;
  --warn:        #d97706;
  --warn-lt:     #fef9c3;
  --danger:      #dc2626;
  --danger-lt:   #fee2e2;
  --shadow:      0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.06);
  --shadow-md:   0 4px 6px rgba(0,0,0,.07), 0 2px 4px rgba(0,0,0,.06);
  --radius:      10px;
  --radius-sm:   6px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg:         #0f172a;
    --surface:    #1e293b;
    --surface2:   #162032;
    --border:     #334155;
    --border2:    #475569;
    --text:       #f1f5f9;
    --text2:      #94a3b8;
    --text3:      #64748b;
    --primary:    #34d399;
    --primary-lt: #052e1c;
    --accent:     #f59e0b;
    --accent-lt:  #3a2700;
    --ok:         #10b981;
    --ok-lt:      #052e16;
    --warn:       #f59e0b;
    --warn-lt:    #3a2700;
    --danger:     #f87171;
    --danger-lt:  #450a0a;
    --shadow:     0 1px 3px rgba(0,0,0,.3);
    --shadow-md:  0 4px 6px rgba(0,0,0,.4);
  }
}
:root[data-theme="light"] {
  --bg:#f1f5f9; --surface:#ffffff; --surface2:#f8fafc; --border:#e2e8f0; --border2:#cbd5e1;
  --text:#0f172a; --text2:#475569; --text3:#94a3b8;
  --primary:#16A373; --primary-lt:#EAFAF4; --accent:#d97706; --accent-lt:#fef3c7;
  --ok:#059669; --ok-lt:#d1fae5; --warn:#d97706; --warn-lt:#fef9c3;
  --danger:#dc2626; --danger-lt:#fee2e2;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);
  --shadow-md:0 4px 6px rgba(0,0,0,.07),0 2px 4px rgba(0,0,0,.06);
}
:root[data-theme="dark"] {
  --bg:#0f172a; --surface:#1e293b; --surface2:#162032; --border:#334155; --border2:#475569;
  --text:#f1f5f9; --text2:#94a3b8; --text3:#64748b;
  --primary:#34d399; --primary-lt:#052e1c; --accent:#f59e0b; --accent-lt:#3a2700;
  --ok:#10b981; --ok-lt:#052e16; --warn:#f59e0b; --warn-lt:#3a2700;
  --danger:#f87171; --danger-lt:#450a0a;
  --shadow:0 1px 3px rgba(0,0,0,.3); --shadow-md:0 4px 6px rgba(0,0,0,.4);
}

/* ── Reset / base ────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; font-size: 14px; line-height: 1.5; min-height: 100vh; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; border: none; background: none; font: inherit; }
table { border-collapse: collapse; width: 100%; }
th { font-weight: 600; text-align: left; color: var(--text2); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
td, th { padding: 10px 12px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
font-variant-numeric: tabular-nums;

/* ── Layout ──────────────────────────────────────────────────── */
.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 56px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: var(--shadow);
}
.app-logo { font-size: 18px; font-weight: 700; color: var(--primary); letter-spacing: -.03em; }
.app-logo span { color: var(--accent); }
.app-header-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--primary); color: #fff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.user-name { font-size: 13px; font-weight: 600; color: var(--text); }
.user-role { font-size: 11px; color: var(--text3); }
.btn-logout {
  font-size: 12px; color: var(--text2);
  padding: 4px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2);
  transition: background .15s;
}
.btn-logout:hover { background: var(--surface2); }

.app-main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }

/* ── Tab nav ─────────────────────────────────────────────────── */
.tab-bar {
  display: flex; gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 24px;
  width: fit-content;
  box-shadow: var(--shadow);
}
.tab-btn {
  padding: 8px 18px;
  border-radius: calc(var(--radius) - 2px);
  font-size: 13px; font-weight: 500;
  color: var(--text2);
  transition: background .15s, color .15s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); background: var(--surface2); }
.tab-btn.active { background: var(--primary); color: #fff; }
.tab-btn .badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--danger); color: #fff; font-size: 10px; font-weight: 700;
  margin-left: 6px; vertical-align: middle;
}
.tab-btn.active .badge { background: rgba(255,255,255,.3); }

.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── Cards / sections ────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.card-title { font-size: 14px; font-weight: 600; color: var(--text); }
.card-sub { font-size: 12px; color: var(--text3); margin-top: 1px; }
.card-icon { width: 32px; height: 32px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.card-body { padding: 16px 20px; }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
@media (max-width: 900px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { .grid-2, .grid-3, .grid-4 { grid-template-columns: 1fr; } .tab-bar { flex-wrap: wrap; width: 100%; } }

.section-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 12px; letter-spacing: -.01em; }

/* ── Profile card ────────────────────────────────────────────── */
.profile-card {
  background: linear-gradient(135deg, var(--primary) 0%, #1e3a8a 100%);
  border-radius: var(--radius);
  padding: 24px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 20px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-md);
}
.profile-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  background: rgba(255,255,255,.2);
  font-size: 24px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  border: 3px solid rgba(255,255,255,.3);
}
.profile-name { font-size: 20px; font-weight: 700; letter-spacing: -.02em; }
.profile-meta { font-size: 13px; opacity: .85; margin-top: 2px; }
.profile-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.profile-tag {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  border-radius: 20px;
  padding: 2px 10px;
  font-size: 11px;
}
.profile-links { margin-left: auto; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.profile-link-btn {
  background: rgba(255,255,255,.15);
  border: 1px solid rgba(255,255,255,.25);
  color: #fff;
  border-radius: var(--radius-sm);
  padding: 6px 14px;
  font-size: 12px; font-weight: 500;
  transition: background .15s;
}
.profile-link-btn:hover { background: rgba(255,255,255,.25); text-decoration: none; }

/* ── Leave balance cards ─────────────────────────────────────── */
.leave-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  border-left: 4px solid var(--lc, #64748b);
}
.leave-card-type { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.leave-stats { display: flex; gap: 0; }
.leave-stat { flex: 1; text-align: center; }
.leave-stat + .leave-stat { border-left: 1px solid var(--border); }
.leave-stat-val { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text); line-height: 1.2; }
.leave-stat-lbl { font-size: 10px; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-top: 2px; }
.leave-bar { margin-top: 12px; height: 5px; border-radius: 3px; background: var(--border); overflow: hidden; }
.leave-bar-fill { height: 100%; border-radius: 3px; background: var(--lc, #64748b); transition: width .6s ease; }

/* ── Stat pills ─────────────────────────────────────────────── */
.stat-pills { display: flex; flex-wrap: wrap; gap: 10px; }
.stat-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px;
}
.stat-pill .val { font-size: 18px; }
.pill-present { background: var(--ok-lt); color: var(--ok); }
.pill-absent  { background: var(--danger-lt); color: var(--danger); }
.pill-half    { background: var(--warn-lt); color: var(--warn); }
.pill-wfh     { background: var(--primary-lt); color: var(--primary); }

/* ── Status badges ───────────────────────────────────────────── */
.badge-status {
  display: inline-block;
  padding: 2px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.s-open     { background: var(--warn-lt);    color: var(--warn); }
.s-approved { background: var(--ok-lt);      color: var(--ok); }
.s-rejected { background: var(--danger-lt);  color: var(--danger); }
.s-present  { background: var(--ok-lt);      color: var(--ok); }
.s-absent   { background: var(--danger-lt);  color: var(--danger); }
.s-leave    { background: var(--warn-lt);    color: var(--warn); }

/* ── KPI cards ───────────────────────────────────────────────── */
.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: flex-start;
  gap: 14px;
}
.kpi-icon { width: 44px; height: 44px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.kpi-val { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.kpi-lbl { font-size: 12px; color: var(--text2); margin-top: 4px; }
.kpi-sub { font-size: 11px; color: var(--text3); margin-top: 3px; }

/* ── Org health bars ─────────────────────────────────────────── */
.health-item { margin-bottom: 14px; }
.health-item:last-child { margin-bottom: 0; }
.health-label { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
.health-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
.health-fill { height: 100%; border-radius: 4px; transition: width .7s ease; }

/* ── Bar charts ──────────────────────────────────────────────── */
.bar-chart { }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.bar-row:last-child { margin-bottom: 0; }
.bar-row-label { font-size: 12px; color: var(--text2); width: 160px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row-track { flex: 1; height: 20px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
.bar-row-fill { height: 100%; border-radius: 4px; transition: width .7s ease; display: flex; align-items: center; padding-left: 8px; font-size: 11px; color: #fff; font-weight: 600; }
.bar-row-val { font-size: 12px; font-weight: 700; width: 28px; text-align: right; color: var(--text2); }

/* ── Donut chart ─────────────────────────────────────────────── */
.donut-wrap { display: flex; align-items: center; gap: 24px; }
.donut-legend { display: flex; flex-direction: column; gap: 10px; }
.legend-item { display: flex; align-items: center; gap: 8px; }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-lbl { font-size: 12px; color: var(--text2); }
.legend-val { font-size: 13px; font-weight: 700; margin-left: 4px; }

/* ── Team grid ───────────────────────────────────────────────── */
.team-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  gap: 12px;
}
.team-avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: var(--primary-lt);
  color: var(--primary);
  font-size: 14px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.team-name { font-size: 13px; font-weight: 600; }
.team-desig { font-size: 11px; color: var(--text2); margin-top: 1px; }
.team-dept  { font-size: 11px; color: var(--text3); }
.team-status { margin-left: auto; }

/* ── Approval card ───────────────────────────────────────────── */
.appr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow);
  margin-bottom: 10px;
}
.appr-card:last-child { margin-bottom: 0; }
.appr-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.appr-name { font-size: 14px; font-weight: 600; }
.appr-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.appr-note { font-size: 12px; color: var(--text3); margin-top: 6px; font-style: italic; }
.appr-actions { display: flex; gap: 8px; margin-top: 12px; }
.btn-approve {
  background: var(--ok); color: #fff;
  padding: 6px 16px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600;
  transition: opacity .15s;
}
.btn-approve:hover { opacity: .85; }
.btn-reject {
  background: var(--danger-lt); color: var(--danger);
  border: 1px solid var(--danger);
  padding: 6px 16px; border-radius: var(--radius-sm);
  font-size: 12px; font-weight: 600;
  transition: opacity .15s;
}
.btn-reject:hover { opacity: .75; }
.btn-approve:disabled, .btn-reject:disabled { opacity: .4; cursor: not-allowed; }

/* ── Misc ─────────────────────────────────────────────────────── */
.empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }
.empty-state .emoji { font-size: 36px; display: block; margin-bottom: 10px; }
.loading { text-align: center; padding: 40px 20px; color: var(--text3); }
.loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.section-gap { margin-top: 24px; }
.tbl-scroll { overflow-x: auto; }
.text-ok { color: var(--ok); }
.text-warn { color: var(--warn); }
.text-danger { color: var(--danger); }
.text-muted { color: var(--text3); }
.fw-600 { font-weight: 600; }
.mt-4 { margin-top: 4px; }
.mt-8 { margin-top: 8px; }
.mt-16 { margin-top: 16px; }

/* ── Org tree ─────────────────────────────────────────────────── */
.org-tree { font-size: 13px; }
.org-node { margin: 0; padding: 0; list-style: none; }
.org-node li { position: relative; padding-left: 24px; margin-bottom: 2px; }
.org-node li::before {
  content: '';
  position: absolute; left: 8px; top: 0;
  border-left: 1px solid var(--border2);
  height: 100%;
}
.org-node li::after {
  content: '';
  position: absolute; left: 8px; top: 14px;
  border-top: 1px solid var(--border2);
  width: 12px;
}
.org-node li:last-child::before { height: 14px; }
.org-item {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 10px; border-radius: var(--radius-sm);
  background: var(--surface2);
  border: 1px solid var(--border);
  margin-bottom: 2px;
}
.org-item-name { font-weight: 600; }
.org-item-desig { color: var(--text2); font-size: 11px; }
.org-item-dept { color: var(--text3); font-size: 11px; }
.org-root .org-item { background: var(--primary-lt); border-color: var(--primary); }
.org-root .org-item-name { color: var(--primary); }

/* ── Announcement bar ─────────────────────────────────────────── */
.notice-bar {
  background: var(--accent-lt);
  border: 1px solid var(--accent);
  border-radius: var(--radius-sm);
  padding: 8px 14px;
  font-size: 12px;
  color: var(--accent);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
</style>
{% endblock %}

{% block page_content %}
<script>
window.HRMS_USER  = "{{ frappe.session.user }}";
window.CSRF_TOKEN = "{{ frappe.session.csrf_token }}";
</script>

<!-- ══════════════════════════════════════════════════════════════ -->
<div id="hrms-root">

  <!-- Header -->
  <header class="app-header">
    <div class="app-logo">Grace<span>.</span>HR</div>
    <div id="hdr-info" style="font-size:13px;color:var(--text2);"></div>
    <div class="app-header-right">
      <div>
        <div class="user-name" id="hdr-user">—</div>
        <div class="user-role" id="hdr-role">—</div>
      </div>
      <div class="avatar" id="hdr-avatar">?</div>
      <a href="/hrms-employee" class="btn-logout" style="background:var(--primary);color:#fff;border-color:var(--primary)" title="Employee self-service portal">Self Service</a>
      <a href="/hrms" class="btn-logout" title="Go to HRMS desk">HRMS ↗</a>
      <a href="/logout" class="btn-logout">Sign out</a>
    </div>
  </header>

  <div class="app-main">

    <!-- Tab bar -->
    <div class="tab-bar" id="tab-bar">
      <button class="tab-btn active" data-tab="t-employee" onclick="switchTab('t-employee')">
        My Dashboard
      </button>
      <button class="tab-btn" data-tab="t-manager" id="tab-manager-btn" onclick="switchTab('t-manager')" style="display:none">
        Team View <span class="badge" id="mgr-badge" style="display:none"></span>
      </button>
      <button class="tab-btn" data-tab="t-hr" id="tab-hr-btn" onclick="switchTab('t-hr')" style="display:none">
        HR Analytics
      </button>
    </div>

    <!-- ── Employee Tab ──────────────────────────────────────── -->
    <div id="t-employee" class="tab-panel active">
      <div id="emp-loading" class="loading">
        <div class="loading-spinner"></div>
        Loading your dashboard…
      </div>
      <div id="emp-content" style="display:none"></div>
    </div>

    <!-- ── Manager Tab ──────────────────────────────────────── -->
    <div id="t-manager" class="tab-panel">
      <div id="mgr-loading" class="loading">
        <div class="loading-spinner"></div>
        Loading team view…
      </div>
      <div id="mgr-content" style="display:none"></div>
    </div>

    <!-- ── HR Analytics Tab ─────────────────────────────────── -->
    <div id="t-hr" class="tab-panel">
      <div id="hr-loading" class="loading">
        <div class="loading-spinner"></div>
        Loading HR analytics…
      </div>
      <div id="hr-content" style="display:none"></div>
    </div>

  </div><!-- .app-main -->
</div><!-- #hrms-root -->

<script>
/* ═══════════════════════════════════════════════════════════════
   Grace HRMS Home — main.js
   ══════════════════════════════════════════════════════════════ */

const MODULE = "grace_vendor_portal.hr_api";
const st = {
  ctx: null,
  empData: null,
  mgrData: null,
  hrData: null,
  loadedTabs: new Set(),
};

/* ── helpers ─────────────────────────────────────────────────── */
function api(fn, args, cb, errCb) {
  frappe.call({
    method: `${MODULE}.${fn}`,
    args: args || {},
    callback: function(r) {
      if (r.exc) { errCb && errCb(r); return; }
      cb(r.message);
    },
    error: function(r) { errCb && errCb(r); },
  });
}

function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d);
  return dt.toLocaleDateString("en-IN", { day: "2-digit", month: "short", year: "numeric" });
}

function initials(name) {
  if (!name) return "?";
  return name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
}

function statusClass(s) {
  const m = { "Open":"s-open", "Approved":"s-approved", "Rejected":"s-rejected",
               "Present":"s-present", "Absent":"s-absent", "Half Day":"s-leave" };
  return m[s] || "s-open";
}

/* ── tab switching ───────────────────────────────────────────── */
function switchTab(id) {
  document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === id));
  document.getElementById(id).classList.add("active");
  if (id === "t-manager" && !st.loadedTabs.has("manager")) loadManagerDash();
  if (id === "t-hr" && !st.loadedTabs.has("hr")) loadHrAnalytics();
}

/* ══════════════════════════════════════════════════════════════
   BOOT
   ══════════════════════════════════════════════════════════════ */
function boot() {
  api("get_portal_context", {}, ctx => {
    if (ctx.type === "guest") { location.href = "/login?redirect-to=/hrms-home"; return; }
    st.ctx = ctx;

    const emp = ctx.employee;
    const name = emp ? emp.employee_name : ctx.user;
    document.getElementById("hdr-user").textContent = name || ctx.user;
    document.getElementById("hdr-role").textContent = ctx.is_hr ? "HR Manager" : ctx.is_manager ? "Manager" : "Employee";
    document.getElementById("hdr-avatar").textContent = initials(name || ctx.user);
    document.getElementById("hdr-info").textContent = emp ? `${emp.designation || ""} · ${emp.department || ""}` : "";

    if (ctx.is_manager) {
      document.getElementById("tab-manager-btn").style.display = "";
    }
    if (ctx.is_hr) {
      document.getElementById("tab-hr-btn").style.display = "";
    }

    loadEmployeeDash();
  }, function(r) {
    document.getElementById("emp-loading").innerHTML =
      '<div class="empty-state">Could not load dashboard. <a href="">Refresh</a></div>';
  });
}

function loadEmployeeDash() {
  api("get_employee_dashboard", {}, data => {
    st.empData = data;
    if (data.no_employee) {
      document.getElementById("emp-loading").style.display = "none";
      document.getElementById("emp-content").style.display = "";
      document.getElementById("emp-content").innerHTML = renderNoEmployee();
      return;
    }
    const html = buildEmployeeHtml(data);
    document.getElementById("emp-loading").style.display = "none";
    document.getElementById("emp-content").innerHTML = html;
    document.getElementById("emp-content").style.display = "";
    st.loadedTabs.add("employee");

    if (data.pending_approvals && data.pending_approvals.length > 0) {
      const btn = document.getElementById("tab-manager-btn");
      if (btn) {
        const b = document.getElementById("mgr-badge");
        if (b) { b.textContent = data.pending_approvals.length; b.style.display = ""; }
      }
    }
  }, () => {
    document.getElementById("emp-loading").innerHTML = '<div class="empty-state">Failed to load dashboard. <a href="">Refresh</a></div>';
  });
}

function buildHrHtml(d) {
  const h = d.headcount || {};
  const kpi = d.kpis || {};
  const oh = d.org_health || {};

  // ── KPI row ─────────────────────────────────────────────────
  const kpiCards = `
  <div class="grid-4">
    <div class="kpi-card">
      <div class="kpi-icon" style="background:var(--primary-lt)">👥</div>
      <div>
        <div class="kpi-val">${h.active || 0}</div>
        <div class="kpi-lbl">Active Employees</div>
        ${h.new_joiners ? `<div class="kpi-sub text-ok">+${h.new_joiners} joined this month</div>` : ""}
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:var(--ok-lt)">✅</div>
      <div>
        <div class="kpi-val">${kpi.attendance_rate || 0}<span style="font-size:16px">%</span></div>
        <div class="kpi-lbl">Attendance Rate</div>
        <div class="kpi-sub">${oh.present_this_month || 0} present · ${oh.absent_this_month || 0} absent</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:var(--warn-lt)">🏖️</div>
      <div>
        <div class="kpi-val">${kpi.leave_utilization || 0}<span style="font-size:16px">%</span></div>
        <div class="kpi-lbl">Leave Utilization</div>
        <div class="kpi-sub">${kpi.total_leave_taken || 0} of ${kpi.total_leave_allocated || 0} days used</div>
      </div>
    </div>
    <div class="kpi-card">
      <div class="kpi-icon" style="background:${oh.pending_approvals > 0 ? "var(--danger-lt)" : "var(--ok-lt)"}">
        ${oh.pending_approvals > 0 ? "⏳" : "✅"}</div>
      <div>
        <div class="kpi-val" style="color:${oh.pending_approvals > 0 ? "var(--danger)" : "var(--ok)"}">${oh.pending_approvals || 0}</div>
        <div class="kpi-lbl">Pending Approvals</div>
        ${oh.confirmations_due > 0 ? `<div class="kpi-sub text-warn">${oh.confirmations_due} confirmation${oh.confirmations_due!=1?"s":""} due</div>` : ""}
      </div>
    </div>
  </div>`;

  // ── Org Health signals ──────────────────────────────────────
  const attRate = kpi.attendance_rate || 0;
  const leaveUtil = kpi.leave_utilization || 0;
  const orgHealthHtml = `
  <div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--ok-lt)">❤️</div>
      <div class="card-title">Organisation Health</div>
    </div>
    <div class="card-body">
      <div class="health-item">
        <div class="health-label">
          <span>Attendance Rate</span>
          <span style="font-weight:700;color:${attRate>=85?"var(--ok)":attRate>=70?"var(--warn)":"var(--danger)"}">${attRate}%</span>
        </div>
        <div class="health-bar"><div class="health-fill" style="width:${attRate}%;background:${attRate>=85?"var(--ok)":attRate>=70?"var(--warn)":"var(--danger)"}"></div></div>
      </div>
      <div class="health-item">
        <div class="health-label">
          <span>Leave Utilization</span>
          <span style="font-weight:700;color:${leaveUtil<=60?"var(--ok)":leaveUtil<=80?"var(--warn)":"var(--danger)"}">${leaveUtil}%</span>
        </div>
        <div class="health-bar"><div class="health-fill" style="width:${leaveUtil}%;background:${leaveUtil<=60?"var(--ok)":leaveUtil<=80?"var(--warn)":"var(--danger)"}"></div></div>
      </div>
      <div class="health-item">
        <div class="health-label">
          <span>Headcount Utilization</span>
          <span style="font-weight:700;color:var(--ok)">${h.active || 0} / ${h.total || 0}</span>
        </div>
        <div class="health-bar"><div class="health-fill" style="width:${h.total ? Math.round((h.active||0)/h.total*100) : 0}%;background:var(--ok)"></div></div>
      </div>
    </div>
  </div>`;

  // ── Department distribution ─────────────────────────────────
  const depts = d.dept_distribution || [];
  const maxDept = depts.reduce((m, r) => Math.max(m, r.count), 1);
  const deptColors = ["#1d4ed8","#059669","#d97706","#dc2626","#7c3aed","#0891b2","#be185d"];
  const deptRows = depts.map((r, i) => `
    <div class="bar-row">
      <div class="bar-row-label" title="${r.department}">${r.department}</div>
      <div class="bar-row-track">
        <div class="bar-row-fill" style="width:${Math.round(r.count/maxDept*100)}%;background:${deptColors[i%deptColors.length]}">${r.count > 1 ? r.count : ""}</div>
      </div>
      <div class="bar-row-val">${r.count}</div>
    </div>`).join("");
  const deptHtml = `
  <div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--primary-lt)">🏢</div>
      <div class="card-title">Department Distribution</div>
    </div>
    <div class="card-body bar-chart">${deptRows || '<div class="empty-state" style="padding:20px">No data</div>'}</div>
  </div>`;

  // ── Gender distribution donut ───────────────────────────────
  const genders = d.gender_distribution || [];
  const totalEmp = genders.reduce((s, g) => s + g.count, 0) || 1;
  const gColors = { "Male":"#1d4ed8", "Female":"#be185d", "Not Specified":"#94a3b8" };
  let gAngle = 0;
  const C = 2 * Math.PI * 38;
  const slices = genders.map(g => {
    const pct = g.count / totalEmp;
    const dash = pct * C;
    const offset = -gAngle * C / (2 * Math.PI);
    const slice = `<circle cx="44" cy="44" r="38" fill="none"
      stroke="${gColors[g.gender] || "#64748b"}" stroke-width="14"
      stroke-dasharray="${dash} ${C}"
      stroke-dashoffset="${-gAngle/360*C}"
      transform="rotate(-90 44 44)"/>`;
    gAngle += pct * 360;
    return slice;
  }).join("");
  const legendItems = genders.map(g => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${gColors[g.gender]||"#64748b"}"></div>
      <span class="legend-lbl">${g.gender}</span>
      <span class="legend-val">${g.count}</span>
    </div>`).join("");
  const genderHtml = `
  <div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--primary-lt)">⚧️</div>
      <div class="card-title">Gender Ratio</div>
    </div>
    <div class="card-body">
      <div class="donut-wrap">
        <svg viewBox="0 0 88 88" width="120" height="120" style="flex-shrink:0">
          <circle cx="44" cy="44" r="38" fill="none" stroke="var(--border)" stroke-width="14"/>
          ${slices}
          <text x="44" y="42" text-anchor="middle" style="font-size:11px;fill:var(--text);font-weight:700">${totalEmp}</text>
          <text x="44" y="55" text-anchor="middle" style="font-size:8px;fill:var(--text3)">total</text>
        </svg>
        <div class="donut-legend">${legendItems}</div>
      </div>
    </div>
  </div>`;

  // ── Location distribution ───────────────────────────────────
  const locs = d.location_distribution || [];
  const maxLoc = locs.reduce((m,r) => Math.max(m, r.count), 1);
  const locRows = locs.map((r,i) => `
    <div class="bar-row">
      <div class="bar-row-label">${r.location}</div>
      <div class="bar-row-track">
        <div class="bar-row-fill" style="width:${Math.round(r.count/maxLoc*100)}%;background:${deptColors[(i+3)%deptColors.length]}">${r.count > 1 ? r.count : ""}</div>
      </div>
      <div class="bar-row-val">${r.count}</div>
    </div>`).join("");
  const locHtml = `
  <div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--accent-lt)">📍</div>
      <div class="card-title">Location Distribution</div>
    </div>
    <div class="card-body bar-chart">${locRows || '<div class="empty-state" style="padding:20px">No data</div>'}</div>
  </div>`;

  // ── Joiners trend (mini bar chart) ──────────────────────────
  const trend = d.joiners_trend || [];
  let trendHtml = "";
  if (trend.length) {
    const maxT = trend.reduce((m,r) => Math.max(m, r.count), 1);
    const bars = trend.map(r => {
      const h = Math.max(Math.round(r.count/maxT*60), 4);
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
        <div style="font-size:11px;font-weight:700;color:var(--primary)">${r.count}</div>
        <div style="height:${h}px;min-height:4px;width:100%;background:var(--primary);border-radius:3px 3px 0 0;opacity:.8"></div>
        <div style="font-size:10px;color:var(--text3);text-align:center;white-space:nowrap">${r.month.replace(" ","\n")}</div>
      </div>`;
    }).join("");
    trendHtml = `
    <div class="card">
      <div class="card-header">
        <div class="card-icon" style="background:var(--ok-lt)">📈</div>
        <div class="card-title">Monthly Joiners (6 months)</div>
      </div>
      <div class="card-body">
        <div style="display:flex;align-items:flex-end;gap:6px;height:100px;padding-bottom:4px">${bars}</div>
      </div>
    </div>`;
  }

  // ── Confirmations due ───────────────────────────────────────
  let confirmHtml = "";
  if (d.confirmations_due && d.confirmations_due.length) {
    const rows = d.confirmations_due.map(e => `
      <tr>
        <td class="fw-600">${e.employee_name}</td>
        <td>${e.designation || "—"}</td>
        <td>${e.department || "—"}</td>
        <td>${fmtDate(e.date_of_joining)}</td>
        <td><span class="badge-status s-open">${fmtDate(e.scheduled_confirmation_date)}</span></td>
      </tr>`).join("");
    confirmHtml = `
    <div class="section-gap card">
      <div class="card-header">
        <div class="card-icon" style="background:var(--warn-lt)">⚠️</div>
        <div><div class="card-title">Confirmations Due This Month</div>
        <div class="card-sub">${d.confirmations_due.length} employee${d.confirmations_due.length!=1?"s":""} due for confirmation</div></div>
      </div>
      <div class="tbl-scroll">
        <table><thead><tr><th>Name</th><th>Designation</th><th>Department</th><th>Joined</th><th>Due Date</th></tr></thead>
        <tbody>${rows}</tbody></table>
      </div>
    </div>`;
  }

  // ── Employee roster ─────────────────────────────────────────
  const recent = d.recent_employees || [];
  const rosterRows = recent.map(e => `
    <tr>
      <td class="fw-600">${e.employee_name}</td>
      <td>${e.designation || "—"}</td>
      <td>${e.department || "—"}</td>
      <td>${e.gender || "—"}</td>
      <td>${fmtDate(e.date_of_joining)}</td>
    </tr>`).join("");
  const rosterHtml = rosterRows ? `
  <div class="section-gap card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--primary-lt)">👥</div>
      <div><div class="card-title">Employee Roster</div>
      <div class="card-sub">Active employees sorted by joining date</div></div>
    </div>
    <div class="tbl-scroll">
      <table><thead><tr><th>Name</th><th>Designation</th><th>Department</th><th>Gender</th><th>Date of Joining</th></tr></thead>
      <tbody>${rosterRows}</tbody></table>
    </div>
  </div>` : "";

  // ── Pending approvals (org-wide) ────────────────────────────
  let orgPendingHtml = "";
  if (oh.pending_approvals > 0) {
    orgPendingHtml = `
    <div class="notice-bar">
      ⏳ ${oh.pending_approvals} leave application${oh.pending_approvals!=1?"s":""} pending org-wide.
      <a href="/hrms/leaves/leave-application?status=Open" style="margin-left:8px;font-weight:700">Review →</a>
    </div>`;
  }

  // ── Designation distribution ────────────────────────────────
  const desigs = d.desig_distribution || [];
  const maxDes = desigs.reduce((m,r) => Math.max(m, r.count), 1);
  const desigRows = desigs.map((r,i) => `
    <div class="bar-row">
      <div class="bar-row-label" title="${r.designation}">${r.designation}</div>
      <div class="bar-row-track">
        <div class="bar-row-fill" style="width:${Math.round(r.count/maxDes*100)}%;background:${deptColors[(i+1)%deptColors.length]}">${r.count>1?r.count:""}</div>
      </div>
      <div class="bar-row-val">${r.count}</div>
    </div>`).join("");
  const desigHtml = `
  <div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:var(--warn-lt)">🏅</div>
      <div class="card-title">Designation Distribution</div>
    </div>
    <div class="card-body bar-chart">${desigRows || "No data"}</div>
  </div>`;

  const hrSelfServiceHtml = `
  <a href="/hrms-employee" style="display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 20px;margin-bottom:20px;text-decoration:none;color:var(--text);box-shadow:var(--shadow);transition:border-color .15s" onmouseover="this.style.borderColor='var(--primary)'" onmouseout="this.style.borderColor='var(--border)'">
    <div style="font-size:26px;line-height:1">📱</div>
    <div style="flex:1">
      <div style="font-size:13px;font-weight:700">My Self-Service Portal</div>
      <div style="font-size:11px;color:var(--text2);margin-top:2px">Switch to employee view — check in/out, apply leave, view payslips</div>
    </div>
    <div style="font-size:18px;color:var(--text3)">›</div>
  </a>`;

  return `
  ${hrSelfServiceHtml}
  ${orgPendingHtml}
  <div class="section-title">Executive KPIs</div>
  ${kpiCards}
  <div class="section-gap grid-2">
    ${orgHealthHtml}
    ${genderHtml}
  </div>
  <div class="section-gap grid-3">
    ${deptHtml}
    ${locHtml}
    ${desigHtml}
  </div>
  ${trendHtml ? `<div class="section-gap">${trendHtml}</div>` : ""}
  ${confirmHtml}
  ${rosterHtml}`;
}

/* ══════════════════════════════════════════════════════════════
   LEAVE ACTIONS
   ══════════════════════════════════════════════════════════════ */
function buildApprovalCard(a) {
  const days = a.total_leave_days;
  return `
  <div class="appr-card" id="appr-${a.name}">
    <div class="appr-header">
      <div>
        <div class="appr-name">${a.employee_name}</div>
        <div class="appr-meta">${a.leave_type} · ${fmtDate(a.from_date)} → ${fmtDate(a.to_date)} · ${days} day${days!=1?"s":""}</div>
        ${a.department ? `<div class="appr-meta" style="margin-top:2px">${a.department}</div>` : ""}
      </div>
      <span class="badge-status s-open">Open</span>
    </div>
    ${a.description ? `<div class="appr-note">"${a.description}"</div>` : ""}
    <div class="appr-actions">
      <button class="btn-approve" onclick="leaveAction('${a.name}','approve',this)">Approve</button>
      <button class="btn-reject"  onclick="leaveAction('${a.name}','reject',this)">Reject</button>
    </div>
  </div>`;
}

function leaveAction(leaveId, action, btn) {
  const card = document.getElementById("appr-" + leaveId);
  const btns = card.querySelectorAll("button");
  btns.forEach(b => b.disabled = true);
  btn.textContent = action === "approve" ? "Approving…" : "Rejecting…";

  api("action_leave", { leave_id: leaveId, action }, result => {
    const label = result.status || (action === "approve" ? "Approved" : "Rejected");
    const cls   = action === "approve" ? "s-approved" : "s-rejected";
    card.innerHTML = `
      <div class="appr-header">
        <div>
          <div class="appr-name">${card.querySelector(".appr-name")?.textContent || leaveId}</div>
        </div>
        <span class="badge-status ${cls}">${label}</span>
      </div>`;
  }, err => {
    btns.forEach(b => b.disabled = false);
    btn.textContent = action === "approve" ? "Approve" : "Reject";
    const msg = (err && err.exc_type) ? err.exc_type : "Action failed. Try again.";
    alert(msg);
  });
}

/* ── start ─────────────────────────────────────────────────── */
document.addEventListener("DOMContentLoaded", function() { boot(); });
</script>
