<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organogram Prototype</title>
<!--
  Slice 064 prototype v1, hrms-ux-designer, 21 Oct 2026.
  Every person's name is invented (Sample). The SHAPE follows DTC on 21 Oct 2026:
  90 seats, 364 places, 445 active people, 363 of them in a seat, 19 with no
  reporting manager, one top seat with 22 seats under it, three rows deep.
  Not production code. Tokens copied from design_system.html.
-->
<style>
:root{--bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;--primary:#5B4B8A;--primary-h:#4A3D73;--primary-lt:#EDEAF4;--green:#1B7F5A;--green-lt:#E8F4EF;--red:#B3261E;--red-lt:#FBEAE8;--amber:#9A6510;--amber-lt:#FBF1E0;--sh1:0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.10);--sh3:0 12px 32px rgba(0,0,0,.16);--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;--r:10px;--r-sm:6px;--fs-sm:12px;--fs-base:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:24px}
[data-theme=dark]{--bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;--primary:#A99AD4;--primary-h:#BBAEE0;--primary-lt:#2A2438;--green:#5DBF97;--green-lt:#12332A;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;--sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:var(--fs-base);line-height:1.45}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* review scaffolding: wraps, never sticky (ux-learnings checklist) */
.demo{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;background:var(--surface2);border-bottom:1px solid var(--border);font-size:var(--fs-sm)}
.demo b{font-weight:700}
.demo label{display:flex;gap:6px;align-items:center}
.demo select{font:inherit;padding:4px 6px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);min-height:32px}
.sample{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.02em;background:var(--amber-lt);color:var(--amber);padding:1px 8px;border-radius:999px}

.app{max-width:1440px;margin:0 auto;padding:24px 28px 60px}
.app.is-phone{max-width:390px;padding:14px 12px 60px;border-left:1px solid var(--border);border-right:1px solid var(--border);min-height:100vh;background:var(--bg)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:var(--fs-xl);margin:0}
.sub{color:var(--text3);margin-top:2px}
.asat{color:var(--text3);font-size:var(--fs-sm);margin:0 0 10px}
.btn{border:1px solid var(--border2);background:var(--surface);border-radius:var(--r-sm);padding:6px 12px;min-height:32px;cursor:pointer}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
[data-theme=dark] .btn.primary{color:#1A1815}
.btn.link{border:0;background:none;color:var(--primary);padding:4px 2px;text-decoration:underline;min-height:28px}
.is-phone .btn{min-height:44px}
.is-phone .btn.link{min-height:44px}

/* tiles: the questions, answered first */
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tile{border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--r);padding:8px 14px;min-width:132px;background:var(--surface);text-align:left}
button.tile{cursor:pointer}
button.tile:hover{box-shadow:var(--sh2)}
.tile .n{font-size:var(--fs-lg);font-weight:700}
.tile .l{font-size:var(--fs-sm);color:var(--text2)}
.tile.amber{border-left-color:var(--amber)}
.tile.info{border-left-color:var(--primary)}
.is-phone .tiles{display:grid;grid-template-columns:1fr 1fr}
.is-phone .tile{min-width:0;min-height:44px}

/* toolbar: View is one always-visible control, outside the filters */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;margin-bottom:10px}
.fld .lab{font-size:var(--fs-sm);color:var(--text2);font-weight:600;margin-bottom:4px}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:var(--r-sm);overflow:hidden;background:var(--surface)}
.seg button{border:0;border-right:1px solid var(--border2);background:none;padding:6px 12px;min-height:32px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--primary-lt);color:var(--primary);font-weight:700}
.is-phone .seg{display:grid;grid-template-columns:1fr 1fr;width:100%}
.is-phone .seg button{min-height:44px;border-bottom:1px solid var(--border2)}
.is-phone .fld{width:100%}
.find{position:relative}
.find input{font:inherit;font-size:16px;padding:6px 10px;min-height:32px;width:280px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
.is-phone .find input{width:100%;min-height:44px}
.hits{position:absolute;top:calc(100% + 4px);left:0;width:340px;max-height:320px;overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh3);z-index:30}
.is-phone .hits{width:100%}
.hit{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;cursor:pointer;min-height:40px}
.hit:hover,.hit:focus{background:var(--surface2)}
.hit .t{color:var(--text3);font-size:var(--fs-sm)}
.hits .none{padding:10px 12px;color:var(--text2)}

.filters{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);margin-bottom:12px}
.filters summary{padding:8px 12px;cursor:pointer;font-weight:600;min-height:32px}
.is-phone .filters summary{min-height:44px;display:flex;align-items:center}
.filters .in{display:flex;flex-wrap:wrap;gap:10px;padding:0 12px 12px}
.filters select{font:inherit;font-size:16px;padding:4px 8px;min-height:32px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text)}
.is-phone .filters select{min-height:44px;width:100%}
.is-phone .filters .fld{width:100%}
.focusline{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--primary-lt);border-radius:var(--r-sm);padding:6px 12px;margin-bottom:10px}

/* the chart: same boxes and connectors as ocRender */
.chartwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface);padding:16px 8px 28px}
.chart{display:flex;justify-content:center;align-items:flex-start;gap:16px;min-width:max-content;margin:0 auto;position:relative}
.sibwrap{position:relative;padding-top:22px;display:flex;flex-direction:column}
.sibwrap::before{content:"";position:absolute;top:0;left:50%;width:1px;height:22px;background:var(--border2)}
.sibs{border:1px solid var(--border2);border-radius:var(--r);padding:6px 6px 12px}
.chart>.nomgr-slot{position:absolute;top:0;right:0}
.sibhead{text-align:center;font-size:var(--fs-sm);font-weight:700;color:var(--text2)}
.siblab{font-size:var(--fs-sm);color:var(--text2);margin:10px 4px 6px}
.sibgrid{display:grid;grid-template-columns:repeat(var(--cols,5),208px);gap:14px;justify-content:center}
.strip{margin-top:26px;border-top:2px solid var(--primary);padding-top:6px;display:flex;flex-direction:column;align-items:center}
.striphead{font-size:var(--fs-sm);color:var(--text2)}
.box.opened{outline:2px solid var(--primary);outline-offset:2px}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.links path{fill:none;stroke:var(--primary);stroke-width:1.5}
.br{display:flex;flex-direction:column;align-items:center;position:relative}
.kids{display:flex;align-items:flex-start;padding-top:22px;position:relative}
.kids::before{content:"";position:absolute;top:0;left:50%;width:1px;height:11px;background:var(--border2)}
.kids>.br{padding:0 7px}
.kids>.br::before{content:"";position:absolute;top:-11px;left:50%;width:1px;height:11px;background:var(--border2)}
.kids>.br::after{content:"";position:absolute;top:-11px;left:0;right:0;height:1px;background:var(--border2)}
.kids>.br:first-child::after{left:50%}
.kids>.br:last-child::after{right:50%}
.kids>.br:only-child::after{display:none}
.box{display:block;width:208px;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r);padding:9px 11px;cursor:pointer;box-shadow:var(--sh1)}
.box:hover{box-shadow:var(--sh2)}
.box.root{border-color:var(--primary);border-left-color:var(--primary)}
.box.amber{border-left-color:var(--amber)}
.box.dashed{border-style:dashed;background:transparent}
.box.dim{opacity:.45}
.box.focus{outline:3px solid var(--primary);outline-offset:3px}
.box .ti{font-weight:700;font-size:var(--fs-md);line-height:1.25}
.box .su{color:var(--text3);font-size:var(--fs-sm)}
.box .who{margin-top:5px;font-size:var(--fs-sm);color:var(--text2)}
.box .roll{margin-top:6px;font-size:var(--fs-sm);color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--text2);line-height:1.6}
.chip.amber{background:var(--amber-lt);color:var(--amber)}
.chip.green{background:var(--green-lt);color:var(--green)}
.chip.info{background:var(--primary-lt);color:var(--primary)}
.fold{margin-top:6px;border:1px solid var(--border2);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:var(--fs-sm);cursor:pointer;min-height:28px;max-width:236px}
.fold:hover{background:var(--surface2)}
.stackwrap{padding-top:18px;position:relative;display:flex;justify-content:center}
.stackwrap::before{content:"";position:absolute;top:0;left:50%;width:1px;height:18px;background:var(--border2)}
.stackwrap.below::before{border-left:1px dashed var(--border2);background:none}
.orow.dim{opacity:.45}
.orow.focus{outline:3px solid var(--primary);outline-offset:1px}
.stack{width:468px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:8px;box-shadow:var(--sh1)}
.stack .sh{font-size:var(--fs-sm);color:var(--text2);font-weight:600;padding:2px 4px 6px}
.stack .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.srow{display:block;width:100%;text-align:left;border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);padding:5px 8px;cursor:pointer;min-height:36px}
.srow:hover{background:var(--surface2)}
.srow.amber{border-left-color:var(--amber)}
.srow.dim{opacity:.45}
.srow.focus{outline:3px solid var(--primary);outline-offset:1px}
.srow .t1{font-weight:600}
.srow .t2{font-size:var(--fs-sm);color:var(--text3)}

/* list */
table{border-collapse:collapse;width:100%;background:var(--surface)}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:var(--fs-sm);color:var(--text2);position:sticky;top:0;background:var(--surface2)}
td.num,th.num{text-align:right}
.listwrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;max-height:640px}

/* phone outline: one level at a time */
.outline .here{background:var(--surface);border:1px solid var(--primary);border-radius:var(--r);padding:12px;margin-bottom:10px}
.orow{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border2);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;min-height:56px;cursor:pointer}
.orow.amber{border-left-color:var(--amber)}
.orow.dashed{border-style:dashed}
.orow .t1{font-weight:700;font-size:var(--fs-md)}
.orow .t2{font-size:var(--fs-sm);color:var(--text2)}
.orow .chev{font-size:var(--fs-lg);color:var(--text3)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
.sheet{position:fixed;top:0;right:0;bottom:0;width:460px;max-width:100%;background:var(--surface);z-index:41;box-shadow:var(--sh3);display:flex;flex-direction:column}
.sheet.phone{left:50%;transform:translateX(-50%);width:390px;top:auto;max-height:88vh;border-radius:14px 14px 0 0}
.sheet .sh-h{display:flex;justify-content:space-between;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.sheet h2{font-size:var(--fs-lg);margin:0}
.sheet .sh-b{padding:14px 16px;overflow:auto}
.sheet .sh-f{padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.prow{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--border)}
.note{background:var(--surface2);border-radius:var(--r-sm);padding:10px 12px;margin:10px 0}
.note.amber{background:var(--amber-lt)}
.note.info{background:var(--primary-lt)}
.note.ok{background:var(--green-lt)}
.note h3{font-size:var(--fs-base);margin:0 0 4px}
.note ul{margin:6px 0 0;padding-left:18px}
.facts{display:flex;gap:16px;flex-wrap:wrap;margin:6px 0 10px}
.facts b{font-size:var(--fs-lg)}
.skel{background:linear-gradient(90deg,var(--surface2),var(--border),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);height:64px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skel{animation:none}}
.err{border:1px solid var(--border);border-left:3px solid var(--red);background:var(--surface);border-radius:var(--r);padding:16px}
.printhead{display:none}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:var(--r-sm);z-index:60}
@media print{
  .demo,.toolbar,.filters,.scrim,.sheet,.fold,.private,.focusline,.toast,.noprint{display:none!important}
  .printhead{display:block;margin-bottom:8px;font-size:12px}
  .chartwrap{overflow:visible;border:0}
  .box.dim{opacity:1}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="demo" id="demo" aria-label="Prototype controls, not part of the product">
  <b>Prototype controls</b>
  <label>Person <select id="d-persona">
    <option value="hr">HR Manager</option>
    <option value="cxo">Owner (CXO)</option>
    <option value="head">Store head, Delhi</option>
  </select></label>
  <label>Device <select id="d-device"><option value="desk">Desktop 1440</option><option value="phone">Phone 390</option></select></label>
  <label>Theme <select id="d-theme"><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label>Window <select id="d-win"><option value="1128">1440 portal (frame 1,128)</option><option value="970">1280 portal (frame 970)</option><option value="820">1024 portal (frame 820)</option><option value="">Prototype full width</option></select></label>
  <label>State <select id="d-state"><option value="ok">Loaded</option><option value="loading">Loading</option><option value="error">Could not load</option></select></label>
  <span class="sample">Sample</span> <span>Every name is invented, and so are the one leaving date, the new hire and the replacement plan. The shape follows DTC on 21 Oct 2026: 90 seats, 445 people. "Print this view" is shown for you to judge; it is a "later" item.</span>
</div>

<main class="app" id="app"></main>
<div id="layer"></div>

<script>
"use strict";
/* ---------- data: DTC's shape, invented names ---------- */
var BRN = {CH34:"Chandigarh Sector 34", CH22:"Chandigarh Sector 22", DEL:"Delhi", NOI:"Noida", AMB:"Ambala", PITS:"DTC - PITAMPURA", PIT:"Pitampura"};
var ROWS = [], SEQ = 0;
function S(id, title, br, dept, seats, filled, parent) {
  ROWS.push({id: id || ("s" + (++SEQ)), title: title, branch: br, dept: dept, seats: seats,
             filled: filled == null ? seats : filled, parent: parent, people: []});
}
S("own", "Owner", "CH34", "Management", 1, 1, null);
S("amb", "Admin", "AMB", "Admin", 1, 1, "own");
S("bo", "Back Office", "CH34", "Back Office", 36, 36, "own");
S("fm22", "FM", "CH22", "Management", 3, 3, "own");
S("del", "Manager", "DEL", "Management", 1, 1, "own");
S("noi", "S-RE Manager", "NOI", "Management", 1, 1, "own");
S("cfo", "Chief Finance Officer", "CH34", "Management", 1, 1, "own");
function many(parent, br, list) {
  list.forEach(function (a) { S(null, a[0], a[4] || br, a[1], a[2], a[3], parent); });
}
many("own", "CH34", [["CRM","Sales",6,6,"CH22"],["Data Analyst","Back Office",1],["EA","Admin",1],["FSE","Sales",2,2,"CH22"],["HR Head","HR",1],["HR Recruiter","HR",1],["Insta Team","Marketing",1],["Liaisoner","Back Office",1],["MIS","Back Office",2],["MIS Executive","Back Office",1],["Network Engineer","IT",1],["Office Executive","Back Office",6],["Payrol Executive","Payroll",1],["Payroll","HR",1],["Process Coordinator","Back Office",2],["Reconcile","Accounts",2]]);
many("amb", "AMB", [["Bangle","Sales",5],["Cashier","Sales",3],["Chain + MS","Sales",4],["Earring","Sales",4],["FSE","Sales",7],["Floor Manager","Management",2],["Greeter","Sales",2,1],["Housekeeping","Back Office",8],["Karigar","Production",2],["Kitty + PDT","Sales",4],["Necklace","Sales",5],["RSO","Sales",1],["Ring","Sales",4],["Sales Representative","Sales",2]]);
many("bo", "CH34", [["Accountant","Accounts",5],["Backoffice Executive","Back Office",1],["Driver","Back Office",6],["Housekeeping","Back Office",13],["Mali","Back Office",1],["Merchandiser","Sales",1],["Pantry","Admin",1],["S-CK Operation","Back Office",1],["S-CK Repair","Back Office",1],["Tagging","Back Office",4]]);
many("fm22", "CH22", [["Bangle","Sales",9],["Cashier","Back Office",1],["Cashier","Sales",9],["Chain","Sales",5],["Earring","Sales",5],["Greeter","Sales",3],["Karigar","Production",3],["Pantry","Admin",2],["RSO","Sales",6],["Ring","Sales",11],["Runner","Sales",3],["Set","Sales",11],["Unspecified","",1,1,"CH34"]]);
many("del", "DEL", [["Admin","Admin",1],["Bangle","Sales",4],["Cashier","Accounts",1,1,"PITS"],["Cashier","Sales",4],["Chain + MS + PDT","Sales",8],["Earring + Ring","Sales",10],["FM","Management",2],["FSE","Back Office",1],["FSE","Sales",1],["Governor","Management",2],["Housekeeping","Back Office",9],["Karigar","Production",1],["RSO","Back Office",2,2,"PITS"],["RSO","Back Office",3],["RSO","Sales",10,10,"PITS"],["RSO","Sales",4],["SI","Back Office",1,1,"PITS"],["SR. RSO","Back Office",1],["Set","Sales",10]]);
many("noi", "NOI", [["Admin","Admin",1],["CRM","Sales",1],["Cashier","Sales",3],["FSE","Sales",1],["Floor Manager","Management",1],["Governor","Management",2],["Housekeeping","Back Office",12],["Karigar","Production",1],["RSO","Sales",31],["Sales Representative","Sales",1],["Section Incharge","Management",5]]);

var FIRST = ["Aarti","Rohit","Simran","Gurpreet","Neha","Vikas","Pooja","Harpreet","Anil","Kiran","Manpreet","Sunil","Ritu","Deepak","Jaspreet","Meena","Rajesh","Sonia","Amit","Navneet","Priya","Sandeep","Komal","Ravi","Shalini","Tarun","Babita","Mohit","Seema","Arjun","Lovepreet","Nisha"];
var LAST = ["Sharma","Verma","Singh","Kaur","Gupta","Arora","Bansal","Malhotra","Sethi","Chopra","Mehta","Kapoor","Saini","Rana","Bhatia","Grover","Ahuja","Khanna","Gill","Sood","Dhillon"];
var NI = 0;
function nm() { var i = NI++; return FIRST[i % FIRST.length] + " " + LAST[(i * 7 + Math.floor(i / 21)) % LAST.length]; }
var BYID = {};
ROWS.forEach(function (r) {
  BYID[r.id] = r;
  for (var i = 0; i < r.filled; i++) r.people.push({name: nm()});
});
function find(title, br) { return ROWS.filter(function (r) { return r.title === title && r.branch === br; })[0]; }
/* Sample states the task asked for */
find("Accountant", "CH34").people[0].hire = "14 Oct";          // filled by a recent hire
find("Floor Manager", "NOI").people[0].leaving = "30 Nov";     // working their notice
find("RSO", "NOI").people[4].plan = {on: "18 Oct", until: "16 Jan 2027", why: "Has said they may leave"};
BYID.cfo.mismatch = [["Back Office · Chandigarh Sector 34",6],["Office Executive",4],["Reconcile",2],["Payrol Executive",1],["Payroll",1],["Data Analyst",1],["Network Engineer",1],["MIS",1],["Accountant",1]];
BYID.bo.mixed = [["the Back Office head, who is in this seat too",28],["the Chief Finance Officer",6],["the Owner",2]];

/* 82 active people in no seat; 19 of them with no reporting manager */
var UNSEATED = [];
(function () {
  var titles = [], brs = [];
  [["RSO",38],["FSE",23],["Cashier",6],["Greeter",4],["Back Office",4],["SI",2],["CRM",2],["Runner",1],["Karigar",1],["Admin",1]].forEach(function (t) { for (var i = 0; i < t[1]; i++) titles.push(t[0]); });
  [["PIT",35],["NOI",20],["DEL",9],["CH22",9],["CH34",5],["AMB",4]].forEach(function (b) { for (var i = 0; i < b[1]; i++) brs.push(b[0]); });
  var noMgr = {RSO:5, FSE:5, "Back Office":4, CRM:2, SI:1, Admin:1, Greeter:1};

  t.push(tile(fill ? fill + " to fill" : "None to fill", fill ? "Show these seats" : "Every seat is filled", fill ? "amber" : "", fill ? "show-fill" : null));
  t.push(tile(lv ? lv + " leaving" : "Nobody leaving", lv ? "in the next 60 days" : "in the next 60 days", lv ? "amber" : "", lv ? "show-leaving" : null));
  if (!P().scope) {
    t.push(tile(UNSEATED.length + " in no seat", "Not on this chart yet", "amber", "unseated"));
    t.push(tile(NOMGR.length + " no manager", "No reporting manager", "amber", "nomgr"));
  }
  if (P().plan) t.push(tile(pl + " replacement planned", "Only HR sees this", "info private", pl ? "show-plan" : null));
  return '<div class="tiles">' + t.join("") + "</div>";
}

/* ---------- page ---------- */
function render() {
  var app = document.getElementById("app");
  app.className = "app" + (ST.phone ? " is-phone" : "");
  app.style.maxWidth = !ST.phone && val("d-win") ? (+val("d-win") + 58) + "px" : ""; app.style.marginLeft = app.style.maxWidth ? "auto" : ""; app.style.marginRight = app.style.maxWidth ? "0" : "";
  document.documentElement.setAttribute("data-theme", val("d-theme"));
  var h = '<div class="head"><div><h1>Positions</h1><div class="sub">'
    + (P().scope ? "Your part of the organisation: Manager · Delhi and the seats under it." : "Every seat in the organisation, who is in it, and which are empty.")
    + "</div></div>" + (P().edit ? '<button type="button" class="btn primary" data-act="toast" data-msg="Opens today\'s Add a seat dialog. Unchanged in this slice.">+ Add a seat</button>' : "") + "</div>";
  if (ST.state === "loading") {
    app.innerHTML = h + '<p class="asat" role="status">Loading the seats&hellip;</p><div class="tiles">' + '<div class="skel" style="width:140px"></div>'.repeat(4) + '</div><div class="skel" style="height:260px"></div>';
    return;
  }
  if (ST.state === "error") {
    app.innerHTML = h + '<div class="err" role="alert"><strong>We could not load the seats.</strong><p>Check your connection, then try again. Nothing you changed is lost.</p><button type="button" class="btn" data-act="retry">Try again</button></div>';
    return;
  }
  h += '<p class="asat">Figures as at 21 Oct 2026, 09:40. Names are Sample.</p>' + tilesHTML();

  /* View: one control, always shown, never among the filters */
  var views = [["reporting", "Reporting lines"], ["branch", "By branch"], ["dept", "By department"], ["list", "List"]];
  h += '<div class="toolbar"><div class="fld"><div class="lab" id="lab-view">View</div><div class="seg" role="group" aria-labelledby="lab-view">'
    + views.map(function (v) { return '<button type="button" data-act="view" data-v="' + v[0] + '" aria-pressed="' + (ST.view === v[0]) + '">' + v[1] + "</button>"; }).join("")
    + "</div></div>";
  h += '<div class="fld find"><label class="lab" for="q">Find a person or a seat</label><input id="q" type="search" autocomplete="off" placeholder="Type a name or a seat, e.g. RSO" value="' + esc(ST.q) + '"><div id="hits"></div></div>';
  if (ST.view !== "list" && !ST.phone) {
    h += '<div class="fld"><div class="lab">&nbsp;</div><button type="button" class="btn" data-act="all">' + (ST.all ? "Fold back to two levels" : "Open every level") + "</button></div>";
  }
  if (!ST.phone) h += '<div class="fld"><div class="lab">&nbsp;</div><button type="button" class="btn" data-act="print">Print this view</button></div>';
  h += "</div>";

  /* filters, folded by default: the chart is the point */
  var brs = {}; visible().forEach(function (r) { brs[r.branch] = 1; });
  h += '<details class="filters"' + (anyFilter() ? " open" : "") + '><summary>Filters' + (anyFilter() ? " (on)" : "") + '</summary><div class="in">'
    + '<div class="fld"><label class="lab" for="f-br">Branch</label><select id="f-br"><option value="">All branches</option>'
    + Object.keys(brs).sort().map(function (b) { return '<option value="' + b + '"' + (ST.fBranch === b ? " selected" : "") + ">" + esc(shortB(b)) + "</option>"; }).join("") + "</select></div>"
    + '<div class="fld"><label class="lab" for="f-show">Show</label><select id="f-show"><option value="">Every seat</option><option value="fill"' + (ST.fShow === "fill" ? " selected" : "") + '>Only seats with places to fill</option><option value="leaving"' + (ST.fShow === "leaving" ? " selected" : "") + '>Only seats where somebody is leaving</option>'
    + (P().plan ? '<option value="plan"' + (ST.fShow === "plan" ? " selected" : "") + ">Only seats with a replacement planned</option>" : "") + "</select></div>"
    + (anyFilter() ? '<div class="fld"><div class="lab">&nbsp;</div><button type="button" class="btn" data-act="clear">Reset view</button></div>' : "")
    + '<p class="asat" style="flex-basis:100%;margin:0">On the chart, seats that do not match are greyed, and the path to every match opens.</p></div></details>';

  if (ST.focus) {
    var f = BYID[ST.focus];
    h += '<div class="focusline" role="status">Showing <strong>' + esc(ST.focusLabel || f.title) + "</strong>&nbsp;in " + esc(f.title + " · " + shortB(f.branch)) + '. <button type="button" class="btn link" data-act="unfocus">Clear</button></div>';
  }

  if (ST.view === "list") h += listHTML();
  else if (ST.phone) h += outlineHTML();
  else h += chartHTML();
  app.innerHTML = h;
  wireInputs();
  var cw = document.querySelector(".chartwrap");
  if (cw) cw.style.setProperty("--cols", Math.max(1, Math.min(5, Math.floor((cw.clientWidth - 16) / 222))));
  drawLinks();
  if (ST.focus && !ST.phone) {
    var el = document.getElementById("b-" + ST.focus);
    if (el) el.scrollIntoView({block: "center", inline: "center"});
  }
}
function wireInputs() {
  var q = document.getElementById("q");
  q.addEventListener("input", function () { ST.q = q.value; paintHits(); });
  q.addEventListener("keydown", function (e) { if (e.key === "Escape") { ST.q = ""; q.value = ""; paintHits(); } });
  document.getElementById("f-br").addEventListener("change", function (e) { ST.fBranch = e.target.value; ST.trail = []; render(); });
  document.getElementById("f-show").addEventListener("change", function (e) { ST.fShow = e.target.value; ST.trail = []; render(); });
}
function paintHits() {
  var box = document.getElementById("hits"), q = ST.q.trim().toLowerCase();
  if (q.length < 2) { box.innerHTML = ""; return; }
  var out = [];
  visible().forEach(function (r) {
    if (r.title.toLowerCase().indexOf(q) > -1) out.push({id: r.id, a: r.title, b: shortB(r.branch) + " · " + r.filled + " of " + r.seats + " filled"});
    r.people.forEach(function (p) { if (p.name.toLowerCase().indexOf(q) > -1) out.push({id: r.id, who: p.name, a: p.name, b: r.title + " · " + shortB(r.branch)}); });
  });
  if (!P().scope) UNSEATED.forEach(function (p) { if (p.name.toLowerCase().indexOf(q) > -1) out.push({unseated: true, a: p.name, b: "In no seat yet · " + p.title + " · " + shortB(p.branch)}); });
  var shown = out.slice(0, 12);
  box.innerHTML = '<div class="hits" role="listbox" aria-label="Matches">' + (shown.length ? shown.map(function (x) {
    return '<button type="button" class="hit" role="option" data-act="' + (x.unseated ? "unseated" : "pick") + '" data-id="' + (x.id || "") + '" data-who="' + esc(x.who || "") + '"><div>' + esc(x.a) + '</div><div class="t">' + esc(x.b) + "</div></button>";
  }).join("") + (out.length > 12 ? '<div class="none">' + (out.length - 12) + " more. Type more of the name.</div>" : "")
  : '<div class="none">No seat or person called that' + (P().scope ? " in your part of the organisation" : "") + ".</div>") + "</div>";
}

/* ---------- sheets ---------- */
function sheet(title, body, foot) {
  var L = document.getElementById("layer");
  L.innerHTML = '<div class="scrim" data-act="close"></div><div class="sheet' + (ST.phone ? " phone" : "") + '" role="dialog" aria-modal="true" aria-labelledby="sh-t">'
    + '<div class="sh-h"><h2 id="sh-t" tabindex="-1">' + title + '</h2><button type="button" class="btn" data-act="close" aria-label="Close">Close</button></div>'
    + '<div class="sh-b">' + body + "</div>" + (foot ? '<div class="sh-f">' + foot + "</div>" : "") + "</div>";
  document.getElementById("sh-t").focus();
}
function closeSheet() { document.getElementById("layer").innerHTML = ""; ST.sheet = null; }
function seatSheet(id, flash) {
  var r = BYID[id]; ST.sheet = {kind: "seat", id: id};
  var parent = r.parent && BYID[r.parent] ? BYID[r.parent].title + " · " + shortB(BYID[r.parent].branch) : "nobody (top of the chart)";
  var b = '<div class="sub">' + esc(shortB(r.branch) + " · " + (r.dept || "No department")) + " · reports to " + esc(parent) + "</div>"
    + '<div class="facts"><div><b>' + r.filled + " of " + r.seats + '</b><div class="sub">filled</div></div><div><b>' + (open(r) || "None") + '</b><div class="sub">to fill</div></div></div>';
  if (flash) b += '<div class="note ok" role="status">' + flash + "</div>";
  if (P().records && r.mismatch) {
    b += '<div class="note info"><h3>18 people report to this person on their employee records</h3>Their seats sit under other seats on this chart, so nobody shows under this box:<ul>'
      + r.mismatch.map(function (m) { return "<li>" + esc(m[0]) + ": " + m[1] + "</li>"; }).join("") + "</ul>"
      + (P().edit ? '<p style="margin:8px 0 0">To fix it, open each seat and set <strong>Reports to</strong> to this seat. A seat shared with another manager\'s people needs splitting first.</p>' : '<p style="margin:8px 0 0">HR can move these seats under this one.</p>') + "</div>";
  }
  if (P().records && r.mixed) {
    b += '<div class="note info"><h3>This seat holds the people of 3 managers</h3><ul>' + r.mixed.map(function (m) { return "<li>" + m[1] + " report to " + esc(m[0]) + "</li>"; }).join("")
      + "</ul>That is why it reads like one person with 35 others in their seat." + (P().edit ? " Give the head a seat of their own, then move each group under its own manager." : "") + "</div>";
  }
  b += '<h3 style="margin:14px 0 4px;font-size:var(--fs-base)">Who is in it</h3>';
  if (!r.people.length) b += '<p class="sub">Nobody is in this seat.</p>';
  b += '<div style="max-height:340px;overflow:auto">' + r.people.map(function (p, i) {
    var c = "";
    if (p.hire) c += ' <span class="chip green">Joined ' + p.hire + ", hired for this seat</span>";
    if (p.leaving) c += ' <span class="chip amber">Leaving ' + p.leaving + "</span>";
    if (p.plan && P().plan) c += ' <span class="chip info private">Replacement planned until ' + p.plan.until + "</span>";
    var act = "";
    if (P().plan) act = p.plan ? '<button type="button" class="btn link private" data-act="unplan" data-id="' + id + '" data-i="' + i + '">Remove the plan</button>'
                               : '<button type="button" class="btn link private" data-act="plan" data-id="' + id + '" data-i="' + i + '">Plan a replacement</button>';
    return '<div class="prow"><div>' + esc(p.name) + c + "</div>" + act + "</div>";
  }).join("") + "</div>";
  var f = "";
  if (P().edit) {
    if (open(r)) f += '<button type="button" class="btn" data-act="toast" data-msg="Makes a job opening, not advertised, as Advertise it does today.">Advertise it</button>';
    f += '<button type="button" class="btn" data-act="toast" data-msg="Opens today\'s seat dialog. Unchanged in this slice.">Change this seat</button>';
  }
  if (!ST.phone && ST.view !== "list") f += '<button type="button" class="btn" data-act="pick" data-id="' + id + '">Show it on the chart</button>';
  sheet(esc(r.title), b, f);
}
function planSheet(id, i) {
  var p = BYID[id].people[i], first = p.name.split(" ")[0];
  ST.sheet = {kind: "plan", id: id, i: i};
  var b = '<p>A private note so HR can start finding cover before a seat empties. It is not a score, and nothing works it out for you.</p>'
    + '<div class="note info"><ul style="margin:0">'
    + "<li>Only people with the HR Manager role see it.</li>"
    + "<li>" + esc(first) + " does not see it on any screen, and neither does their manager.</li>"
    + "<li>It is never used in reviews, ratings or pay.</li>"
    + "<li>It ends by itself after 90 days unless HR renews it. It is erased when " + esc(first) + " leaves this seat.</li></ul></div>"
    + '<div class="fld" style="margin-top:10px"><label class="lab" for="why">Why (optional)</label><select id="why" style="font-size:16px;min-height:40px;width:100%"><option value="">Do not record a reason</option><option>Has said they may leave</option><option>Contract ends soon</option><option>Long leave expected</option></select>'
    + '<div class="sub" style="margin-top:4px">A short list on purpose: no free text about a person\'s private life.</div></div>';
  sheet("Plan a replacement for " + esc(p.name) + "?", b,
    '<button type="button" class="btn" data-act="back" data-id="' + id + '">Cancel</button><button type="button" class="btn primary" data-act="plansave" data-id="' + id + '" data-i="' + i + '">Save the plan</button>');
}
function offerSheet(id, i) {
  var p = BYID[id].people[i];
  ST.sheet = {kind: "offer", id: id, i: i};
  sheet("Start hiring now?", '<div class="note ok" role="status">Saved. A replacement is planned for ' + esc(p.name) + " until 19 Jan 2027.</div>"
    + "<p>We can make a job opening for " + esc(BYID[id].title + " · " + shortB(BYID[id].branch)) + " now. It is <strong>not advertised</strong>: it stays with HR until somebody publishes it.</p>"
    + '<div class="note amber"><h3>Before you do</h3>Anyone who can read job openings will see this one. If ' + esc(p.name.split(" ")[0]) + " might hear of it, wait.</div>",
    '<button type="button" class="btn" data-act="back" data-id="' + id + '">Not now</button><button type="button" class="btn primary" data-act="opening" data-id="' + id + '">Make an opening, not advertised</button>');
}
function noMgrSheet() {
  ST.sheet = {kind: "nomgr"};
  var b = "<p>These people have no reporting manager on their employee record, and no seat. Until they have one, nobody approves their leave, and they appear nowhere on this chart.</p>"
    + '<table><thead><tr><th>Name</th><th>Job role</th><th>Branch</th><th>Joined</th>' + (P().edit ? "<th></th>" : "") + "</tr></thead><tbody>"
    + NOMGR.map(function (p) { return "<tr><td>" + esc(p.name) + "</td><td>" + esc(p.title) + "</td><td>" + esc(shortB(p.branch)) + "</td><td>" + p.joined + "</td>" + (P().edit ? '<td><button type="button" class="btn link" data-act="toast" data-msg="Opens their employee record at Reports To. Already there in Frappe HR.">Set manager</button></td>' : "") + "</tr>"; }).join("")
    + "</tbody></table>";
  sheet("No reporting manager · " + NOMGR.length + " people", b, "");
}
function unseatedSheet() {
  ST.sheet = {kind: "unseated"};
  var by = {};
  UNSEATED.forEach(function (p) { (by[p.branch] = by[p.branch] || []).push(p); });
  var b = "<p>" + UNSEATED.length + " of 445 active people hold no seat, so they are not on this chart and not in the counts above. Most joined in the last two months.</p>";
  Object.keys(by).sort().forEach(function (br) {
    var list = by[br];
    b += '<h3 style="margin:14px 0 4px;font-size:var(--fs-base)">' + esc(shortB(br)) + " · " + list.length + "</h3>";
    if (br === "PIT") b += '<div class="note amber">There is no seat at Pitampura. The Pitampura seats use a second branch record, "DTC - PITAMPURA". HR should merge the two branch records, or move these people.</div>';
    var titles = {};
    list.forEach(function (p) { titles[p.title] = (titles[p.title] || 0) + 1; });
    b += "<ul>" + Object.keys(titles).map(function (t) {
      var seat = ROWS.filter(function (r) { return r.title === t && r.branch === br; })[0];
      return "<li>" + titles[t] + " " + esc(t) + (seat ? ' · matching seat: <button type="button" class="btn link" data-act="pick" data-id="' + seat.id + '">' + esc(seat.title + " · " + shortB(seat.branch)) + "</button> (" + seat.filled + " of " + seat.seats + ")" : " · no matching seat") + "</li>";
    }).join("") + "</ul>";
  });
  sheet("In no seat · " + UNSEATED.length + " people", b, "");
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var b = e.target.closest("[data-act]");
  if (!b) { if (!e.target.closest(".find")) { var h = document.getElementById("hits"); if (h) h.innerHTML = ""; } return; }
  var a = b.dataset.act, id = b.dataset.id;
  if (a === "view") { ST.view = b.dataset.v; ST.trail = []; ST.open = {}; render(); }
  else if (a === "cfold") { ST.copen[b.dataset.k] = b.getAttribute("aria-expanded") === "true" ? null : id; render(); }
  else if (a === "fold") {
    var path = onPath(); var depth = id.indexOf("h:") === 0 ? 1 : (ST.view === "reporting" && BYID[id] && !BYID[id].parent ? 0 : 1);
    ST.open[id] = !isOpen(id, depth, path); render();
  }
  else if (a === "all") { ST.all = !ST.all; ST.open = {}; render(); }
  else if (a === "seat") { seatSheet(id); }
  else if (a === "pick") {
    closeSheet(); ST.focus = id; ST.focusLabel = b.dataset.who || ""; ST.q = "";
    if (ST.view === "list") ST.view = "reporting";
    if (ST.phone) { ST.trail = []; var at = BYID[id].parent; var tr = []; while (at) { tr.unshift(at); at = BYID[at].parent; } ST.trail = ST.view === "reporting" ? tr.filter(function (x) { return !P().scope || visible().indexOf(BYID[x]) > -1; }) : []; }
    render();
  }
  else if (a === "unfocus") { ST.focus = null; render(); }
  else if (a === "down") { ST.trail.push(id); render(); window.scrollTo(0, 0); }
  else if (a === "up") { ST.trail.pop(); render(); }
  else if (a === "nomgr") { noMgrSheet(); }
  else if (a === "unseated") { unseatedSheet(); }
  else if (a === "show-fill") { ST.fShow = "fill"; render(); }
  else if (a === "show-leaving") { ST.fShow = "leaving"; render(); }
  else if (a === "show-plan") { ST.fShow = "plan"; render(); }
  else if (a === "clear") { ST.fBranch = ""; ST.fShow = ""; ST.open = {}; ST.all = false; render(); }
  else if (a === "print") { window.print(); }
  else if (a === "retry") { document.getElementById("d-state").value = "ok"; ST.state = "ok"; render(); }
  else if (a === "close") { closeSheet(); }
  else if (a === "plan") { planSheet(id, +b.dataset.i); }
  else if (a === "back") { seatSheet(id); }
  else if (a === "plansave") {
    var p = BYID[id].people[+b.dataset.i];
    p.plan = {on: "21 Oct", until: "19 Jan 2027", why: document.getElementById("why").value};
    render(); offerSheet(id, +b.dataset.i);
  }
  else if (a === "unplan") { delete BYID[id].people[+b.dataset.i].plan; render(); seatSheet(id, "Plan removed. It is erased, not hidden."); }
  else if (a === "opening") { seatSheet(id, 'Opening made: HR-OPN-2026-0007 <span class="sample">Sample</span>, not advertised. <a href="#" onclick="return false">Open it</a>'); }
  else if (a === "toast") { toast(b.dataset.msg); }
});
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && ST.sheet) closeSheet(); });
function toast(m) {
  var t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.textContent = m;
  document.body.appendChild(t); setTimeout(function () { t.remove(); }, 2600);
}
["d-persona", "d-device", "d-state"].forEach(function (id) { document.getElementById(id).addEventListener("change", function () { closeSheet(); reset(); render(); }); });
document.getElementById("d-theme").addEventListener("change", render);
document.getElementById("d-win").addEventListener("change", render);
reset(); render();
</script>
</body>
</html>
