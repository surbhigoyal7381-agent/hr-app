version: "3.8"

# ── Kinexus HRMS – test / production stack ──────────────────────────────────
#
# One immutable image, five process roles (ARCHITECTURE.md §5).
# Deployed by .github/workflows/deploy-environments.yml, which pins
# KINEXUS_IMAGE to a specific digest — this file never rebuilds anything.
#
#   docker compose --env-file ../envs/test.env --env-file .image.env up -d
#
# Differences from the legacy deploy/docker-compose.yml this replaces:
#   • gunicorn instead of `bench serve`                         (closes G1)
#   • developer_mode 0                                          (closes G2)
#   • immutable image instead of host bind-mounts + git pull    (closes G10)
#   • the vendored hrms fork is actually deployed               (closes G4)
#   • split web / socketio / scheduler / worker processes
#   • health checks on every service                            (closes G14)
#   • separate cache and queue Redis with correct policies      (§6.2)

x-app: &app
  image: ${KINEXUS_IMAGE:?set KINEXUS_IMAGE to a pinned image digest or tag}
  restart: unless-stopped
  working_dir: /home/frappe/frappe-bench
  environment:
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT:-3306}
    # Needed to PROVISION a tenant: creating a site means creating a database
    # and a database user, which needs root. Without it tenant_api had nothing
    # to pass to `bench new-site` and provisioning failed with "Access denied
    # for user 'root'" from deep inside MySQL.
    - DB_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
    - REDIS_CACHE=${REDIS_CACHE}
    - REDIS_QUEUE=${REDIS_QUEUE}
    - BASE_DOMAIN=${BASE_DOMAIN}
    - DEVELOPER_MODE=${DEVELOPER_MODE:-0}
    - MUTE_EMAILS=${MUTE_EMAILS:-0}
    # The web role's WSGI app (frappe.app) resolves sites against this dir;
    # without it, requests 404 with "alvox.in does not exist". (fix B6)
    - SITES_PATH=/home/frappe/frappe-bench/sites
  volumes:
    # The stateful part. In a multi-node deployment this MUST be a shared RWX
    # volume (EFS / Azure Files / Filestore) — see ARCHITECTURE.md §6.3.
    - sites:/home/frappe/frappe-bench/sites
  # Container logs had no size limit at all. They were NOT what filled the disk
  # on 2026-09-10 - the images were, 43 of them - but they are the other
  # unbounded thing writing to the same partition, and the worker's own log was
  # already 67 MB. Capped at 150 MB per container (3 files of 50 MB).
  # The cost: `docker logs --since` reaches back less far on a chatty container.
  logging:
    driver: json-file
    options:
      max-size: "50m"
      max-file: "3"
  depends_on:
    configurator:
      condition: service_completed_successfully
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy

# ── Why the two blocks below exist: 2026-09-10, nine silent days ────────────
#
# Both production workers stopped at 06:32 server time on 2026-09-10 and nobody
# found out until 2026-09-19. 700 jobs piled up on the `default` queue - every
# scheduled job alvoraa.co runs, plus the tidy-up work from provisioning two new
# tenants. The whole chain is proven from the docker daemon's own journal:
#
#   1. The 193 GB disk hit 100%. 43 tagged images at about 11 GB each. (The image
#      cleanup at the end of .github/workflows/deploy.yml was written for this.)
#   2. redis here runs `--appendonly yes`, so a full disk stops it accepting
#      WRITES. Every command came back:
#        MISCONF Errors writing to the AOF file: No space left on device
#   3. rq writes a heartbeat on every job and does not retry it. The error came
#      out of set_current_job_working_time -> connection.hset, rq logged
#      "found an unhandled exception, quitting", and both worker processes
#      exited - three seconds apart.
#   4. `restart: unless-stopped` on x-app above DID fire. The journal says:
#        restarting container ... restartCount=1 restartPolicy="{unless-stopped 0}"
#      and then, immediately:
#        restartmanger wait error: failed to mount : mkdir
#        /var/lib/docker/rootfs/overlayfs/...: no space left on device
#      A restart needs disk to mount a root filesystem. There was none. The
#      restart manager gave up and never tried again.
#   5. dockerd could not even record the failure:
#        failed saving state on start failure: write .../.tmp-config.v2.json:
#        no space left on device
#      so the container's saved state still said Running. THAT is why `docker ps`
#      reported "Up 12 days" for nine days while `docker top` on the same
#      container answered "container is not running".
#
# The lesson: a restart policy is necessary and was never sufficient. The
# container has to be able to SAY it is not working, and something outside
# docker has to look. So:
#
#   • the probes below make `docker ps` honest. They fail in all three shapes of
#     the 10 Sep failure - the exec cannot run at all (zombie container), redis
#     is unreachable or refusing writes, or the process is up but has no live
#     registration.
#   • scripts/check_workers.sh is the part that tells a human. The deploy runs it
#     as a gate, and .github/workflows/worker-health.yml runs it every 15 minutes
#     in between, which is the gap that let 10 Sep run for nine days.
#
# Docker does NOT restart a container for being unhealthy. These probes report;
# they never act. Anything that acts is a decision for a human, not for a
# healthcheck - see docs/slices/026-worker-health/07-devops-inputs.md.

# A worker is healthy when redis says THIS container has an rq worker with a
# heartbeat in the last 10 minutes. rq's own heartbeat TTL is about 7 minutes,
# so 10 leaves room for a slow job without going soft on a real death.
# Measured on production on 2026-09-19: 0.77 s per run including docker exec.
x-worker-healthcheck: &worker-healthcheck
  test:
    - CMD-SHELL
    - >-
      /home/frappe/frappe-bench/env/bin/python -c 'import os,socket,sys,time; from redis import Redis; from rq import Worker; me=socket.gethostname(); ok=any(w.hostname==me and w.last_heartbeat and time.time()-w.last_heartbeat.timestamp()<600 for w in Worker.all(connection=Redis.from_url(os.environ["REDIS_QUEUE"]))); sys.exit(0 if ok else 1)'
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 120s

# The scheduler only ENQUEUES; it registers no rq worker, so there is no
# heartbeat to read. This probe proves two narrower things, and says so plainly:
# the container can still run a process at all (the 10 Sep zombie could not), and
# redis is reachable and accepting commands from it (the 10 Sep MISCONF was not).
# It does NOT prove cron jobs are firing. Nothing cheap does; `bench doctor` in
# the deploy and the queue-depth check in scripts/check_workers.sh cover that.
x-scheduler-healthcheck: &scheduler-healthcheck
  test:
    - CMD-SHELL
    - >-
      /home/frappe/frappe-bench/env/bin/python -c 'import os,sys; from redis import Redis; sys.exit(0 if Redis.from_url(os.environ["REDIS_QUEUE"]).ping() else 1)'
  interval: 60s
  timeout: 20s
  retries: 3
  start_period: 120s

services:

  # ── Database + cache/queue on this host (fix B5) ─────────────────────────
  # Same images/args as the local dev stack (hrms/docker/docker-compose.yml).
  # For a multi-node deployment, replace with managed MariaDB + 2× Redis and
  # point DB_HOST / REDIS_CACHE / REDIS_QUEUE at them (see envs/*.env.example).
  mariadb:
    image: mariadb:10.8
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:alpine
    restart: unless-stopped
    # Single instance backs both the cache (DB 0) and the queue (DB 1). A
    # larger deployment should split these with different maxmemory policies
    # (cache: allkeys-lru no persistence; queue: noeviction + AOF).
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── One-shot: render common_site_config.json from env, then exit ──────────
  configurator:
    image: ${KINEXUS_IMAGE:?}
    restart: "no"
    working_dir: /home/frappe/frappe-bench
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT:-3306}
      - REDIS_CACHE=${REDIS_CACHE}
      - REDIS_QUEUE=${REDIS_QUEUE}
      - DEVELOPER_MODE=${DEVELOPER_MODE:-0}
      - MUTE_EMAILS=${MUTE_EMAILS:-0}
    command:
      - bash
      - -c
      - |
        set -e
        bench set-config -g db_host          "$$DB_HOST"
        bench set-config -gp db_port         "$$DB_PORT"
        bench set-config -g redis_cache      "$$REDIS_CACHE"
        bench set-config -g redis_queue      "$$REDIS_QUEUE"
        bench set-config -g redis_socketio   "$$REDIS_QUEUE"
        bench set-config -gp socketio_port   9000
        bench set-config -gp developer_mode  "$$DEVELOPER_MODE"
        # In developer mode Frappe adds webserver_port (8000) to every link it
        # builds — including the pages wkhtmltopdf fetches, so PDFs fail with
        # ConnectionRefused. Nginx serves the sites on 443; say so. Production
        # (developer_mode 0) adds no port and must not get one.
        if [ "$$DEVELOPER_MODE" = "1" ]; then
          bench set-config -gp http_port 443
        fi
        bench set-config -gp mute_emails     "$$MUTE_EMAILS"
        # Server Scripts are arbitrary Python execution from the UI. Off. (§20)
        bench set-config -gp server_script_enabled 0
        # Frappe 16.35 refuses the 61st User created within an hour on a site
        # ("Throttled", frappe 012667b, 22 Sep 2026). Fine against abuse, fatal
        # for a tenant onboarding 100 employees with logins. Raised, not removed
        # (ALV-119). Override per environment with THROTTLE_USER_LIMIT.
        bench set-config -gp throttle_user_limit "$${THROTTLE_USER_LIMIT:-5000}"
        echo "configurator done"

  # ── Web (horizontally scalable) ──────────────────────────────────────────
  backend:
    <<: *app
    # frappe's logger + site resolution use CWD-relative paths; the web role
    # must run from the sites dir (bench's own prod templates do the same).
    working_dir: /home/frappe/frappe-bench/sites
    command: ["/home/frappe/frappe-bench/env/bin/gunicorn", "--bind", "0.0.0.0:8000",
              "--workers", "4", "--threads", "2", "--worker-class", "gthread",
              "--timeout", "120", "--access-logfile", "-", "--error-logfile", "-",
              "frappe.app:application"]
    expose: ["8000"]
    # Frappe picks the site from the Host header, so this probe must name a site
    # that EXISTS in this stack. It was hardcoded to alvoraa.co, which the dev
    # stack does not have - the probe got a correct 404 and Docker reported the
    # container unhealthy while the app was serving perfectly.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: ${HEALTH_HOST:-alvoraa.co}\" http://localhost:8000/api/method/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ── Realtime (horizontally scalable; needs sticky sessions at the LB) ────
  socketio:
    <<: *app
    command: node apps/frappe/socketio.js
    expose: ["9000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9000/socket.io/?EIO=4&transport=polling' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── 🔴 Scheduler — EXACTLY ONE REPLICA, CLUSTER-WIDE ─────────────────────
  # Two schedulers double-fire every cron job: duplicate progress
  # recalculation, duplicate scorecards, and DUPLICATE EMAILS to real
  # employees and vendors. Never put this in an autoscaling group.
  # See ARCHITECTURE.md §5.
  scheduler:
    <<: *app
    command: bench schedule
    deploy:
      replicas: 1
      mode: replicated
    healthcheck: *scheduler-healthcheck

  # ── Workers ──────────────────────────────────────────────────────────────
  worker-default:
    <<: *app
    command: bench worker --queue default,short
    healthcheck: *worker-healthcheck

  # `long` carries recalculate_all_progress, which iterates every goal across
  # every tenant. Give it its own worker so it cannot starve interactive jobs.
  worker-long:
    <<: *app
    command: bench worker --queue long
    healthcheck: *worker-healthcheck

  # ── Ingress ──────────────────────────────────────────────────────────────
  # Terminate TLS here only if there is no cloud load balancer in front.
  # With ALB / App Gateway / GCLB, terminate at the LB and delete the 443 block.
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/ssl:ro
      - /opt/hr-app/acme:/var/www/acme
      # Serve /assets directly from the Frappe sites volume (production
      # standard — the WSGI app never mounts its static middleware here).
      - sites:/home/frappe/frappe-bench/sites:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  # In production, replace with a driver-backed shared RWX volume:
  #   sites:
  #     driver: local
  #     driver_opts: {type: nfs, o: "addr=<efs-dns>,nfsvers=4.1", device: ":/"}
  sites:
  mariadb-data:
  redis-data:
