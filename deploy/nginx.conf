# Kinexus HRMS – Multi-tenant Nginx reverse proxy
# Every *.kinexus.in subdomain maps to a separate Frappe site.
# Frappe selects the correct site from the Host header automatically.

upstream frappe_http {
    server frappe:8000;
    keepalive 32;
}

upstream frappe_ws {
    server frappe:9000;
}

# ── Rate-limiting zones ────────────────────────────────────────────────────
# Login endpoint: max 5 attempts/minute per IP (burst of 3 allowed)
limit_req_zone $binary_remote_addr zone=kinexus_login:10m  rate=5r/m;
# General API: 120 req/minute per IP
limit_req_zone $binary_remote_addr zone=kinexus_api:10m    rate=120r/m;

server {
    listen 80;
    # Wildcard catches tenant1.kinexus.in, tenant2.kinexus.in, etc.
    # Also catches the bare domain for the marketing/admin site.
    server_name *.kinexus.in kinexus.in _;

    client_max_body_size  50m;
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    # ── Security headers ────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

    # ── Login endpoint (rate-limited) ────────────────────────────────────
    location = /api/method/login {
        limit_req zone=kinexus_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── WebSocket (Frappe realtime / Socket.io) ──────────────────────────
    location /socket.io {
        proxy_pass          http://frappe_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── Static assets (long-lived cache, no rate limit) ──────────────────
    location ~* ^/(assets|files)/ {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        expires             30d;
        add_header          Cache-Control     "public, immutable";
    }

    # ── API endpoints (rate-limited) ─────────────────────────────────────
    location /api/ {
        limit_req zone=kinexus_api burst=30 nodelay;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── Everything else → Frappe application ────────────────────────────
    location / {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
