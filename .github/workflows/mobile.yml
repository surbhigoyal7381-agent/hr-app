name: Mobile app

# Checks for the field attendance app in mobile/field-app (slice 013, OPS-74).
# None of them needs a signing key or the Android SDK. The key guard is NOT here:
# it lives in ci.yml, which runs on every push including app-only ones.
#
# Still to add, in this order (DevOps 07 §4): the server codes table vs the app's
# table (when the server codes file exists), the drift check on the copied camera,
# photo and GPS code (when the copy exists), and the built-package checks (an
# unsigned release APK read with apkanalyzer: merged manifest, debuggable flag,
# network rules, size <= 10 MB) before the first pilot build (gate 5) - these
# need a runner with the Android SDK, which this job does not have yet.

on:
  pull_request:
    branches: [dev, test, main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [dev, test, main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-checks:
    name: App checks (no keys, no SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile/field-app
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed so "versionCode must rise" below can read the base ref's
          # copy of build.gradle with `git show`, the same way ci.yml's key
          # guard reads history for its secret scan.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/field-app/.nvmrc

      # The wrapper jar is the real one Gradle published, not a swapped copy -
      # checked against Gradle's own published checksums (DevOps 07 §4 gate 4).
      # Needs no Android SDK; this is just the wrapper script and jar.
      - name: Gradle wrapper is the real one
        uses: gradle/actions/wrapper-validation@v4

      # Exact versions from the committed lock file. No install scripts: nothing
      # a dependency ships gets to run on the runner.
      - name: Install from the lock file
        run: npm ci --ignore-scripts --no-audit --no-fund

      # Host allow-list (AC-172) and the checks' own tests.
      - name: Unit tests
        run: npm test

      # Config (no server.url, no debugging, native HTTP off globally), exact
      # pins, no tracking libraries, no outside URLs or HTML-from-strings in the
      # bundle, the Android permission allow-list, build-type app IDs and the
      # debug-only network allow-list (AC-165, AC-166, AC-173, AC-177, AC-178).
      - name: App config, dependencies, bundle, permissions and build types
        run: npm run check

      # AC-168: versionCode must rise and versionName must be MAJOR.MINOR.PATCH,
      # under the formula written in build.gradle's own comment. Compared
      # against the base branch's copy so two builds can never share a number.
      - name: Version must rise, and be well-formed
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            base=""
          fi
          if [ -n "$base" ] && git cat-file -e "${base}:mobile/field-app/android/app/build.gradle" 2>/dev/null; then
            git show "${base}:mobile/field-app/android/app/build.gradle" > "$RUNNER_TEMP/old-build.gradle"
            node scripts/check_versions.mjs "$RUNNER_TEMP/old-build.gradle"
          else
            echo "No previous build.gradle to compare against (first commit to add it) - format check only."
            node scripts/check_versions.mjs
          fi
