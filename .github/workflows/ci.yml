name: CI

# Quality gate. Runs on every PR into dev / test / main, and on every push to
# those branches. Never deploys.
#
# Branch model (ARCHITECTURE.md §13):
#   feature/*  --PR-->  dev  --PR-->  test  --PR-->  main (production)

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # 3.14 matches frappe/bench:latest, the base image production is built from
      # (verified: the running container reports Python 3.14.2). Frappe declares
      # requires-python ">=3.10,<3.15", but its source uses PEP 695 `type X = ...`,
      # which needs 3.12 - so the declaration is optimistic and 3.11 fails at build.
      # Matching production also means CI finally tests the interpreter the servers use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - run: pip install ruff==0.6.9

      # hrms/pyproject.toml carries the ruff config this codebase is formatted against.
      #
      # NON-BLOCKING, deliberately. The hrms fork carries 66 pre-existing violations that
      # predate any current work - `hrms/` is byte-identical to before the Alvoraa rename
      # series began, so nothing here was introduced by it. Blocking every deploy on
      # import ordering and en-dashes in comments is the wrong trade.
      #
      # Breakdown: 31 I001 (import order), 20 RUF002/RUF003 (ambiguous dash characters in
      # comments), the rest UP031 / E701 / F841 / RUF005 / F541. 39 are auto-fixable.
      #
      # To clear it, fix with the PINNED version - ruff 0.6.9, as installed above. A newer
      # ruff reports a different set (0.15.4 finds 83), so fixing with whatever is on a
      # laptop can leave CI still red.
      #
      # Flip both steps back to blocking once the backlog is cleared.
      - name: ruff check (hrms)
        continue-on-error: true
        run: ruff check hrms/hrms --config hrms/pyproject.toml

      - name: ruff format --check (hrms)
        continue-on-error: true
        run: ruff format --check hrms/hrms --config hrms/pyproject.toml

      # The alvoraa apps predate this config. Non-blocking until the backlog of
      # existing violations is cleared, then flip to blocking.
      - name: ruff check (alvoraa apps)
        continue-on-error: true
        run: ruff check alvoraa_goals alvoraa_portal --config hrms/pyproject.toml

      # Frappe resolves front-end `frappe.call({method: "app.module.func"})` paths at
      # runtime. Nothing else in the build catches a path pointing at a function that
      # does not exist - it fails when a user clicks a button. This makes that a
      # build-time check.
      #
      # Frappe resolves front-end `frappe.call({method: "app.module.func"})` paths at
      # runtime, so a path pointing at a function that does not exist fails only when a
      # user clicks. This makes it a build-time check.
      #
      # Since the Phase 4 rename the repo directories and the installed app names finally
      # agree (alvoraa_goals / alvoraa_portal), so no --alias is needed.
      #
      # --max 0. It was --max 2 from 18 Aug, "two pre-existing upstream hrms paths".
      # They were not upstream debt: they were ALV-178, the payment function 48f5439
      # deleted, which broke "Create Payment" for two months. Never raise it again;
      # fix the path instead.
      - name: Front-end API paths resolve
        run: python scripts/check_api_paths.py --max 0

      # Structural checks that need no bench or database: doctype name/folder/file agree,
      # controller class matches the doctype name (a mismatch makes bench migrate DELETE
      # the doctype), hooks.py handlers resolve, patches.txt entries expose execute().
      - name: App integrity
        run: python scripts/check_app_integrity.py

      # The visual system, counted rather than judged. The employee portal
      # reached 120 hand-picked colours, 29 font sizes and 43 shadows because
      # every individual change was reasonable - only a counter notices the
      # aggregate. It also fails on any text colour that cannot meet WCAG AA
      # contrast on the theme it appears in.
      #
      # BLOCKING. All five portal pages pass, and the point of the check is to
      # keep it that way - the page reached 120 colours one reasonable change at
      # a time, and only a counter notices the aggregate.
      - name: Design system
        run: python scripts/check_design_system.py

      # Node, for the portal handler check below.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Clicking a portal button runs an inline on*= handler, which resolves ONLY
      # against global scope. hrms-employee.html wraps most of its code in an IIFE,
      # so a helper declared inside it is invisible to the button: the click throws
      # ReferenceError and NOTHING happens - no banner, no visible error. Static
      # linting cannot see this. This loads the page's scripts in a VM and actually
      # calls every handler.
      #
      # It caught 8 real dead handlers, including "+ Apply Leave" and "+ New Claim".
      - name: Portal buttons are wired up
        run: node scripts/check_portal_handlers.js

      # Finds identifiers a page reads but nothing ever creates. The handler check
      # above calls buttons, but it cannot reach code behind form validation, and a
      # page that catches its own errors turns the failure into a banner. That is how
      # "selectedPlan is not defined" shipped and blocked every tenant creation.
      #
      # ESLint no-undef, with each page's `window.NAME =` exports fed in as declared
      # globals - without that it flags every published function and is unusable here.
      - name: No undefined identifiers in portal pages
        run: node scripts/check_undefined_js.js

      # A review's overall rating is the average of its items, so for about half
      # the company it is a half-point that is not on the rating scale. Every
      # screen used to match a rating against the scale by exact value and drop
      # anything unmatched into the lowest band. That put 204 of 403 people in
      # the wrong box of the calibration grid - the grid HR uses for promotion,
      # succession and pay banding - always downwards, and quietly removed them
      # from both bell curves and every figure above them.
      #
      # This runs the user's own arithmetic from the cycle where it was found.
      - name: Ratings land in the right band
        run: node scripts/check_rating_bands.js

      # One nginx serves production and dev. Frappe trusts the first address in
      # X-Forwarded-For, so nginx must never pass on what the caller wrote there
      # (slice 014, OPS-19). A text check: no nginx needed. Parsing and behaviour
      # are checked locally by scripts/check_nginx_forwarded.sh before a push.
      - name: nginx never trusts a caller's address
        run: python scripts/check_nginx_conf.py

      - name: Semgrep (Frappe security rules)
        continue-on-error: true
        run: |
          pip install semgrep
          semgrep --config hrms/semgrep --error --skip-unknown-extensions \
            alvoraa_goals alvoraa_portal hrms/hrms

      # Slice 015. The 2026-09-17 history scan found three shared demo passwords
      # in public code, for sites anyone can reach. The seed scripts now read the
      # password from an environment variable and stop if it is not set. This keeps
      # it that way. Text only - demo/ never reaches the bench, so a unittest could
      # not guard it.
      - name: No demo passwords in the repository
        run: python scripts/check_no_demo_passwords.py

      # Slice 034 US-11 (SEC-1, AC-74, ALV-100). /hrms-employee-next exists only
      # where frappe.conf carries portal_preview, and the page checks that flag
      # before it checks the caller's role - so the flag is the first of two
      # locks. What makes it safe to rely on is that nothing in this repository
      # sets it for production, and this is what keeps that true. It was written
      # with the preview page and then not wired in, which is how a guard quietly
      # stops guarding. Text only: no bench, no database, no site.
      #
      # The first line is the positive control: it builds a throwaway deploy/
      # folder with a deliberately bad production file in it and fails the build
      # unless the check CATCHES it. That line used to be accepted and ignored -
      # nothing read sys.argv - so the same check simply ran twice and one of the
      # runs was called a proof. The second line is the real repository check.
      - name: No production file turns the portal preview on
        run: |
          python scripts/check_preview_flag.py --self-test
          python scripts/check_preview_flag.py

      # Slice 042, review finding F1. Removing the "this week" card deleted the
      # card's opening <div> and its two inner ones and left the CLOSING one
      # behind. The browser does not error on that - it re-parents everything
      # after it, so the live Home page lost its two-column layout and nothing
      # anywhere went red. The design-system counter reads colours, the handler
      # checks read JavaScript, and the jsdom tests drive the PREVIEW page, not
      # hrms-employee.html.
      #
      # This assembles both portal pages the way the server sends them and
      # counts the tags, and pins each markup fragment's depth so the failure
      # names a file rather than a line in a 3,000-line assembled document.
      # The first line is the positive control: it rebuilds the real 042 bug in
      # a temporary folder and fails the build unless the check CATCHES it.
      # Text only: no bench, no database, no site, no browser.
      - name: The portal pages open and close the same tags
        run: |
          python scripts/check_tag_balance.py --self-test
          python scripts/check_tag_balance.py

      # Slice 034, review finding F1. The portal's styles and script are static
      # files under /assets/ now, served with `try_files $uri =404`. A 404 on
      # portal.js is the whole portal gone and nothing in any log, because
      # nothing reaches the backend - so the deploy workflow fetches all three
      # after its smoke test and goes red if one is missing or empty.
      #
      # This keeps that gate pointing at the right files: a page file is renamed
      # far more often than a workflow is read. The first line is its positive
      # control. Text only: no bench, no database, no site.
      - name: The deploy checks every file the portal loads
        run: |
          python scripts/check_portal_assets_gate.py --self-test
          python scripts/check_portal_assets_gate.py

      # Slice 034 (ALV-111). Five tests load the real rendered page in jsdom and
      # click it. None had ever run - jsdom was installed nowhere, so each one
      # stopped at "Cannot find module 'jsdom'" and nobody saw it. It is now a
      # pinned devDependency. The runner says which tests it ran and which it
      # could not, and fails if the list and the files on disk disagree.
      #
      # This matters more since OPS-31: the page's script is a separate file
      # now, so losing the <script src> tag would leave a page that still looks
      # complete and does nothing. These two tests go red when that happens.
      - name: Portal DOM tests (jsdom)
        run: |
          npm ci
          node scripts/run_dom_tests.js

      # Slice 013 step 6 (AC-37, OPS-48). Raising the server's MIN_APP_VERSION
      # locks out every phone below it. The floor may only rise to a version
      # that has been in the store for 90 days (mobile/field-app/releases.json
      # holds the dates). Text only: reads one constant and one JSON file.
      - name: App-version floor honours the 90-day rule
        run: |
          python scripts/check_min_app_version.py --self-test
          python scripts/check_min_app_version.py

      # ALV-149. The product is spelled "Alvora" wherever a person reads it;
      # "alvoraa" stays in addresses, ids and code. Reads the portal pages, the
      # browser JS, the phone app's page and Android strings, and the Python
      # string literals (parsed - docstrings and log titles are skipped), and
      # needs an en.csv row for every "Alvoraa ..." doctype, module and
      # workspace. The first line proves the check can fail. Text only.
      - name: Every screen says Alvora
        run: |
          python scripts/check_brand_spelling.py --self-test
          python scripts/check_brand_spelling.py

      # ALV-174. A narrow guard on top of the one above: our own email-template
      # overrides (alvoraa_portal/templates/emails, alvoraa_portal/overrides)
      # exist specifically to replace an upstream app's "Frappe"/"ERPNext"
      # wording, so a future hand-copy from the upgraded upstream file that
      # forgets to re-apply the fix fails here instead of reaching a tenant.
      - name: Our own email overrides do not say Frappe or ERPNext
        run: |
          python scripts/check_email_template_overrides.py --self-test
          python scripts/check_email_template_overrides.py

  # ── Key guard (slice 013, OPS-37, OPS-71, SEC-23) ─────────────────────────
  # A signing key is handed out the moment it is pushed: the image is built from
  # this repo, and everything published while it was public is already copied.
  # Its own job, not steps in "lint", because the secret scan needs the commit
  # history (fetch-depth 0) and the lint checkout is shallow. No path filter:
  # it must run on app-only pushes too, which are the ones that could carry a key.
  key-guard:
    name: Key guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # `git add -f` walks past .gitignore. This reads what git actually tracks.
      - name: No signing key or app secret file is tracked
        run: python3 scripts/check_tracked_keys.py

      # gitleaks, pinned by version AND by the SHA-256 GitHub publishes for the
      # release, so a swapped download fails here instead of running. Scans only
      # the commits this push or pull request adds; a full-history scan is a
      # one-off job for the security engineer first (OPS-87).
      - name: Secret scan of the new commits (gitleaks 8.30.1)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ -n "${PUSH_BEFORE:-}" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${HEAD_SHA}"
          else
            range="-1 ${HEAD_SHA}"
          fi
          echo "Scanning: $range"
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts="$range" .

  # ── Python / Frappe tests ─────────────────────────────────────────────────
  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    # 90, not 60: a COLD build clones frappe and erpnext and runs yarn install for both,
    # which alone reaches 30-50 minutes on a standard runner. The cache key includes
    # FRAPPE_TAG, so any version bump forces exactly that cold path. Warm runs are
    # minutes. The per-step timeout bounds the slow part on its own.
    timeout-minutes: 90

    services:
      mariadb:
        image: mariadb:10.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis-cache:
        image: redis:alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:alpine
        ports: ["11000:6379"]

    env:
      # Pinned to the SAME release tags as deploy/Dockerfile, so the tests run on
      # the framework the image ships (ALV-156, slice 055). While these said
      # `version-16` - a moving branch - a red CI run could be caused by an
      # upstream commit nobody here made, and a green one proved nothing about
      # the image. Change these two and the Dockerfile's three ARGs together;
      # scripts/check_version_pins.py checks that they agree.
      FRAPPE_TAG: v16.35.0
      ERPNEXT_TAG: v16.36.0

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # hrms/frappe-ui

      # 3.14 matches frappe/bench:latest, the base image production is built from
      # (verified: the running container reports Python 3.14.2). Frappe declares
      # requires-python ">=3.10,<3.15", but its source uses PEP 695 `type X = ...`,
      # which needs 3.12 - so the declaration is optimistic and 3.11 fails at build.
      # Matching production also means CI finally tests the interpreter the servers use.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # 24 matches frappe/bench:latest, which ships Node v24.13.0. Frappe version-16
      # declares engines.node ">=24", so 20 aborts `yarn install` during bench init.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # A cold `bench init` is 15-25 min. Cache it, keyed on what can change it.
      - name: Cache bench
        id: bench-cache
        uses: actions/cache@v4
        with:
          path: ~/frappe-bench
          key: bench-${{ runner.os }}-${{ env.FRAPPE_TAG }}-${{ hashFiles('hrms/pyproject.toml', 'alvoraa_goals/requirements.txt', 'alvoraa_portal/requirements.txt') }}

      - name: System dependencies
        run: |
          # GitHub's runner image ships Google's Chrome repository. We install
          # nothing from it, but `apt-get update` still reads it - and on
          # 2026-09-09 it served a bad index ("Hash Sum mismatch"), which
          # returns exit 100 and failed the whole job twice before a single
          # test ran. Dropping a source we do not use makes this job depend on
          # Ubuntu's archive alone.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list                      /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          # wkhtmltopdf: Frappe HR's Leave Encashment and Gratuity tests submit a
          # salary slip, which renders a PDF (ALV-178). Without it they fail with
          # "No wkhtmltopdf executable found" - a missing tool, not a code fault.
          sudo apt-get install -y libcups2-dev redis-tools mariadb-client libmariadb-dev wkhtmltopdf
          pip install frappe-bench

      - name: MariaDB settings required by Frappe
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL character_set_server='utf8mb4'"
          mysql -h 127.0.0.1 -u root -proot -e "SET GLOBAL collation_server='utf8mb4_unicode_ci'"

      # stdin from /dev/null: on failure `bench init` asks
      #   "Do you want to rollback these changes? [y/N]:"
      # With a live stdin that waits forever and burns the whole job timeout for no
      # information. With /dev/null it hits EOF and fails immediately, showing the real
      # error. No CI step should be able to sit on a prompt.
      - name: Init bench
        if: steps.bench-cache.outputs.cache-hit != 'true'
        timeout-minutes: 45
        run: |
          cd ~
          bench init --skip-redis-config-generation --skip-assets --frappe-branch "$FRAPPE_TAG" --python "$(which python)" frappe-bench < /dev/null
          cd frappe-bench
          bench get-app --branch "$ERPNEXT_TAG" erpnext < /dev/null

      # All three first-party apps come from THIS repo — including the hrms fork,
      # so the PMS module is exercised in CI exactly as it ships to production.
      - name: Install this repo's apps
        run: |
          cd ~/frappe-bench
          rm -rf apps/hrms apps/alvoraa_goals apps/alvoraa_portal
          cp -r "$GITHUB_WORKSPACE/hrms"                apps/hrms
          cp -r "$GITHUB_WORKSPACE/alvoraa_goals"         apps/alvoraa_goals
          cp -r "$GITHUB_WORKSPACE/alvoraa_portal" apps/alvoraa_portal
          ./env/bin/pip install -q -e apps/hrms -e apps/alvoraa_goals -e apps/alvoraa_portal
          printf 'frappe\nerpnext\nhrms\nalvoraa_goals\nalvoraa_portal\n' > sites/apps.txt

      - name: Create test site
        run: |
          cd ~/frappe-bench
          bench set-config -g db_host 127.0.0.1
          bench set-config -g redis_cache    redis://127.0.0.1:13000
          bench set-config -g redis_queue    redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench set-config -g mute_emails 1        # never let CI reach a mail server
          sed -i '/redis/d;/watch/d;/schedule/d;/socketio/d' Procfile
          bench new-site test_site --force --db-root-password root \
                --admin-password admin --no-mariadb-socket
          bench --site test_site install-app erpnext
          bench --site test_site install-app hrms
          bench --site test_site install-app alvoraa_portal
          bench --site test_site install-app alvoraa_goals
          bench --site test_site set-config allow_tests true
          # Frappe refuses to create more than 60 users an hour on a site (the
          # "Throttled" error). The suite creates a few hundred test users in one
          # run on this brand-new site, so CI hit it (run 35222132118). Raised for
          # this throwaway test site only - the local test_site has the same key -
          # never for a tenant or the control plane.
          bench --site test_site set-config -p throttle_user_limit 1000

      # This step is also the smoke test for the PMS module: `install-app hrms`
      # creates its 37 doctypes. If they are malformed, this fails here rather
      # than during a production deploy.
      - name: Verify all modules installed
        run: |
          cd ~/frappe-bench
          bench --site test_site execute frappe.client.get_count \
                --kwargs '{"doctype":"DocType","filters":{"module":"Performance Management"}}'

      # The same integrity script as the no-bench job, but here a bench EXISTS -
      # so the doctype-shadowing check actually runs instead of skipping.
      #
      # That check is the one that would have caught 14 stub copies of ERPNext
      # doctypes sitting in the hrms fork: a 10-field Company against ERPNext's
      # 131, a 5-field Account against 21. hrms syncs last, so ours won and
      # ERPNext's real definitions were thrown away - which broke the setup
      # wizard on every new tenant, silently, for weeks.
      - name: App integrity (with a bench - doctype shadowing)
        run: |
          cd "$GITHUB_WORKSPACE"
          BENCH_APPS_PATH=~/frappe-bench/apps python scripts/check_app_integrity.py

      # ALV-175. Our own email overrides no-bench check (job above) proves the
      # text is clean; this one needs a real bench, because it compares our
      # standard.html override against Frappe's ACTUAL installed copy, not a
      # hash typed by hand and trusted forever.
      - name: Our email overrides still match the upstream shape they were copied from
        run: |
          cd "$GITHUB_WORKSPACE"
          BENCH_APPS_PATH=~/frappe-bench/apps python scripts/check_email_template_overrides.py --check-upstream-shape

      # Tenant isolation is enforced entirely by these tests. Blocking.
      - name: Run tests
        run: |
          cd ~/frappe-bench
          bench --site test_site run-tests --app alvoraa_goals
          bench --site test_site run-tests --app alvoraa_portal

      # ALV-178. The hrms fork's own tests never ran in CI, so when one commit
      # removed Frappe HR's payment and ledger code (48f5439, 31 Jul) nothing failed.
      # These are the doctypes that pay people and post to the accounts.
      #
      # Their own site, with only ERPNext and Frappe HR: ERPNext's test bootstrap
      # creates calendar-year "_Test Fiscal Year"s, which overlap the April-March
      # years our own tests create on test_site and stop test discovery.
      - name: Frappe HR payment and payroll tests
        run: |
          cd ~/frappe-bench
          bench new-site hrms_test_site --force --db-root-password root \
            --admin-password admin --no-mariadb-socket
          bench --site hrms_test_site install-app erpnext
          bench --site hrms_test_site install-app hrms
          bench --site hrms_test_site set-config allow_tests true
          bench --site hrms_test_site set-config -p throttle_user_limit 1000
          # Submitting a salary slip emails it as a PDF, and wkhtmltopdf fetches the
          # page's styles from the site's own URL. So the site needs a name that
          # resolves and a web server answering on it - what upstream Frappe HR's CI
          # does too. Without it gratuity and leave encashment tests fail with
          # "wkhtmltopdf ... HostNotFoundError", which has nothing to do with them.
          echo "127.0.0.1 hrms_test_site" | sudo tee -a /etc/hosts
          bench --site hrms_test_site set-config host_name http://hrms_test_site:8000
          nohup bench serve --port 8000 > ~/frappe-bench/serve.log 2>&1 &
          for doctype in "Expense Claim" "Employee Advance" "Leave Encashment" \
                         "Gratuity" "Full and Final Statement" "Salary Withholding"; do
            bench --site hrms_test_site run-tests --doctype "$doctype"
          done

      - name: Bench logs on failure
        if: failure()
        run: tail -n 200 ~/frappe-bench/logs/*.log || true

  # ── Frontend build ────────────────────────────────────────────────────────
  test-frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive          # build fails without frappe-ui

      # 24 matches frappe/bench:latest, which ships Node v24.13.0. Frappe version-16
      # declares engines.node ">=24", so 20 aborts `yarn install` during bench init.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build employee PWA
        working-directory: hrms/frontend
        run: |
