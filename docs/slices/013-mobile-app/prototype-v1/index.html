<title>013 Mobile app, step 1 — prototype v1 (sample data)</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap");
/* Tokens copied from alvoraa_portal/templates/includes/design_system.html. Nothing invented. */
:root{
  --bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;
  --primary:#5B4B8A;--primary-h:#4A3D73;--primary-d:#3D3461;--primary-lt:#EDEAF4;
  --green:#1B7F5A;--green-lt:#E8F4EF;--green-h:#166B4C;--red:#B3261E;--red-lt:#FBEAE8;--amber:#9A6510;--amber-lt:#FBF1E0;
  --sh1:0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.10);--sh3:0 12px 32px rgba(0,0,0,.16);
  --font:"Inter","Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;--r-sm:6px;--r-lg:16px;--r-full:999px;
  --t:.18s cubic-bezier(.4,0,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;
  --primary:#A99AD4;--primary-h:#BBAEE0;--primary-d:#7A6BA8;--primary-lt:#2A2438;
  --green:#5DBF97;--green-lt:#12332A;--green-h:#7BD0AC;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;
  --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;--text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;
  --primary:#A99AD4;--primary-h:#BBAEE0;--primary-d:#7A6BA8;--primary-lt:#2A2438;
  --green:#5DBF97;--green-lt:#12332A;--green-h:#7BD0AC;--red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;
  --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);--sh3:0 12px 32px rgba(0,0,0,.60);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45;overflow-x:hidden}
button,input,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.sronly{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ── Review controls (not part of the product) ─────────────────────────── */
.ctl{position:relative;z-index:40;background:var(--surface);border-bottom:1px solid var(--border);padding:10px 16px;box-shadow:var(--sh1)}
.ctl-top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.ctl h1{margin:0;font-size:17px;font-weight:700;flex:1 1 260px}
.ctl h1 small{display:block;font-size:13px;font-weight:400;color:var(--text3)}
.tag-sample{display:inline-block;background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber);border-radius:var(--r-full);font-size:12px;font-weight:700;padding:1px 8px;vertical-align:middle}
.seg{display:inline-flex;flex-wrap:wrap;max-width:100%;border:1px solid var(--border2);border-radius:12px;overflow:hidden;flex:0 1 auto}
.seg button{min-height:44px;min-width:44px;padding:0 12px;border:0;background:var(--surface);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--primary-d);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1A1815}
.ctl-row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:8px}
.ctl-row label{font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
.ctl-row .lbl{font-size:13px;color:var(--text3)}
.states{padding:8px 16px 10px;border-bottom:1px solid var(--border);background:var(--bg)}
.sgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.sgroup .gname{font-size:12px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.4px;min-width:118px}
.sgroup button{min-height:44px;padding:0 10px;border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:8px;font-size:13px;cursor:pointer}
.sgroup button[aria-current="true"]{border-color:var(--primary);background:var(--primary-lt);color:var(--primary-d);font-weight:700}
:root[data-theme="dark"] .sgroup button[aria-current="true"]{color:var(--text)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sgroup button[aria-current="true"]{color:var(--text)}}

/* ── Stage ─────────────────────────────────────────────────────────────── */
.stage{display:flex;flex-wrap:wrap;gap:20px;justify-content:center;align-items:flex-start;padding:20px 16px 40px}
.note{flex:1 1 260px;max-width:420px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--text2)}
.note h2{margin:0 0 6px;font-size:16px;color:var(--text)}
.note p{margin:0 0 8px}
.note .dec{display:block;margin-top:6px;padding:8px 10px;border-left:3px solid var(--amber);background:var(--amber-lt);color:var(--text);border-radius:4px}

/* Phone frame */
.phone{--pw:390px;width:var(--pw);max-width:100%;height:800px;flex:none;border-radius:34px;border:10px solid #1d1b19;background:#1d1b19;box-shadow:var(--sh3);overflow:hidden;position:relative;display:flex;flex-direction:column}
.phone.w360{--pw:360px;height:720px}
/* The app pins the light theme by default (slice 008, D1: read in sunlight). */
.phone:not(.follow-dark){
  --bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;--text:#2D2622;--text2:#5A544E;--text3:#736D65;
  --primary:#5B4B8A;--primary-h:#4A3D73;--primary-d:#3D3461;--primary-lt:#EDEAF4;
  --green:#1B7F5A;--green-lt:#E8F4EF;--green-h:#166B4C;--red:#B3261E;--red-lt:#FBEAE8;--amber:#9A6510;--amber-lt:#FBF1E0;
  --sh2:0 4px 12px rgba(0,0,0,.10);--sh3:0 12px 32px rgba(0,0,0,.16);color-scheme:light;
}
.osbar{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12px;font-weight:600;color:#fff;background:var(--primary-d)}
.app{flex:1;min-height:0;position:relative;background:var(--bg);color:var(--text);
  --fs-sm:15px;--fs-base:17px;--fs-md:19px;--fs-lg:22px;--fs-xl:26px;--fs-2xl:32px;font-size:var(--fs-base);display:flex;flex-direction:column}
.navbar-os{height:18px;flex:none;background:#1d1b19;display:flex;justify-content:center;align-items:center}
.navbar-os span{width:110px;height:4px;border-radius:4px;background:#8a8580}

.scr{flex:1;min-height:0;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:8px;min-height:56px;padding:6px 8px 6px 16px;background:var(--primary-d);color:#fff;flex:none}
.follow-dark .bar{background:var(--surface2);color:var(--text)}
.bar .t{flex:1;min-width:0}
.bar .t b{display:block;font-size:var(--fs-md);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .t span{display:block;font-size:var(--fs-sm);opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .ib{min-height:48px;min-width:48px;border:0;background:transparent;color:inherit;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;gap:1px;cursor:pointer;padding:0 6px}
.bar .ib svg{width:22px;height:22px}
.bar .ib.row{flex-direction:row;font-size:var(--fs-sm);gap:6px}
.lang{display:flex;border:2px solid rgba(255,255,255,.55);border-radius:var(--r-full);overflow:hidden;flex:none}
.follow-dark .lang{border-color:var(--border2)}
.lang button{min-height:44px;min-width:50px;border:0;background:transparent;color:inherit;font-size:var(--fs-sm);font-weight:700;padding:0 10px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--primary-d)}
.scroll{flex:1;min-height:0;overflow-y:auto;padding:16px}
.footer{flex:none;padding:10px 16px 12px;background:var(--bg);border-top:1px solid var(--border)}
.footer.plain{border-top:0}
.stack>*+*{margin-top:10px}
.app h2{margin:0 0 8px;font-size:var(--fs-xl);font-weight:700;line-height:1.25}
.app h3{margin:0 0 6px;font-size:var(--fs-md);font-weight:650}
.app p{margin:0 0 14px;color:var(--text2)}
.app p.lead{color:var(--text);font-size:var(--fs-md)}
.muted{color:var(--text3);font-size:var(--fs-sm)}
.app .sample{display:inline-block;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-lt);border:1px solid var(--amber);border-radius:var(--r-full);padding:0 6px;vertical-align:middle;line-height:18px}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:12px 18px;border:0;border-radius:var(--r-lg);font-size:var(--fs-md);font-weight:700;color:#fff;background:var(--primary-d);box-shadow:var(--sh2);cursor:pointer;text-align:center}
.follow-dark .btn{color:#1A1815}
.btn svg{width:26px;height:26px;flex:none}
.btn.ghost{background:var(--surface);color:var(--primary-d);border:2px solid var(--border2);box-shadow:none;font-weight:650}
.follow-dark .btn.ghost{color:var(--text)}
.btn.link{background:none;color:var(--primary);box-shadow:none;min-height:48px;font-weight:650;text-decoration:underline;font-size:var(--fs-base)}
.btn.danger{background:var(--red)}
.btn.green{background:var(--green)}
.btn-punch{min-height:96px;border-radius:20px;font-size:var(--fs-2xl);font-weight:800;box-shadow:var(--sh3)}
.btn-punch.in{background:var(--green)}
.btn-punch.out{background:var(--primary-d)}
.btn-punch svg{width:36px;height:36px}
.btn-punch.out svg{transform:scaleX(-1)}

.chip{display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:var(--r-full);font-size:var(--fs-sm);font-weight:650;border:1px solid;margin:8px 16px 0;flex:none}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip.yes{background:var(--green-lt);color:var(--green-h);border-color:var(--green)}
.chip.yes .dot{background:var(--green)}
.chip.no{background:var(--surface2);color:var(--text2);border-color:var(--border2)}
.chip.no .dot{background:var(--text3)}
.cam{position:relative;flex:1 1 auto;min-height:170px;margin:8px 16px 0;border-radius:var(--r-lg);overflow:hidden;background:#2a2622;display:flex;align-items:center;justify-content:center;color:#fff}
.cam .person{width:46%;max-width:160px;opacity:.55}
.cam .tagc{position:absolute;left:10px;bottom:10px;right:10px;background:rgba(0,0,0,.62);color:#fff;font-size:var(--fs-sm);font-weight:650;padding:5px 10px;border-radius:12px}
.cam .off{text-align:center;padding:18px;font-size:var(--fs-base)}
.cam .off .btn{margin-top:12px}
.punches{margin:8px 16px 0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;flex:none;max-height:124px;overflow-y:auto}
.punches .hd{padding:5px 14px;font-size:13px;font-weight:650;color:var(--text2);background:var(--surface2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.punch{display:flex;align-items:center;gap:10px;padding:7px 14px;min-height:44px;border-bottom:1px solid var(--border)}
.punch:last-child{border-bottom:0}
.punch .k{font-weight:700;min-width:104px}
.punch .k.in{color:var(--green-h)}
.punch .k.out{color:var(--primary-d)}
.follow-dark .punch .k.out{color:var(--primary)}
.punch .tm{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;font-size:var(--fs-md)}
.punch .src{font-size:var(--fs-sm);color:var(--text3)}
.punches .none{padding:10px 14px;color:var(--text3);font-size:var(--fs-sm)}
.place{margin:0 0 8px;text-align:center}

.big{display:flex;flex-direction:column;align-items:center;text-align:center;padding:14px 8px 4px}
.big .circle{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:12px;flex:none}
.big .circle svg{width:48px;height:48px}
.big.ok .circle{background:var(--green-lt);color:var(--green)}
.big.warn .circle{background:var(--amber-lt);color:var(--amber)}
.big.stop .circle{background:var(--red-lt);color:var(--red)}
.big.info .circle{background:var(--primary-lt);color:var(--primary-d)}
.follow-dark .big.info .circle{color:var(--primary)}
.big .time{font-size:48px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;margin:2px 0 4px}
.big p{font-size:var(--fs-md)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin:0 0 14px;text-align:left}
.card.green{background:var(--green-lt);border-color:var(--green)}
.card.amber{background:var(--amber-lt);border-color:var(--amber)}
.rowline{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.rowline .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--primary-d);color:#fff;font-weight:700;font-size:var(--fs-sm);display:flex;align-items:center;justify-content:center}
.follow-dark .rowline .n{color:#1A1815}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.kv .k{color:var(--text2)}
.kv .v{font-weight:650;text-align:right}
.code{font-size:var(--fs-sm);color:var(--text3);text-align:center;margin:4px 0 0}
.shot{position:relative;width:132px;height:132px;margin:0 auto 12px;flex:none;border-radius:var(--r-lg);border:3px solid var(--green);background:#d9d2c8;display:flex;align-items:flex-end;justify-content:center;overflow:visible}
.shot svg.person{width:80%;color:#8c8378}
.shot .tick{position:absolute;right:-8px;bottom:-8px;width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:3px solid var(--bg)}
.shot .tick svg{width:22px;height:22px}

/* Join */
.brandmark{display:flex;align-items:center;gap:10px;margin:6px 0 18px}
.brandmark .logo{width:48px;height:48px;border-radius:14px;background:var(--primary-d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px}
.brandmark b{font-size:var(--fs-lg)}
.hero-ill{display:flex;justify-content:center;margin:4px 0 16px;color:var(--primary-d)}
.hero-ill svg{width:120px;height:120px}
.follow-dark .hero-ill{color:var(--primary)}
.who-card{background:var(--surface);border:2px solid var(--primary);border-radius:var(--r-lg);padding:18px 16px;text-align:center;margin:8px 0 16px}
.who-card .av{width:72px;height:72px;border-radius:50%;background:var(--primary-lt);color:var(--primary-d);font-weight:800;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.follow-dark .who-card .av{color:var(--primary)}
.who-card .nm{font-size:var(--fs-xl);font-weight:800;color:var(--text)}
.who-card .ds{font-size:var(--fs-md);color:var(--text2)}
.who-card .co{font-size:var(--fs-md);font-weight:650;color:var(--text);margin-top:4px}
.notice{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin:6px 0 4px}
.notice ul{margin:0;padding:0;list-style:none}
.notice li{padding:7px 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm);color:var(--text2)}
.notice li:last-child{border-bottom:0}
.notice li strong{display:block;color:var(--text);font-size:var(--fs-sm)}
.agree{display:flex;align-items:center;gap:12px;margin:12px 0 2px;min-height:48px;font-weight:650;cursor:pointer}
.agree input{width:28px;height:28px;flex:none;accent-color:var(--primary)}
.inline-err{color:var(--red);font-weight:650;font-size:var(--fs-sm);margin:6px 0 0}

/* Scanner */
.scanner{flex:1;min-height:0;background:#0f0e0d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:16px;position:relative}
.scanner .vf{width:72%;max-width:250px;aspect-ratio:1;border-radius:18px;position:relative;background:repeating-linear-gradient(45deg,#1d1b19 0 10px,#24211e 10px 20px);border:0;cursor:pointer;color:#fff;font-size:15px}
.scanner .vf::before{content:"";position:absolute;inset:-4px;border:4px solid #fff;border-radius:22px;clip-path:polygon(0 0,30% 0,30% 4px,4px 4px,4px 30%,0 30%,0 70%,4px 70%,4px calc(100% - 4px),30% calc(100% - 4px),30% 100%,70% 100%,70% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 70%,100% 70%,100% 30%,calc(100% - 4px) 30%,calc(100% - 4px) 4px,70% 4px,70% 0,100% 0,100% 100%,0 100%)}
.scanner p{color:#fff;font-size:var(--fs-md);text-align:center;margin:0}
.scanner .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}

/* Android system dialog (mock) */
.os-dim{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.os-dlg{background:#EEF0F4;color:#1B1B1F;border-radius:28px;padding:22px 20px 14px;width:100%;max-width:320px;font-family:Roboto,"Noto Sans Devanagari",Arial,sans-serif}
.os-dlg .ico{display:flex;justify-content:center;color:#3A5BA0;margin-bottom:10px}
.os-dlg .ico svg{width:28px;height:28px}
.os-dlg .q{font-size:18px;text-align:center;margin:0 0 14px;line-height:1.35}
.os-dlg .opts{display:flex;justify-content:center;gap:24px;margin:0 0 12px}
.os-dlg .opt{display:flex;flex-direction:column;align-items:center;font-size:13px;gap:4px}
.os-dlg .opt i{width:64px;height:64px;border-radius:50%;background:#D8E2FF;display:block;border:2px solid #3A5BA0}
.os-dlg .opt.off i{background:#E1E2EC;border-color:transparent}
.os-dlg button{display:block;width:100%;min-height:48px;margin:4px 0;border:0;border-radius:24px;background:#D8E2FF;color:#1B1B1F;font-size:15px;font-weight:500;cursor:pointer}
.os-note{position:absolute;top:8px;left:8px;right:8px;background:#241F1B;color:#fff;font-size:12px;padding:4px 8px;border-radius:6px;text-align:center;z-index:21}

/* Busy overlay */
.busy{position:absolute;inset:0;background:rgba(26,24,21,.78);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:18px;padding:24px;z-index:15}
.busy .sp{width:56px;height:56px;border:6px solid rgba(255,255,255,.28);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy .msg{font-size:var(--fs-md);font-weight:650;text-align:center}
@media (prefers-reduced-motion:reduce){.busy .sp{animation-duration:2.4s}}

/* Tab bars (shell options B and C) */
.tabbar{flex:none;display:flex;border-top:1px solid var(--border);background:var(--surface)}
.tabbar button{flex:1;min-height:60px;border:0;background:transparent;color:var(--text2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:650;cursor:pointer}
.tabbar button svg{width:24px;height:24px}
.tabbar button[aria-current="page"]{color:var(--primary-d)}
.follow-dark .tabbar button[aria-current="page"]{color:var(--primary)}
.tabbar button[aria-current="page"]::after{content:"";display:block;width:32px;height:3px;border-radius:3px;background:currentColor;margin-top:2px}
.tabbar button.greyed{opacity:.45;cursor:not-allowed}

/* Settings list */
.sgrp{margin:0 0 16px}
.sgrp h3{font-size:var(--fs-sm);text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin:0 0 6px}
.slist{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--text);font-size:var(--fs-base)}
.srow:last-child{border-bottom:0}
button.srow{cursor:pointer}
.srow .l{flex:1;min-width:0}
.srow .l small{display:block;color:var(--text3);font-size:var(--fs-sm)}
.srow .r{color:var(--text2);text-align:right;font-weight:600}

  var body = '<div class="big '+o.tone+'"><div class="circle" aria-hidden="true">'+I[o.icon]+'</div><h2>'+o.h+'</h2><p>'+o.p+'</p>'+(o.p2?'<p>'+o.p2+'</p>':'')+'</div>';
  if (o.steps) body += steps(o.steps);
  if (o.card) body += o.card;
  if (o.code) body += codeLine(o.code);
  var foot = (o.b1 ? btn(o.b1) : "") + (o.b2 ? btn(o.b2) : "");
  return scr({ bar:o.bar, body:sc(body), foot:foot, tabs:o.tabs });
}
function joinBar(back){ return bar({ title:"Alvoraa", back:back, lang:!back }); }
function workBar(){ return bar({ sub:P.full, settings:true }); }

function noticeRows(){
  var keep = L("Photos are deleted after "+P.keep+" days. Your attendance record is kept. (This is "+P.co+"’s setting.)",
               "फ़ोटो "+P.keep+" दिन बाद हटा दी जाती है। हाज़िरी का रिकॉर्ड रखा जाता है। (यह "+P.co+" की सेटिंग है।)");
  var r = [
    [L("What we record","हम क्या दर्ज करते हैं"), L("A photo of you, where you are, and the time — only when you press Check In or Check Out. When you set up: this phone’s model name.","आपकी फ़ोटो, आपकी जगह और समय — केवल जब आप चेक इन या चेक आउट दबाते हैं। सेटअप के समय: इस फ़ोन के मॉडल का नाम।")],
    [L("What we do not record","हम क्या दर्ज नहीं करते"), L("Nothing between punches. You are not tracked while you work.","बीच के समय में कुछ नहीं। काम करते समय आप पर नज़र नहीं रखी जाती।")],
    [L("Why","क्यों"), L("To mark your attendance, and to confirm you were at your workplace.","आपकी हाज़िरी लगाने, और यह पुष्टि करने के लिए कि आप काम की जगह पर थे।")],
    [L("Who can see it","इसे कौन देख सकता है"), L("HR and your manager. Not your colleagues.","HR और आपके मैनेजर। आपके साथी नहीं।")],
    [L("How long","कितने समय तक"), keep],
    [L("Your rights","आपके अधिकार"), L("Ask HR to see what was recorded about you, or to correct it.","HR से पूछें कि आपके बारे में क्या दर्ज है, या उसे ठीक करवाएँ।")]

function punchRows(){
  var d = '<div class="punches"><div class="hd"><span>'+L("Today","आज")+'</span><span>17 Sep</span></div>';
  if (!S.rows.length) return d + '<div class="none">'+L("No punches yet today.","आज अभी कोई हाज़िरी नहीं।")+'</div></div>';
  for (var i=0;i<S.rows.length;i++){
    var isIn = S.rows[i] === "IN";
    d += '<div class="punch"><span class="k '+(isIn?"in":"out")+'">'+(isIn?L("Checked in","चेक इन"):L("Checked out","चेक आउट"))+'</span><span class="src">'+L("This phone","यह फ़ोन")+'</span><span class="tm">'+TIMES[i]+'</span></div>';
  }
  return d + '</div>';
}

  qrCancelled:["Code cancelled by HR","Same screen, different reason.",""],
  notAlvoraa:["Not an Alvoraa code","Common in India: a UPI payment QR sits on every counter. A code for a server that is not *.alvoraa.co ends here too, and nothing is sent.",""],
  appOff:["App switched off","HR could not make a code while the setting is off, so this appears only when HR switched it off after making the code.","D5"],
  notField:["Not a field job","Only when the designation changed after the code was made. It names the person’s own job, which they already saw on “Is this you?”.",""],
  noSignalJoin:["No internet while joining","Nothing is used up. The notice is never shown with a blank “How long” row.",""],
  camDenied:["Camera refused while joining","The picture route still works, so it leads.",""],
  pickNoQr:["No code in the picture","",""],

  cancelConfirm:["Cancel the code","",""],
  empJoined:["Joined","The line from the brief. Switch “HR person looking” at the top: “you” is only true for the person who made the code.","D13"],

  fieldSettings:["Field App Settings","Three settings. Turning the app off asks first.",""],

/* ── Switcher groups ─────────────────────────────────────────────────────── */
var GP = [
  ["Join", [["first","First launch"],["camExplain","Camera, explained"],["osCam","Android asks: camera"],["scan","Scanner"],["checking","Checking code"],["confirm","Is this you?"],["notMe","This is not me"],["notMeDone","Code cancelled"],["notice","Notice"],["joining","Setting up"],["welcome","Welcome (WOW)"]]],
  ["Attendance", [["home","Not checked in"],["locExplain","Location, explained"],["osLoc","Android asks: location"],["punching","Saving"],["resultIn","Checked in"],["homeIn","Home: in"],["resultOut","Checked out"],["homeOut","Home: out"],["camOff","Camera off"]]],
  ["Join problems", [["qrExpired","Code ran out"],["qrUsed","Code already used"],["qrCancelled","Cancelled by HR"],["notAlvoraa","Not an Alvoraa code"],["appOff","App switched off"],["notField","Not a field job"],["noSignalJoin","No internet"],["camDenied","Camera refused"],["pickNoQr","No code in picture"]]],
  ["Check-in problems", [["locDenied","Location refused"],["locOff","Location off"],["gpsVague","GPS too weak"],["outside","Outside the site"],["noSignal","No internet"],["duplicate","Pressed twice"],["tooMany","Too many tries"]]],
  ["Phone stopped", [["update","Update the app"],["blocked","Blocked by HR"],["replaced","New phone joined"],["left","Left the company"],["serverError","Server error"],["unknownCode","Unknown code"]]],
  ["Settings", [["settings","Settings"],["records","What this app records"],["noticeAgain","Notice changed"],["leaveConfirm","Remove this phone?"],["removed","Removed"]]]
];
var GD = [
  ["Employee record", [["empField","Not invited yet"],["inviteCreate","Invite: time"],["inviteShow","Invite: the code"],["printSheet","Printed sheet"],["empInvited","Code waiting"],["cancelConfirm","Cancel code?"],["empJoined","Joined"],["blockConfirm","Block phone?"],["empBlocked","Blocked"]]],
  ["Not available", [["empNotField","Not a field worker"],["empAppOff","App switched off"]]],
  ["Settings, lists", [["fieldSettings","Field App Settings"],["settingsOffConfirm","Turn app off?"],["deviceList","All app phones"]]]
];

/* ── Render ──────────────────────────────────────────────────────────────── */
function renderStates(){
  var groups = S.view === "phone" ? GP : GD, cur = S.view === "phone" ? S.state : S.desk, h = "";
  for (var g=0; g<groups.length; g++){
    h += '<div class="sgroup" role="group" aria-label="'+groups[g][0]+'"><span class="gname">'+groups[g][0]+'</span>';
    for (var i=0;i<groups[g][1].length;i++){ var it = groups[g][1][i]; h += '<button type="button" data-jump="'+it[0]+'"'+(it[0]===cur?' aria-current="true"':'')+'>'+it[1]+'</button>'; }
    h += '</div>';
  }
  $("states").innerHTML = h;
}
function renderNote(){
  var key = S.view === "phone" ? S.state : S.desk, n = NOTE[key] || [key,"",""];
  var h = '<h2>'+n[0]+'</h2>'+(n[1]?'<p>'+n[1]+'</p>':'');
  if (n[2]) h += '<span class="dec">&#9888; Decision '+n[2]+' in 01b &sect;11</span>';
  if (S.view === "phone" && S.lang === "hi") h += '<p class="dec" style="margin-top:8px">Hindi on the phone is a machine draft. A native speaker must check it before anyone sees it.</p>';
  if (S.view === "phone") h += '<p style="margin-top:10px;font-size:13px">Every name, company, time and number here is invented.</p>';
  $("note").innerHTML = h;
}
function render(){
  var phone = S.view === "phone";
  $("phone").hidden = !phone; $("desk").hidden = phone;
  var po = document.querySelectorAll(".phone-only"), dO = document.querySelectorAll(".desk-only");
  for (var i=0;i<po.length;i++) po[i].hidden = !phone;
  for (var j=0;j<dO.length;j++) dO[j].hidden = phone;
  $("phone").className = "phone" + (S.w === "360" ? " w360" : "") + (S.appDark ? " follow-dark" : "");
  $("app").setAttribute("lang", S.lang);
  if (phone) { $("app").innerHTML = (APP[S.state] || APP.first)(); var sc0 = $("app").querySelector(".scroll"); if (sc0) sc0.scrollTop = 0; }
  else $("desk").innerHTML = (DESK[S.desk] || DESK.empField)();
  var segs = [["c-view","view"],["c-lang","lang"],["c-theme","th"],["c-width","w"],["c-shell","shell"],["c-viewer","viewer"]];
  for (var k=0;k<segs.length;k++){
    var bs = $(segs[k][0]).querySelectorAll("button");
    for (var m=0;m<bs.length;m++){
      var attr = bs[m].getAttribute("data-"+segs[k][1]) || bs[m].getAttribute("data-"+(segs[k][1]==="th"?"th":segs[k][1]));
      bs[m].setAttribute("aria-pressed", String(attr === S[segs[k][1]]));
    }
  }
  $("c-appdark").checked = S.appDark;
  if (S.th === "auto") document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", S.th);
  renderStates(); renderNote();
}

/* Presets for jumping straight to a screen. Clicking through the app keeps its own state. */
function preset(st){
  S.toast = ""; S.agreeErr = false;
  if (st === "home" || st === "welcome" || st === "locExplain" || st === "osLoc") { S.rows = []; S.camOn = true; }
  if (st === "homeIn" || st === "resultIn") { S.rows = ["IN"]; S.camOn = true; }
  if (st === "homeOut" || st === "resultOut") { S.rows = ["IN","OUT"]; S.camOn = true; }
  if (st === "camOff") { S.rows = []; S.camOn = false; }
  if (st === "punching") { S.rows = []; S.camOn = true; }
  if (st === "notice" || st === "noticeAgain") { S.agreed = false; S.rows = []; }
  if (st === "joining") S.agreed = true;
  if (st === "removed") S.toast = L("This phone is no longer linked to "+P.co+".","यह फ़ोन अब "+P.co+" से जुड़ा नहीं है।");
}
function go(st){
  clearTimers(); S.state = st;
  if (st === "checking") later(1200, function(){ S.agreed = false; go(S.next || "confirm"); S.next = "confirm"; });
  if (st === "joining") later(1200, function(){ S.rows = []; go("welcome"); });
  if (st === "punching") {
    S.busyI = 0;
    later(700, function(){ S.busyI = 1; render(); });
    later(1400, function(){ S.busyI = 2; render(); });
    later(2100, function(){ var nextType = lastRow() === "IN" ? "OUT" : "IN"; if (S.rows.length < TIMES.length) S.rows.push(nextType); S.firstPunch = false; go(nextType === "IN" ? "resultIn" : "resultOut"); });
  }
  render();
}
function dgo(st){ S.desk = st; render(); var d = $("desk").querySelector(".dk-dlg"); if (d) { var f = d.querySelector("select,button"); if (f) f.focus(); } }

document.addEventListener("click", function(e){
  var t = e.target.closest ? e.target.closest("[data-go],[data-act],[data-jump],[data-view],[data-lang],[data-th],[data-w],[data-shell],[data-viewer],[data-dgo],[data-dact]") : null;
  if (!t) return;
  if (t.hasAttribute("data-view")) { S.view = t.getAttribute("data-view"); clearTimers(); render(); return; }
  if (t.hasAttribute("data-lang")) { S.lang = t.getAttribute("data-lang"); if (S.state === "removed") preset("removed"); render(); return; }
  if (t.hasAttribute("data-th")) { S.th = t.getAttribute("data-th"); render(); return; }
  if (t.hasAttribute("data-w")) { S.w = t.getAttribute("data-w"); render(); return; }
  if (t.hasAttribute("data-shell")) { S.shell = t.getAttribute("data-shell"); render(); return; }
  if (t.hasAttribute("data-viewer")) { S.viewer = t.getAttribute("data-viewer"); render(); return; }
  if (t.hasAttribute("data-jump")) {
    var j = t.getAttribute("data-jump");
    if (S.view === "phone") { preset(j); go(j); }
    else { S.copied = ""; S.blockErr = false; if (j === "inviteCreate") S.fromDesk = "empField"; if (j === "empField") S.cancelled = false; dgo(j); }
    return;
  }
  if (t.hasAttribute("data-go")) { var g = t.getAttribute("data-go"); if (g === "first") S.toast = ""; if (g === "notice") S.agreeErr = false; go(g); return; }
  if (t.hasAttribute("data-act")) {
    var a = t.getAttribute("data-act");
    if (a === "pick" || a === "scanOk" || a === "retryJoin") { S.next = "confirm"; go("checking"); }
    else if (a === "agree") { if (S.agreed) go("joining"); else { S.agreeErr = true; render(); var cb = $("agree"); if (cb) cb.focus(); } }
    else if (a === "agreeAgain") { if (S.agreed) { go("home"); } else { S.agreeErr = true; render(); var cb2 = $("agree"); if (cb2) cb2.focus(); } }
    else if (a === "punch") { go(S.firstPunch ? "locExplain" : "punching"); }
    else if (a === "locOk") { S.firstPunch = false; go("punching"); }
    else if (a === "retryPunch") { go("punching"); }
    else if (a === "camOn") { S.camOn = true; render(); }
    else if (a === "store") { $("note").insertAdjacentHTML("beforeend", "<p class=\"dec\">Sample: this button would open Alvoraa in the Play Store, or the tester download link in a pilot build.</p>"); }
    else if (a === "remove") { S.rows = []; S.firstPunch = true; S.toast = L("This phone is no longer linked to "+P.co+".","यह फ़ोन अब "+P.co+" से जुड़ा नहीं है।"); S.state = "removed"; go("removed"); }
    return;
  }
  if (t.hasAttribute("data-dgo")) { var dg = t.getAttribute("data-dgo"); if (dg !== "inviteShow") S.copied = ""; if (dg === "blockConfirm") { S.blockErr = false; S.blockReason = ""; } if (dg === "inviteShow") S.copied = ""; dgo(dg); return; }
  if (t.hasAttribute("data-dact")) {
    var da = t.getAttribute("data-dact");
    if (da === "invite") { S.fromDesk = S.desk; dgo("inviteCreate"); }
    else if (da === "copyPic") { S.copied = "picture"; render(); }
    else if (da === "copyLink") { S.copied = "link"; render(); }
    else if (da === "cancelCode") { S.cancelled = true; dgo("empField"); }
    else if (da === "block") { if (!S.blockReason) { S.blockErr = true; dgo("blockConfirm"); } else { S.blockErr = false; dgo("empBlocked"); } }
    return;
  }
});
document.addEventListener("change", function(e){
  var t = e.target;
  if (t.id === "agree") { S.agreed = t.checked; if (t.checked && S.agreeErr) { S.agreeErr = false; var er = $("agree-err"); if (er) er.remove(); t.removeAttribute("aria-invalid"); } }
  else if (t.name === "applang") { S.lang = t.value; render(); }
  else if (t.id === "life") { S.life = t.value; }
  else if (t.id === "breason") { S.blockReason = t.value; if (t.value) { S.blockErr = false; } }
  else if (t.id === "appon" && !t.checked) { dgo("settingsOffConfirm"); }
  else if (t.id === "c-appdark") { S.appDark = t.checked; render(); }
});

render();
})();
</script>
