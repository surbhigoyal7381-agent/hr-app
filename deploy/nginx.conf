# Alvoraa HRMS – Multi-tenant Nginx reverse proxy
# Frappe selects the correct site from the Host header automatically.
# TLS_CERT_DIR=/etc/letsencrypt is bind-mounted at /etc/nginx/ssl.

# ── Who the caller really is (slice 014, OPS-19) ─────────────────────────────
# Frappe believes the FIRST address in X-Forwarded-For and keys its rate limits,
# login lock and "Restrict IP" check on it. So every proxy_set_header below sends
# only $remote_addr - never $proxy_add_x_forwarded_for, which kept whatever the
# caller wrote and let anybody pick a fresh address per request.
#
# Cloudflare. While DNS is "DNS only" (grey cloud), no request comes from these
# ranges and the lines below do nothing. If Cloudflare's proxy is switched on,
# requests arrive from Cloudflare, and nginx then takes the visitor's address
# from CF-Connecting-IP - ONLY for connections from these ranges; anyone else's
# CF-Connecting-IP is ignored. Without this, every visitor would look like a
# handful of Cloudflare addresses and the login limit would lock out whole
# companies.
#
# The list is Cloudflare's own, from https://www.cloudflare.com/ips-v4 and
# /ips-v6, read 2026-09-17. Check it once a year. If it goes stale, it fails
# safe: an unknown Cloudflare address counts as the caller, so limits get
# stricter, never looser.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream frappe_http {
    # Container name, not the `backend` alias: nginx sits on both the prod and
    # dev networks, and BOTH publish `backend`. An alias would round-robin
    # between production and dev.
    server compose-backend-1:8000;
    keepalive 32;
}

upstream frappe_ws {
    server compose-socketio-1:9000;
}

# ── Dev stack: separate Compose project, own database, own sites volume ────
upstream dev_http {
    server devstack-backend-1:8000;
    keepalive 32;
}

upstream dev_ws {
    server devstack-socketio-1:9000;
}

limit_req_zone $binary_remote_addr zone=kinexus_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=kinexus_api:10m    rate=120r/m;
# Slice 013 (US-24): the phone app's guest device paths get their OWN zone.
# The general kinexus_api zone is 120 a minute per address - a depot with 400
# phones on one Wi-Fi would be refused at the front door regardless of the
# per-phone limits inside the app code (AC-140 expects zero 429s there).
# 600 a minute, burst 100, keyed on the real address (AC-144).
limit_req_zone $binary_remote_addr zone=alvoraa_device:10m rate=600r/m;
# Slice 042 (SEC-1): Meta's WhatsApp webhook. Public and unsigned by the app,
# so the only thing between the internet and a tenant's message log is this
# limit. Meta sends delivery receipts in bursts from a few shared addresses.
limit_req_zone $binary_remote_addr zone=alvoraa_webhook:10m rate=300r/m;

# ── Compression (slice 036, OPS-26) ──────────────────────────────────────────
# The portal landing page, /hrms-employee, is about 1.05 MB of HTML. Sent as it
# is, that is several seconds on a shop phone on mobile data. Squeezed with gzip
# it is about 235 KB. Frappe compresses nothing itself, so nginx does it here.
#
# These lines apply to every server block below. HTML needs care - one kind of
# HTML page must NOT be compressed. See "BREACH" in the alvoraa.co block.
gzip              on;
# 5 on a scale of 1 to 9. Measured on the real page (2026-09-22): level 5 gives
# 235 KB for about half the CPU of level 6 (231 KB) and a third of level 9
# (229 KB). The higher levels buy almost nothing.
gzip_comp_level   5;
# Below about 1 KB the gzip wrapper costs more than it saves.
gzip_min_length   1024;
# Sends "Vary: Accept-Encoding", so a cache between us and the phone (Cloudflare,
# an office proxy) never hands the squeezed copy to a client that cannot read it.
gzip_vary         on;
# gzip_proxied is about the REQUEST, not about proxy_pass: nginx compresses
# Frappe's answers with `gzip on` alone. This setting decides what happens when
# the request itself came through another proxy (it carries a Via header) -
# which is the case if Cloudflare's proxy is ever switched on. The default, off,
# would then quietly stop all compression. `any` keeps it on.
gzip_proxied      any;
# Text only. nginx always includes text/html and does not let it be listed.
# Left out on purpose: images, PDFs, zips, and woff/woff2 fonts. They are
# compressed already; gzip would burn CPU and make them slightly bigger.
gzip_types
    text/css
    text/javascript application/javascript
    application/json application/manifest+json
    image/svg+xml
    text/xml application/xml application/rss+xml application/atom+xml
    application/vnd.ms-fontobject font/ttf font/otf;
# No gzip_static. It would serve ready-made .gz files from /assets/, but Frappe's
# build writes none (checked 2026-09-22 in the dev-3830ed3 image: zero), so nginx
# would only look for files that never exist.

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name *.alvoraa.co alvoraa.co *.alvox.in alvox.in _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── alvox.in → alvoraa.co permanent redirect ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name *.alvox.in alvox.in;

    ssl_certificate     /etc/nginx/ssl/live/alvox.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/alvox.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://alvoraa.co$request_uri;
}

# ── HTTPS – alvoraa.co (primary) ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name *.alvoraa.co alvoraa.co _;

    ssl_certificate     /etc/nginx/ssl/live/alvoraa-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/alvoraa-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size  50m;
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # The three login URLs: /api/method/login and the same under /api/v1/ and
    # /api/v2/. A regex location is chosen over the plain `location /api/` prefix
    # below, so these stay under the login limit.
    #
    # It is not every way to log in. Frappe also logs a caller in on ANY path
    # when the request carries cmd=login (frappe/auth.py, LoginManager.__init__),
    # which nginx cannot see in a form body. The brake for that is Frappe's own
    # per-user and per-IP login lock, which this file finally makes honest by
    # passing the real address.
    location ~ ^/api/(v1/|v2/)?method/login/?$ {
        limit_req zone=kinexus_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass          http://frappe_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        alias /home/frappe/frappe-bench/sites/assets/;
        access_log off;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # Not compressed: see BREACH below. A missing file here is answered by
    # Frappe's "page not found" page, which repeats the address. Real files are
    # mostly images and PDFs, which gzip leaves alone anyway, so nothing is lost.
    location /files/ {
        gzip off;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 042 (SEC-1): the WhatsApp webhook is public and the app does not
    # check Meta's signature. Rate-limited per address and capped at 1 MB; a
    # tenant without a WhatsApp Account ignores the call anyway.
    location ~ ^/api/method/frappe_whatsapp\.utils\.webhook\.webhook$ {
        limit_req zone=alvoraa_webhook burst=200 nodelay;
        client_max_body_size 1m;
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 013 (US-24): the punch carries one photo - a megabyte is plenty.
    location ~ ^/api/method/alvoraa_portal\.field_checkin\.field_checkin$ {
        limit_req zone=alvoraa_device burst=100 nodelay;
        client_max_body_size 1m;
        # add_header in a location REPLACES the server block's headers, so they
        # are repeated here (OPS-45), byte for byte from the block above.
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 013 (US-24): every other device call is a few hundred bytes of JSON.
    location ~ ^/api/method/alvoraa_portal\.(field_checkin\.(field_status|register_device)|field_app_join\.(check_code|refuse_code|join_with_code|acknowledge_notice|withdraw_agreement)|field_app_device\.remove_my_phone)$ {
        limit_req zone=alvoraa_device burst=100 nodelay;
        client_max_body_size 16k;
        # add_header in a location REPLACES the server block's headers, so they
        # are repeated here (OPS-45), byte for byte from the block above.
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Compressed. Frappe's JSON answers often repeat what was sent ("DocType x
    # not found"), but they never carry the CSRF token, so there is no secret
    # in them to guess.
    location /api/ {
        limit_req zone=kinexus_api burst=30 nodelay;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # ── BREACH: which HTML pages may be compressed ───────────────────────────
    # BREACH is an attack on compressed pages. If one page holds a secret AND
    # text the attacker chose, someone who can watch the encrypted traffic can
    # guess the secret from how the page size changes. Frappe puts the
    # session's CSRF token - the code that proves a form came from our own page
    # - in every signed-in page. Frappe's "page not found" page also repeats
    # the address that was asked for (data-path="..."). So a signed-in 404
    # holds both, and must not be compressed.
    #
    # Checked 2026-09-22 on the local bench: the pages named below carry the
    # token but write nothing from the address or query string into the page.
    # Unknown addresses (/hrms-employee/<anything>, /<anything>) 404 and repeat
    # the address.
    #
    # So HTML is compressed ONLY for the pages named here, matched exactly. A
    # longer address falls through to `location /`, which does not compress.
    # A new page is safe by default: it goes out uncompressed until someone
    # checks it and adds it. Before adding one, request it with a made-up word
    # in the path and in the query string, and confirm the word does not
    # appear in the HTML.
    #
    # /desk/... is included: the whole desk is one page, routed in the
    # browser, and the path is never written into the HTML. `^/$` is the home
    # page, which sends a signed-in user to the desk or the portal.
    location ~ ^/(hrms-employee|alvoraa-login|desk|desk/.*|vendor-portal|driver-portal|checkin|pms-employee|pms-manager|pms-calibration|pms-steering|jobs|update-password)?$ {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Every other page, including every "page not found". Not compressed: see
    # BREACH above.
    location / {
        gzip off;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}

# ── HTTPS – dev.alvoraa.co (dev stack) ───────────────────────────────────────
# An exact server_name wins over the *.alvoraa.co wildcard above, so this block
# takes dev.alvoraa.co and nothing else changes.
#
# *.dev.alvoraa.co is listed for future dev tenants. DNS already resolves, but
# the certificate does NOT cover it yet - that needs the wildcard cert work.
# Until then those hostnames work over HTTP and fail TLS.
server {
    listen 443 ssl;
    http2 on;
    server_name dev.alvoraa.co *.dev.alvoraa.co;

    ssl_certificate     /etc/nginx/ssl/live/alvoraa-wildcard/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/alvoraa-wildcard/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size  50m;
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    # The three login URLs: /api/method/login and the same under /api/v1/ and
    # /api/v2/. A regex location is chosen over the plain `location /api/` prefix
    # below, so these stay under the login limit.
    #
    # It is not every way to log in. Frappe also logs a caller in on ANY path
    # when the request carries cmd=login (frappe/auth.py, LoginManager.__init__),
    # which nginx cannot see in a form body. The brake for that is Frappe's own
    # per-user and per-IP login lock, which this file finally makes honest by
    # passing the real address.
    location ~ ^/api/(v1/|v2/)?method/login/?$ {
        limit_req zone=kinexus_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass          http://dev_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Dev's OWN assets. Serving them from the production volume would show
    # production's CSS and JS on dev the moment the two run different images -
    # the stale-asset fault that already cost a day.
    location ^~ /assets/ {
        alias /devstack-sites/assets/;
        access_log off;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    # Compression below follows the alvoraa.co block exactly - see BREACH there.
    location /files/ {
        gzip off;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 042 (SEC-1): the WhatsApp webhook is public and the app does not
    # check Meta's signature. Rate-limited per address and capped at 1 MB; a
    # tenant without a WhatsApp Account ignores the call anyway.
    # ALV-187: dev's copy must go to dev_http. It went to frappe_http, so Meta's
    # calls for *.dev.alvoraa.co reached production, which answered "does not exist".
    location ~ ^/api/method/frappe_whatsapp\.utils\.webhook\.webhook$ {
        limit_req zone=alvoraa_webhook burst=200 nodelay;
        client_max_body_size 1m;
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 013 (US-24): the punch carries one photo - a megabyte is plenty.
    location ~ ^/api/method/alvoraa_portal\.field_checkin\.field_checkin$ {
        limit_req zone=alvoraa_device burst=100 nodelay;
        client_max_body_size 1m;
        # add_header in a location REPLACES the server block's headers, so they
        # are repeated here (OPS-45), byte for byte from the block above.
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # Slice 013 (US-24): every other device call is a few hundred bytes of JSON.
    location ~ ^/api/method/alvoraa_portal\.(field_checkin\.(field_status|register_device)|field_app_join\.(check_code|refuse_code|join_with_code|acknowledge_notice|withdraw_agreement)|field_app_device\.remove_my_phone)$ {
        limit_req zone=alvoraa_device burst=100 nodelay;
        client_max_body_size 16k;
        # add_header in a location REPLACES the server block's headers, so they
        # are repeated here (OPS-45), byte for byte from the block above.
        add_header X-Frame-Options          "SAMEORIGIN"                    always;
        add_header X-Content-Type-Options   "nosniff"                       always;
        add_header X-XSS-Protection         "1; mode=block"                 always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
    location /api/ {
        limit_req zone=kinexus_api burst=30 nodelay;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    # The same list of pages as in the alvoraa.co block. Keep the two equal.
    location ~ ^/(hrms-employee|alvoraa-login|desk|desk/.*|vendor-portal|driver-portal|checkin|pms-employee|pms-manager|pms-calibration|pms-steering|jobs|update-password)?$ {
        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location / {
        gzip off;

        proxy_pass          http://dev_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $remote_addr;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
