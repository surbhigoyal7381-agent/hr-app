<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alvora — "Details a new joiner is asked for" · dialog overhaul v1</title>
<style>
/* ── Alvora design-system tokens, copied from design_system.html ─────────── */
html[data-theme="light"]{
  --bg:#F8F6F3;--surface:#FFFFFF;--surface2:#F0EDE8;--border:#E4E0D9;--border2:#C9C3B9;
  --text:#2D2622;--text2:#5A544E;--text3:#736D65;--primary:#5B4B8A;--primary-h:#4A3D73;
  --primary-d:#3D3461;--primary-lt:#EDEAF4;--green:#1B7F5A;--green-lt:#E8F4EF;
  --red:#B3261E;--red-lt:#FBEAE8;--amber:#94600F;--amber-lt:#FBF1E0;
  --sh1:0 1px 2px rgba(0,0,0,.05);--sh2:0 4px 12px rgba(0,0,0,.10);
}
html[data-theme="dark"]{
  --bg:#1A1815;--surface:#221E1B;--surface2:#2C2724;--border:#332F2B;--border2:#464039;
  --text:#F0EDE8;--text2:#C4BEB6;--text3:#A8A199;--primary:#A99AD4;--primary-h:#BBAEE0;
  --primary-d:#7A6BA8;--primary-lt:#2A2438;--green:#5DBF97;--green-lt:#12332A;
  --red:#F08A82;--red-lt:#3A1C1A;--amber:#E0A94A;--amber-lt:#33280F;
  --sh1:0 1px 2px rgba(0,0,0,.30);--sh2:0 4px 12px rgba(0,0,0,.45);
}
html{--font:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --r:10px;--r-sm:6px;--r-full:999px;
  --fs-xs:11px;--fs-sm:12px;--fs-base:13px;--fs-md:15px;--fs-lg:18px;--fs-xl:24px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);
  font-size:var(--fs-base)}

/* ── review scaffolding: wraps, never sticky, always above the scrim ─────── */
#rev{position:relative;z-index:3000;background:var(--surface);
  border-bottom:1px solid var(--border2);padding:10px 14px}
#rev h1{margin:0 0 2px;font-size:var(--fs-md)}
#rev p.sub{margin:0 0 10px;color:var(--text2);font-size:var(--fs-sm)}
.revrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.revrow > b{font-size:var(--fs-sm);min-width:62px;color:var(--text2);font-weight:650}
.rb{min-height:34px;padding:6px 11px;border:1px solid var(--border2);background:var(--surface);
  color:var(--text);border-radius:var(--r-full);font:inherit;font-size:var(--fs-sm);cursor:pointer}
.rb[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
html[data-theme="dark"] .rb[aria-pressed="true"]{color:#1A1815}
.rb:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.note{margin:8px 0 0;padding:8px 10px;border-left:3px solid var(--primary);
  background:var(--primary-lt);font-size:var(--fs-sm);line-height:1.5;max-width:900px}
.samp{display:inline-block;padding:0 6px;border-radius:var(--r-full);background:var(--amber-lt);
  color:var(--amber);border:1px solid var(--amber);font-size:var(--fs-sm);font-weight:700}

/* ── the stage: a frame that stands in for the app ───────────────────────── */
#stage{padding:18px;display:flex;justify-content:center}
.frame{position:relative;width:1100px;max-width:100%;background:var(--bg);
  border:1px solid var(--border2);border-radius:var(--r);overflow:hidden;min-height:720px}
.frame.ph{width:390px;zoom:1}
.frame.ph360{width:360px}
.frame.zoom2{width:195px;zoom:2}
.frame-lab{position:absolute;top:0;right:0;z-index:5;padding:2px 8px;font-size:var(--fs-sm);
  background:var(--text3);color:var(--surface);border-bottom-left-radius:var(--r-sm)}
.pad{padding:16px}

/* ── the people-settings card, as it is today ────────────────────────────── */
.pf-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:16px;box-shadow:var(--sh1)}
.pf-card > h3{margin:0 0 4px;font-size:var(--fs-md)}
.gp-hint{margin:6px 0;color:var(--text2);font-size:var(--fs-sm);line-height:1.55}
.btn{font:inherit;font-size:var(--fs-base);border-radius:var(--r-sm);padding:8px 14px;cursor:pointer}
.btn-outline{background:var(--surface);border:1px solid var(--border2);color:var(--text)}
.btn-primary{background:var(--primary);border:1px solid var(--primary);color:#fff}
html[data-theme="dark"] .btn-primary{color:#1A1815}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:2px}

/* ══ BEFORE: panels.css ocs- rules, copied verbatim from the product ═══════ */
.ocs-sec{padding-top:16px;margin-top:16px;border-top:1px solid var(--border2)}
.ocs-sec:first-child{padding-top:0;margin-top:0;border-top:0}
.ocs-h{margin:0 0 8px;font-size:var(--fs-base);font-weight:650;color:var(--text)}
.ocs-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ocs-chip{display:inline-block;padding:3px 9px;border-radius:var(--r-full);
  background:var(--bg);border:1px solid var(--border2);font-size:var(--fs-sm);color:var(--text)}
.ocs-cat{display:inline-block;margin-left:8px;padding:1px 7px;border-radius:var(--r-full);
  background:var(--bg);font-size:var(--fs-sm);color:var(--text3)}
.ocs-warn{display:block;margin:0 0 10px;padding:10px 12px;border-radius:var(--r-sm);
  background:var(--bg);border-left:3px solid var(--amber);font-size:var(--fs-base);
  line-height:1.5;color:var(--text)}
.ocs-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.ocs-b{min-height:44px;display:inline-flex;align-items:center;justify-content:center}
.ocs-b:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ocs-back{position:absolute;inset:0;z-index:1200;background:rgba(0,0,0,.45);
  display:flex;align-items:center;justify-content:center;padding:16px}
.ocs-dlg{background:var(--surface);border-radius:var(--r);width:620px;max-width:100%;
  max-height:100%;display:flex;flex-direction:column;box-shadow:var(--sh2)}
.ocs-dlg-hd{display:flex;align-items:center;gap:10px;padding:14px 16px;
  border-bottom:1px solid var(--border2)}
.ocs-dlg-hd h3{margin:0;flex:1;font-size:var(--fs-md);font-weight:650;color:var(--text)}
.ocs-x{min-width:44px;min-height:44px;background:none;border:0;font-size:var(--fs-xl);
  line-height:1;color:var(--text3);cursor:pointer}
.ocs-x:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.ocs-dlg-bd{padding:8px 16px 16px;overflow-y:auto;flex:1;min-height:0}
.ocs-grp{margin:14px 0 4px;font-size:var(--fs-sm);font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.04em}
.ocs-opt{display:flex;gap:10px;align-items:flex-start;min-height:44px;padding:6px 0;cursor:pointer}
.ocs-opt input{width:20px;height:20px;margin:3px 0 0;flex:none;accent-color:var(--primary)}
.ocs-opt b{font-weight:650;font-size:var(--fs-base);color:var(--text)}
.ocs-dlg-ft{padding:12px 16px;border-top:1px solid var(--border2)}
.ocs-sum{margin:0 0 10px;font-size:var(--fs-sm);color:var(--text2)}
.ocs-ft-b{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.ocs-opt .gp-hint label{display:inline-flex;gap:6px;align-items:center;min-height:30px}

/* ══ AFTER: the proposal. Prefix oc2-. Only what the change needs. ════════ */
/* One row per detail. The decision lives in columns, so the sentence that is
   repeated six times today becomes one column heading. */
.oc2-tbl{width:100%;border-collapse:collapse}
.oc2-tbl thead th{position:sticky;top:0;z-index:2;background:var(--surface);
  text-align:left;font-size:var(--fs-sm);font-weight:700;color:var(--text2);
  padding:8px 6px;border-bottom:1px solid var(--border2);vertical-align:bottom;line-height:1.35}
.oc2-tbl thead th.c{text-align:center;width:78px}
.oc2-tbl tbody td{padding:0;border-bottom:1px solid var(--border)}
.oc2-nm{font-size:var(--fs-base);font-weight:650;color:var(--text);padding:9px 6px 9px 0}
.oc2-nm .oc2-sub{display:block;font-weight:400;font-size:var(--fs-sm);color:var(--text2);
  margin-top:1px;line-height:1.4}
/* The whole cell is the 44 px target; the box is 20 px inside it. */
.oc2-cell{display:flex;align-items:center;justify-content:center;min-height:44px;
  cursor:pointer;margin:0}
.oc2-cell input{width:20px;height:20px;margin:0;accent-color:var(--primary)}
.oc2-cell:focus-within{outline:3px solid var(--primary);outline-offset:-3px;border-radius:var(--r-sm)}
/* Nothing to decide until the detail is asked for, so the cell is EMPTY -
   never a greyed box. visibility:hidden also takes it out of the tab order,
   so no row is ever redrawn and no keyboard focus is ever thrown away. */
tr.oc2-off .oc2-cell.oc2-n{visibility:hidden}
tr.oc2-need .oc2-nm::after{content:"";}
.oc2-grp td{background:var(--bg);font-size:var(--fs-sm);font-weight:700;color:var(--text3);
  text-transform:uppercase;letter-spacing:.04em;padding:10px 6px 4px}
.oc2-lead{margin:10px 0 2px;font-size:var(--fs-base);line-height:1.55;color:var(--text2)}
.oc2-tie{margin:2px 0 12px;padding:9px 11px;border-radius:var(--r-sm);background:var(--bg);
  border-left:3px solid var(--primary);font-size:var(--fs-sm);line-height:1.55;color:var(--text)}
.oc2-chip{display:inline-block;margin-left:7px;padding:1px 7px;border-radius:var(--r-full);
  background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber);
  font-size:var(--fs-sm);font-weight:700;vertical-align:1px}
/* Two rows on a laptop, deliberately: Preview left and Cancel right, then
   Save across the full width, because Save carries a sentence. */
.oc2-ft-b{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.oc2-ft-b .oc2-ok{flex:1 0 100%}
.oc2-ft-b .oc2-sp{flex:1 1 auto}
.oc2-ok{min-height:44px;display:inline-flex;align-items:center;justify-content:center;
  font-weight:650;text-align:center}
/* A preview of somebody else's screen, inside the dialog, so nobody has to
   save to find out. It is the joiner's own words, not ours. */
.oc2-prev{margin:0;padding:14px;background:var(--bg);border:1px dashed var(--border2);
  border-radius:var(--r-sm)}
.oc2-prev h4{margin:0 0 2px;font-size:var(--fs-md)}
.oc2-prev .pq{margin:12px 0 0}
.oc2-prev .pq b{display:block;font-size:var(--fs-base);font-weight:650}
.oc2-prev .pq i{display:block;font-style:normal;font-size:var(--fs-sm);color:var(--text2);margin:1px 0 4px}
.oc2-prev .pbox{height:40px;border:1px solid var(--border2);border-radius:var(--r-sm);
  background:var(--surface)}
.oc2-prev .pbox.tall{height:64px}
.oc2-back{position:absolute;inset:0;z-index:1300;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;padding:16px}
.oc2-sheet{background:var(--surface);border-radius:var(--r);width:520px;max-width:100%;
  max-height:100%;overflow:auto;box-shadow:var(--sh2)}
</style>
<!-- The phone rules are written ONCE, in the script below, and injected twice:
     as the product's own @media block, and copied under the frame classes. A
     hand-made second copy is how a prototype and a product drift. -->
<style id="ph-rules"></style>

<body>

<div id="rev">
  <h1>"Details a new joiner is asked for" — the picker, overhauled</h1>
  <p class="sub">Slice 079 · prototype v1 · 4 Nov 2026 · one dialog, four lists.
     Click a row's boxes, change list, change device, then press the footer button.
     No personal data is on this page.</p>

  <div class="revrow"><b>Version</b>
    <button class="rb" data-ver="before" aria-pressed="false">Before — what is there today</button>
    <button class="rb" data-ver="after"  aria-pressed="true">After — the proposal</button>
    <button class="rb" data-ver="min"    aria-pressed="false">Option B — smallest possible fix</button>
  </div>
  <div class="revrow"><b>List</b>
    <button class="rb" data-k="joiner"  aria-pressed="true">A new joiner (6)</button>
    <button class="rb" data-k="my"      aria-pressed="false">What an employee may correct (6)</button>
    <button class="rb" data-k="docs"    aria-pressed="false">Document types (18)</button>
    <button class="rb" data-k="profile" aria-pressed="false">Positions fields (11)</button>
  </div>
  <div class="revrow"><b>Device</b>
    <button class="rb" data-d="desk"  aria-pressed="true">Laptop 1100</button>
    <button class="rb" data-d="ph"    aria-pressed="false">Phone 390</button>
    <button class="rb" data-d="ph360" aria-pressed="false">Phone 360</button>
    <button class="rb" data-d="zoom2" aria-pressed="false">Phone at 200% text</button>
  </div>
  <div class="revrow"><b>Theme</b>
    <button class="rb" data-t="light" aria-pressed="true">Light</button>
    <button class="rb" data-t="dark"  aria-pressed="false">Dark</button>
  </div>
  <p class="note" id="rev-note"></p>
</div>

<div id="stage"><div class="frame" id="frame"><div class="frame-lab" id="frame-lab">Laptop</div>
  <div class="pad" id="card"></div>
  <div id="dlg-host"></div>
</div></div>

<script>
"use strict";
/* ─────────────────────────────────────────────────────────────────────────────
   One source for the phone rules. The product's own @media block, plus the
   same text copied under the frame classes so the frame behaves like a phone
   inside a desktop browser. Pattern D1, slice 009.
   ────────────────────────────────────────────────────────────────────────── */
var PHONE_CSS = [
  /* today's rules, verbatim from panels.css, minus the order:-1 line the      */
  /* proposal deletes (see finding F8) - the BEFORE view adds it back itself.  */
  ".ocs-back{padding:0;align-items:stretch}",
  ".ocs-dlg{width:100%;border-radius:0;max-height:none}",
  ".ocs-ft-b{flex-direction:column}",
  ".ocs-ft-b .ocs-b{width:100%}",
  /* the proposal's own phone rules */
  /* Stacked in DOM order, so what is read matches what is tabbed, and the
     bottom of the screen - where the thumb lands - is Save, not Cancel. */
  ".oc2-ft-b{flex-direction:column}",
  ".oc2-ft-b .ocs-b,.oc2-ft-b .oc2-ok{width:100%}",
  ".oc2-ft-b .oc2-sp{display:none}",
  ".oc2-tbl thead th.c{width:58px}",
  ".oc2-back{padding:0;align-items:stretch}",
  ".oc2-sheet{width:100%;border-radius:0;max-height:none}"
].join("\n");
(function injectPhoneCss() {
  var pref = ["ph", "ph360", "zoom2"].map(function (c) {
    return PHONE_CSS.replace(/^\./gm, ".frame." + c + " .");
  }).join("\n");
  document.getElementById("ph-rules").textContent =
    "@media (max-width:640px){\n" + PHONE_CSS + "\n}\n" + pref
    + "\n.frame.ph .ocs-ft-b [data-ocs=ok].oldorder{order:-1}";
})();
</script>
<script>
"use strict";
function esc(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function el(id){return document.getElementById(id);}

/* ── the audience figure. Real on a real tenant; SAMPLE here. ────────────── */
var PEOPLE = 7, ROLES = "HR Manager, System Manager";

/* ── The six details, with the words from BOTH screens side by side ────────
   Left: what this dialog calls it (OCS_MY_WORDS, portal.js).
   Right: the question the joiner actually reads (LABELS, joining.html).
   They are two lists in two files today, which is why the dialog cannot
   honestly say what the joiner sees. */
var SIX = [
  ["cell_number",            "Mobile number",            "Your mobile number",      "The number we will ring"],
  ["personal_email",         "Personal email",           "Your email",              ""],
  ["current_address",        "Where they live now",      "Where you live now",      "Where post reaches you today"],
  ["person_to_be_contacted", "Emergency contact name",   "Who to ring in an emergency", "A name we can ask for"],
  ["relation",               "How they are related",     "How they are related to you", "Wife, brother, friend"],
  ["emergency_phone_number", "Emergency contact number", "Their phone number",      "A number that will be answered"]
];
var PROFILE_11 = [
  ["designation","Job role"],["department","Department"],["branch","Branch"],
  ["company","Company"],["reports_to","Reports to"],["grade","Grade"],
  ["employment_type","Kind of employment"],["date_of_joining","In the company since"],
  ["default_shift","Usual shift"],["company_email","Work email"],
  ["alvoraa_alternative_number","Alternative number"]
];
/* The 18 real document types at the PP Jewellers demo copy, read from the
   bench on 4 Nov 2026. Type names are configuration, not anybody's data. */
var DOCS_18 = [
  ["Address proof (current)","Address",1,"collected by HR","12 given so far"],
  ["Signed policy acknowledgement","Company Issued",0,"collected by HR","nobody has given one"],
  ["Vault access authorisation","Company Issued",0,"collected by HR","nobody has given one"],
  ["Highest education certificate","Education",0,"collected by HR","3 given so far"],
  ["Last 3 months' salary slips","Employment",0,"collected by HR","nobody has given one"],
  ["Previous employer relieving letter","Employment",0,"collected by HR","1 given so far"],
  ["Signed offer and appointment letter","Employment",0,"collected by HR","nobody has given one"],
  ["Aadhaar card","Identity",1,"collected by HR","41 given so far"],
  ["PAN card","Identity",1,"collected by HR","38 given so far"],
  ["Passport-size photographs","Identity",0,"collected by HR","nobody has given one"],
  ["Bank account proof","Statutory",0,"collected by HR","9 given so far"],
  ["ESI number (if applicable)","Statutory",0,"collected by HR","nobody has given one"],
  ["Security agency licence","Statutory",0,"collected by HR","nobody has given one"],
  ["UAN / PF details","Statutory",0,"collected by HR","4 given so far"],
  ["Background verification report","Verification",0,"collected by HR","nobody has given one"],
  ["Police verification acknowledgement","Verification",0,"collected by HR","nobody has given one"],
  ["Police verification certificate","Verification",0,"collected by HR","2 given so far"],
  ["Reference check note","Verification",0,"collected by HR","nobody has given one"]
];
var SENSITIVE = ["Identity","Statutory","Verification","Employment","Address"];

/* ── the four lists, one object each ─────────────────────────────────────── */
var LISTS = {
  joiner: {
    title: "Details a new joiner is asked for",
    lead: "These are the questions on the joining form a new starter fills in before "
        + "their first day. A joiner is asked for nothing at all until you tick it here.",
    c1: "Asked for", c2: "Must fill in",
    tie: "A detail you tick under <b>Must fill in</b> shows the joiner a "
       + "<span class=\"oc2-chip\">Needed</span> beside the question, and they cannot send "
       + "the form until they have filled it in. Everything else they may leave blank.",
    rows: SIX.map(function (r) { return { k: r[0], nm: r[1], sub: "The joiner reads: “" + r[2] + "”" }; }),
    on: ["cell_number","personal_email","current_address","person_to_be_contacted","relation","emergency_phone_number"],
    need: ["cell_number","personal_email","current_address","person_to_be_contacted","relation","emergency_phone_number"],
    oldc2: "Must fill in before they can send the form",
    prev: "joiner"
  },
  my: {
    title: "Details an employee may correct about themselves",
    lead: "These are the details an employee can change on their own My Profile page. "
        + "My Profile never refuses a save — anything you keep asking for is asked "
        + "again on every visit, not blocked.",
    c1: "They may change it", c2: "Keep asking",
    tie: "A detail you tick under <b>Keep asking</b> shows the employee a "
       + "<span class=\"oc2-chip\">Needed</span> until it is filled in. It never stops them saving.",
    rows: SIX.map(function (r) { return { k: r[0], nm: r[1], sub: "" }; }),
    on: ["cell_number","personal_email","current_address"],
    need: ["cell_number"],
    oldc2: "Keep asking for it",
    prev: "self"
  },
  docs: {
    title: "Document types shown on a person's profile",
    lead: "Tick a type and anyone who can open the Positions page can open the file "
        + "itself — " + PEOPLE + " people today (" + ROLES + "). <span class=\"samp\">Sample count</span>",
    c1: "Shown", c2: "",
    tie: "", grouped: true,
    on: ["Aadhaar card","PAN card","Address proof (current)"],
    need: [], prev: "reader"
  },
  profile: {
    title: "Details a Positions reader may see",
    lead: "These are the job details shown beside a person's name on the Positions page "
        + "and the organisation chart — seen by " + PEOPLE + " people today "
        + "(" + ROLES + "). <span class=\"samp\">Sample count</span>",
    c1: "Shown", c2: "", tie: "",
    rows: PROFILE_11.map(function (r) { return { k: r[0], nm: r[1], sub: "" }; }),
    on: ["designation","department","branch","reports_to","date_of_joining"],
    need: [], prev: "reader"
  }
};
/* the document rows, grouped the way the product groups them */
LISTS.docs.rows = DOCS_18.map(function (d) {
  return { k: d[0], nm: d[0], cat: d[1],
           sub: [d[3], d[4], d[2] ? "needed to join" : ""].filter(Boolean).join(" · ") };
});

var S = { v: "after", k: "joiner", d: "desk", t: "light", pick: {}, need: {}, open: false };
function reset(k) {
  S.pick = {}; S.need = {};
  LISTS[k].on.forEach(function (x) { S.pick[x] = 1; });
  LISTS[k].need.forEach(function (x) { S.need[x] = 1; });
}
function chosen() { return Object.keys(S.pick).filter(function (x) { return S.pick[x]; }); }
function needed() { return Object.keys(S.need).filter(function (x) { return S.need[x] && S.pick[x]; }); }
function sens() {
  return chosen().filter(function (n) {
    var r = LISTS.docs.rows.filter(function (x) { return x.k === n; })[0];
    return r && SENSITIVE.indexOf(r.cat) >= 0;
  });
}
</script>
<script>
"use strict";
/* ── the card the dialog opens from. Unchanged, EXCEPT the second button the
      proposal puts on it for the four values ALV-304 is about. ───────────── */
function cardHtml() {
  var L = LISTS[S.k], on = chosen(), nd = needed();
  var chips = on.length
    ? '<div class="ocs-chips">' + L.rows.filter(function (r) { return S.pick[r.k]; })
        .map(function (r) {
