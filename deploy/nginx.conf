# Alvoraa HRMS – Multi-tenant Nginx reverse proxy
# Frappe selects the correct site from the Host header automatically.
# TLS_CERT_DIR=/etc/letsencrypt is bind-mounted at /etc/nginx/ssl.

upstream frappe_http {
    server backend:8000;
    keepalive 32;
}

upstream frappe_ws {
    server socketio:9000;
}

limit_req_zone $binary_remote_addr zone=kinexus_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=kinexus_api:10m    rate=120r/m;

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
server {
    listen 80;
    server_name *.alvoraa.co alvoraa.co *.alvox.in alvox.in _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── alvox.in → alvoraa.co permanent redirect ─────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name *.alvox.in alvox.in;

    ssl_certificate     /etc/nginx/ssl/live/alvox.in/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/alvox.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://alvoraa.co$request_uri;
}

# ── HTTPS – alvoraa.co (primary) ─────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name *.alvoraa.co alvoraa.co _;

    ssl_certificate     /etc/nginx/ssl/live/alvoraa.co/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/alvoraa.co/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size  50m;
    proxy_read_timeout    120s;
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;

    add_header X-Frame-Options          "SAMEORIGIN"                    always;
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(self), camera=()"  always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location = /api/method/login {
        limit_req zone=kinexus_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /socket.io {
        proxy_pass          http://frappe_ws;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        alias /home/frappe/frappe-bench/sites/assets/;
        access_log off;
        expires     30d;
        add_header  Cache-Control "public, immutable";
        try_files   $uri =404;
    }

    location /files/ {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=kinexus_api burst=30 nodelay;

        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass          http://frappe_http;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}
