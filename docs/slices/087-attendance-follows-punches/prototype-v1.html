body{margin:0;font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

button{font:inherit;cursor:pointer}
/* review scaffolding, not product */

#demo .g{display:flex;gap:4px;align-items:center;flex-wrap:wrap}

#demo button{border:1px solid var(--border2);background:var(--surface);color:var(--text);border-radius:var(--r-sm);padding:5px 9px;min-height:32px}
#demo button[aria-pressed=true]{background:var(--primary);color:#fff;border-color:var(--primary)}
#demo .sample{background:var(--amber-lt);color:var(--amber);border:1px solid var(--amber);border-radius:var(--r-sm);padding:2px 8px;font-weight:700;font-size:12px}
#stage{margin:16px auto;background:var(--bg)}
#stage.desktop{max-width:1040px;padding:0 16px}
#stage.phone{width:390px;max-width:100%;border:10px solid #2a2a2e;border-radius:30px;background:var(--bg);box-shadow:var(--sh3);overflow:hidden}
#stage.phone.p360{width:360px}
.app-h{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;font-weight:700;font-size:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.app-h small{font-weight:400;font-size:13px;color:var(--text3)}
.pad{padding:14px 16px 28px}
.desktop .pad{padding:18px 0}
/* components copied from panels.css (ac-*), same names */
.ac-tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 7px;border-radius:var(--r-sm);border:1px solid var(--border);color:var(--text3);background:var(--surface2);margin-left:6px;vertical-align:1px}
.ac-tag.ok{border-color:var(--green);background:var(--green-lt);color:var(--green)}
.ac-tag.held{border-color:var(--amber);background:var(--amber-lt);color:var(--amber)}
.ac-tag.wait{border-color:var(--primary);background:var(--primary-lt);color:var(--primary)}
.ac-tag.added{border-color:var(--green);background:var(--green-lt);color:var(--green)}
.ac-tag.aside{border-color:var(--border2);background:var(--surface2);color:var(--text2)}
.dayrow{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:52px;padding:8px 12px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--r-sm);margin-top:8px}
.dayrow[aria-expanded=true]{border-color:var(--primary);border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
.dayrow .d{font-weight:700}.dayrow .s{font-size:13px;color:var(--text2);text-align:right}
.ac-detail{border:1px solid var(--primary);border-top:0;background:var(--surface);padding:14px 12px;border-radius:0 0 var(--r-sm) var(--r-sm);font-size:14px;color:var(--text2);line-height:1.6}
.ac-facts{display:flex;flex-wrap:wrap;gap:8px 18px;margin-bottom:10px}
.ac-facts div{font-size:12px;color:var(--text3);font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.ac-facts div span{display:block;font-size:15px;color:var(--text);font-weight:700;letter-spacing:0;text-transform:none;font-variant-numeric:tabular-nums}
.ac-punches{display:flex;flex-direction:column;gap:6px;margin:8px 0 12px}
.pn{border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 10px;background:var(--surface);font-size:14px;color:var(--text2);font-variant-numeric:tabular-nums}
.pn b{color:var(--text)}
.pn.aside{background:var(--surface2)}
.pn.aside .tm{text-decoration:line-through;text-decoration-thickness:2px}
.pn.added{border-color:var(--green)}
.pn .why{display:block;font-size:13px;color:var(--text2);margin-top:2px}
.ac-heldbox,.ac-okbox,.ac-waitbox,.ac-nobox{border:1px solid var(--amber);background:var(--amber-lt);border-radius:var(--r-sm);padding:12px;margin-bottom:10px}
.ac-okbox{border-color:var(--green);background:var(--green-lt)}
.ac-waitbox{border-color:var(--primary);background:var(--primary-lt)}
.ac-nobox{border-color:var(--border2);background:var(--surface2)}
.ac-heldbox h3,.ac-okbox h3,.ac-waitbox h3,.ac-nobox h3{margin:0 0 4px;font-size:15px}
.ac-heldbox h3{color:var(--amber)}.ac-okbox h3{color:var(--green)}.ac-waitbox h3{color:var(--primary)}.ac-nobox h3{color:var(--text)}

.ac-form h3{margin:0 0 8px;font-size:16px;color:var(--text)}
.ac-form fieldset{border:0;padding:0;margin:0 0 12px}
.ac-form legend,.form-label{font-weight:700;color:var(--text);font-size:14px;padding:0;margin-bottom:6px;display:block}

.opt:has(input:checked){border-color:var(--primary);background:var(--primary-lt)}
.opt input{width:22px;height:22px;margin:2px 0 0;flex:none;accent-color:var(--primary)}
.opt .t{font-weight:600;display:block}.opt .h{font-size:13px;color:var(--text2);display:block}
.ac-form input[type=time],.ac-form textarea{font:inherit;font-size:16px;padding:8px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);width:100%;max-width:420px;min-height:48px}
.ac-form textarea{min-height:72px;resize:vertical}
.ac-help{font-size:13px;color:var(--text3);margin:5px 0 10px;line-height:1.5}

.ac-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{min-height:48px;padding:8px 16px;border-radius:var(--r-sm);border:1px solid var(--border2);background:var(--surface);color:var(--text);font-weight:600;font-size:15px}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}

.ac-req .m{font-size:13px;color:var(--text3);margin-top:2px}
.ac-req .note{font-size:13px;color:var(--text2);margin-top:6px;border-left:2px solid var(--border);padding-left:9px;line-height:1.5}
.ac-req .row-punch{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 9px;background:var(--surface);font-size:13px;font-variant-numeric:tabular-nums}
.chip.added{border-color:var(--green);color:var(--green);font-weight:700}
.chip.aside{text-decoration:line-through;color:var(--text3);background:var(--surface2)}
.result{margin:8px 0 0;padding:8px 10px;border-radius:var(--r-sm);background:var(--green-lt);border:1px solid var(--green);color:var(--text);font-size:14px}
.result.warn{background:var(--amber-lt);border-color:var(--amber)}
.result.stop{background:var(--surface2);border-color:var(--border2)}
.hrhead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#2D2622;color:#fff;padding:10px 16px;border-radius:var(--r);box-shadow:var(--sh3);z-index:60;max-width:92vw;display:none;font-size:14px}
#toast.err{background:var(--red);}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal .box{background:var(--surface);color:var(--text);border-radius:var(--r);padding:18px;max-width:460px;width:100%;box-shadow:var(--sh3)}
#modal textarea{width:100%;font:inherit;font-size:16px;min-height:72px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--surface);color:var(--text);padding:8px}
.sec{font-size:13px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 6px}
.sr{position:absolute;left:-9999px}

 return{n:n,held:held,work:w,late:late,status:held?"Held":"Present"}}

function modal(kind,id){var m=document.getElementById("modal"),b=m.querySelector(".box");
 var isApp=kind==="approve";
 b.innerHTML='<h2 id="mt" style="margin:0 0 8px;font-size:16px">'+(isApp?t("p_h"):t("p_d"))+"</h2>"+(isApp&&S[id]?"<p class='ac-help'>"+t("p_add_note")+"</p>":"")+'<textarea id="mnote" aria-labelledby="mt"></textarea><div id="merr" class="err" role="alert" style="display:none">'+t("need_reason")+'</div><div class="ac-acts"><button class="btn btn-primary" onclick="mok(\''+kind+'\',\''+id+'\')">'+(isApp?t("p_ok"):t("p_decline"))+'</button><button class="btn" onclick="mclose()">'+t("p_back")+"</button></div>";
 m.style.display="flex";document.getElementById("mnote").focus()}
function mclose(){document.getElementById("modal").style.display="none"}
function mok(kind,id){var n=document.getElementById("mnote").value.trim();
 if(kind==="decline"&&!n){document.getElementById("merr").style.display="";return}
 mclose();
 if(S[id]){var d=S[id];
  if(kind==="approve"){var r=d.req;if(r.time)d.p.push({t:r.time,lt:kindIO(r.kind),src:"HR"});
   d.p.forEach(function(x){if(r.set.indexOf(x.t)>-1)x.aside=true});d.stage="approved";d.on=ON();toast(t("toast_ap",r.time?r.time:"",t("Present")))}
  else{d.stage="declined";d.dnote=n;toast(t("toast_dec"))}}
 else{S.hr[id]=true;toast(kind==="approve"?t("toast_ap","",t("Present")):t("toast_dec"))}
 render()}
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display="none"},3500)}
document.addEventListener("keydown",function(e){if(e.key==="Escape")mclose()});
document.getElementById("demo").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;
 if(b.id==="reset"){fresh();render();return}
 if(b.dataset.p){WHO=b.dataset.p;if(WHO!=="emp"&&DEV!=="desktop")DEV="desktop";if(WHO==="emp"&&DEV==="desktop")DEV="phone"}if(b.dataset.d){DEV=b.dataset.d}if(b.dataset.l){LANG=b.dataset.l}if(b.dataset.t){THEME=b.dataset.t}render()});
render();
</script></body></html>
