<!-- Slice 043, Wave 3: the Time screen's skeleton.

     Server-rendered, so a person on a slow phone sees the shape of the page
     while `get_time` is still in the air (043 AC-32). A skeleton, never a
     spinner on a blank screen: a blank screen reads as "you did not work",
     which is the most expensive wrong message this particular screen can send.

     This is an `ess_part`, not a Jinja include: it holds no template tag at
     all, so it is pasted in rather than compiled and it takes none of Frappe's
     32 template cache slots (AC-44). `ess_part()` REFUSES a file containing a
     template tag of any kind - which is why this comment describes them rather
     than spelling them out.

     The shapes match what replaces them: a row of statistics, a month grid,
     then the day list. A skeleton whose shape is wrong is a page that jumps
     when the answer lands.

     No number is in here, and no day state. Every box is decorative and hidden
     from a screen reader; the state box above it is what announces "Loading".
     Two voices saying the same thing is worse than one. -->
<div class="nf-skeleton" id="nf-skeleton-time" aria-hidden="true" hidden>
  <div class="nf-sk nf-sk-row"></div>
  <div class="nf-sk nf-sk-grid"></div>
  <div class="nf-sk nf-sk-card"></div>
  <div class="nf-sk nf-sk-row"></div>
  <div class="nf-sk nf-sk-row"></div>
</div>
